少なくとも数年はかかるけれど、十年くらいの気持ちで複利を信じてやり続けてほしい。そして大事なのは、結果を待つ力。やり続けながら結果を待つ力です。すぐに結果を求めるのは、自分にとってすごく損なんです。長く続けたことは、ある時期に大きな実りをもたらしてくれます。"], [1162, "ジョン", "もう一つは、りせさんと最初に会った頃にも話したことだと思いますが、人生を自由に豊かに生きている人たちの共通点は、価格ではなく価値を見ることです。だから、安いから買ったりしないし、高いから諦めたりもしない。僕の持論は「人生は価値の最大化の旅」。体力、時間、知性、そしてお金。持っている資産を、価値を最大にすることに使うんです。お金が豊かにならない人は、常に価格を見る。価格を見る人は、価値を大きくすることができない。これを逆転させることが大事です。"], [1245, "ジョン", "最近イタリアに10日ほど行っていたんですが、ベネチアは観光客が多くてホテルがすごく高いんです。昔の僕なら絶対に安いところに泊まって、翌日おいしいものを食べるためにお金を残したと思います。でも今は価値を見ているので、安いところには泊まらない。安すぎる宿に泊まると、翌日に体調を崩したりする。その損害はとても大きいんです。高いところは清潔で、親切で、部屋も広い。そうやって価値を積み上げていって、自分にとってそれだけの価値があると思えたら、お金を払うんです。その価値の積み重ねが、人生の財産になります。"], [1335, "ジョン", "だから今日お伝えしたいのは、コスパの思考を完全に捨てること。コスパで得をしようという思考が出てきたら、「また出てきた」と気づいて、まず価値を見る。タクシーも、値段は同じでも、忙しい時や疲れている時は価値が全然違いますよね。自分の価値に比べて安いと思えば、一般的に高いと言われてもお金を払う。逆に、価値を考えずに安いからやる、を続けると、永遠にお金で豊かになることも、成長することもできないし、思い出も作れない。未来の自分に後悔をプレゼントすることになるんです。"], [1415, "ジョン", "服を買う時も、つい先に値札を見ちゃうでしょう。僕も昔はそうでした。でもまず値段は見ない。気に入ったものがあったら、これは自分にとってどんな価値があるのかを想像する時間を一つ持つ。今度の食事会に着ていった時のワクワク、年に何回くらい着るか。そうやって価値を計算すると、どんな買い物も安いんです。価値を考えない人には、どんな買い物も高い。同じものでも、価値を考えて買うかどうかで、生み出す価値が全く違ってきます。"], [1509, "ジョン", "三つ目に実践してほしいのは、お金を「もう1人の自分の分身」にすることです。たとえば体調を崩したら労働はできないし、寝ている間も働けない。自分の体だけに頼ると、柱は一つしかないんです。そうすると常に不安になる。だから早い段階で、少額でもいいので、お金に働いてもらう体験を始めてほしい。本当のお金持ちは、1人残らずお金に働いてもらっています。お金は、皆さんが寝ている間も、入院している間も、裏切らずに働いてくれる。その働かせ方には知恵が必要なので、りせさんから学ぶのはすごく大事です。"], [1610, "ジョン", "ぜひ、今年が終わる前に、今まで投資したことがなくても全然いいので、投資を始めてほしい。皆さんが自分の時間と体力と知力を使わなくても、もう1人の分身が収入を作り出してくれる仕組みを、今年中に作ってほしいんです。そうすると本当に心強くなります。お金を稼ぐために働くことは、とても尊いことです。でも人生のある瞬間に、主人と従う側の関係を逆転させることが大事。自分が働いて稼ぐお金より、お金に働いてもらって稼ぐお金が上回る分岐点を、できるだけ早く人生に持ってくる。一度それを迎えれば、残りの人生は複利が解決してくれます。"], [1700, "ジョン", "そうなると、本当に心が喜ぶ仕事、自分が成長できる仕事、誰かに貢献できる仕事に専念できるようになる。お金の不安で選ぶのではなく、本当に大切だと思うところに時間を使えるようになるんです。人間の悩みのほとんどは人間関係から来ると言われますが、お金に余裕があれば、その悩みの多くも消えていきます。お金が自分の人生の味方になって、自分以上に人生を支えてくれる存在だと思えた瞬間から、経済的に自立するだけでなく、穏やかさを手に入れることができる。余裕があると、美しいものに感動できるし、迷わずに人に優しくできるんです。"], [1820, "ジョン", "逆に、お金がなくて余裕がない生活が続くと、判断力も下がります。焦りがあるので、本来出せる力の一部しか出せなくなる。お金のパワーをマイナスに使うかプラスに使うかで、皆さんが本来持っている力の発揮のしかたと、その結果の大きさが劇的に変わるんです。だから、お金について学ぶこと、価格ではなく価値で生きること、そしてお金という分身を作ること。始めるのに大きな元手はいりません。早く始めるほど、複利の魔法を早く大きく体験できます。"], [1922, "りせ", "大学の講義のようなお話、ありがとうございます。頷きが止まりませんでした。"], [1937, "ジョン", "お金のことは、周りの誰も教えてくれないし、親もほぼ教えません。僕がもし若い女性だったら、りせさんのような、お金のことだけではなく、人生のためのお金を学んで高め合うコミュニティに行くと思います。そうすると土地勘がすぐにつく。1人でやると、何年かかってもそこはアウェイだから入れないんです。目を閉じたまま山に入るのと同じ。その怖さは、僕もよく分かります。何十年も、お金について一行も見たくなかった。15冊も本を書いてきたのに、本の中でお金のことを書かなさすぎて、前書きを書いてくださった方に「お金という字が見つからなくて驚いた」と言われたくらいです。"], [2048, "ジョン", "でも今は、そこから光が差すようになりました。もし過去の自分に30分だけ会いに行けたら、複利の話、価値の話、そして「今日からお金に働いてもらう仕組みを作りなさい」と伝えて帰ってくると思います。皆さんがお金について、怖くても今日から向き合い始めることで、未来の自分を幸せにして、未来の自分に褒められる人生を生きることができるようになる。どこかに投資してください、という話ではないんです。お金に心を開くと、お金は暗闇ではなく光になってくれる。未来の皆さんの同伴者になってくれます。"], [2152, "りせ", "このライブが決まったのは、本当に久しぶりに偶然お会いしたのがきっかけでした。私は今1児の母なんですが、しばらくお会いしていなかったので、妊娠のご報告もできていなかったんです。そうしたら、ジョンさんからお金の大切さのお話をしてくださって。ジョンさんご自身は、運用を始める時どうでしたか？"], [2211, "ジョン", "最初は、やっぱり心理的なハードルは高かったです。でも僕は学者出身なので、ある時、お金について研究しようと思って、20世紀のアメリカのお金に関する名著を取り寄せて全部読んだんです。そうすると、正解が見えてきました。始める時の鉄則は、まず長期運用が大前提。二つ目は分散させること。三つ目は余裕資金でやること。誰かのお金を借りたり、生活費を使って運用したりしたら絶対にダメです。株価が上下しても感情が乱れすぎないお金、それが余裕資金です。あとは手数料が安いこと。手数料はすごく大事です。そして会社員の方なら、積み立てていくこと。"], [2310, "ジョン", "この原則を守って考えると、選ぶ商品はいくつかに絞られてきます。全世界の株にまとめて投資するものや、アメリカの代表的な企業にまとめて投資するもの、最先端技術が好きならハイテク企業中心のもの。ネット証券で口座を開いて、手数料を見て選べば、まず大きな間違いはないと思います。数年の間に元本を下回ることはあり得ますが、長期で考えるのが前提です。できれば十年くらいの視野で持っておく。歴史的に見ても、長い期間で見れば大きく成長してきました。気になる方は、AIで「10年前に投資していたら今いくら？」と調べてみてください。"], [2490, "ジョン", "銀行にお金を入れたままにしておくのは、見えない税金を払っているのと同じです。金利はほとんどつかないのに、物価はどんどん上がっていく。請求書が来ないので、払っている感覚がないだけなんです。10年前に投資を始めなかった自分は、叱られるべきだと思うくらい。なぜできないかというと、投資への恐怖があるから。その恐怖の原因は、知らないことと思い込みです。人はもともと損をすることを極端に怖がる性質もあるので、そこを突破して、最初の一歩を踏み出すことが大事なんです。"], [2552, "ジョン", "それに今はNISAがあります。NISAを使わないのも、見えない税金を払っているのと同じ。通常、投資で出た利益には税金がかかりますが、NISAならそれが免除される。これは本当に、国からのプレゼントです。まずは長期・分散・余裕資金でやるインデックス投資を、ネット証券で口座を作って、少額からでいいので始めてほしい。その体験を今年中にぜひしてほしいし、りせさんにそう導いてほしい。少しでも土地勘がつくと、お金の見え方が全く変わります。そしてこれは、男性よりも女性が絶対に始めるべきだと思っています。"], [2663, "りせ", "NISAがプレゼント、というのはまさにその通りで、今の新しいNISAになってからは、やらない理由がないと思います。まだの方は、まず口座開設から始めてほしいですね。"], [2700, "ジョン", "昔は窓口でやるとすごく手数料がかかったりしましたが、今はネットで完結すれば、ほとんど費用がかかりません。情報にも恵まれている。すごくいい時代です。"], [2736, "ジョン", "女性が特に投資をしたほうがいい理由は、いくつかあります。一つは、人生が長いこと。女性は男性より寿命が長いので、そのぶんお金がもっと必要になる。年金だけでは足りないので、年を取っても自分の代わりに働き続けてくれる投資があると、すごく心強い。二つ目は、キャリアが途切れやすいこと。りせさんの単独ライブも見ましたが、お母さんになったら、スマホを見る時間すらないくらい手が離せない。キャリアが途切れやすいということは、収入が途切れやすいということ。だから忙しい人ほど、仕組みにまかせたほうがいいんです。"], [2850, "ジョン", "三つ目に、出産や育児、介護で自分が稼げない時期に、パートナーの収入に頼りきりになると、関係の中で自分の立場が弱くなりがちなんです。相手が優しい人でも、自分で「養ってもらっている」と思った瞬間に、セルフイメージが下がって、何を買うにも遠慮してしまう。どんどん自分が小さくなってしまうんです。だから、結婚しても何をしても、自分名義の口座を必ず持って、少額でもお金に働いてもらってほしい。経済的な自立は、精神的な自立の土台になります。"], [2960, "ジョン", "四つ目、長い目で見て一番大事なのは、お金に働いてもらって、お金に開かれたマインドを持っているお母さんの姿が、子どもへの最高の教育になるということです。子どもにかける教育費の一部を、早い段階から長期の積み立てに回しておけば、その子が大人になる頃には大きな資産になっている可能性がある。そうすれば、その子は本当に大切だと思うことに自分の時間を使える人生を生きられます。"], [3059, "ジョン", "教育者としてもう一つ。AI時代に子どもが持つべき力は、たった一つ。自分の意思を、自分の言葉で、はっきり表現できる力です。AIは、こちらの指示に基づいて答えを出してくれます。これからロボットも出てくる。その時に指示ができるかどうかが大事で、指示ができなければAIは全く使いこなせません。だから、子どもの意思をよく聞いて、質問をしてあげる。子どもが何かを言葉にした時に、それを受け止めて、「もっと正確に言うとどんな感じ？」と、言葉の力を鍛えてあげてほしいんです。"], [3210, "ジョン", "お金を分身として働かせる時代と、AIという無数の分身を作れる時代。お金とAIの二つを使いこなせたら、寝ていても、遊んでいても、本を読んでいても、旅をしていても、価値は作り出され続けます。りせさんと大学時代にITについてずっと話していたので、さすがだなと思います。ぜひ今回のプログラムを通して、AIとお金を学んでほしいと思います。"], [3272, "りせ", "12月1日からの3daysプログラムでは、投資や株の経験がない方に、知識ゼロの状態から、マインドを身につけて、銘柄を選んで、売買のタイミングまでお伝えします。ジョンさんが熱く語ってくださった長期・分散・積み立て投資はもちろん、それに加えて株式投資もしっかり学べます。AIの使い方も含めてお伝えします。"], [3340, "ジョン", "僕が投資をおすすめする理由は、お金を増やしてもらいたいということもあるけれど、それ以上に、投資の結果がどうであれ、お金に対する暗闇、知らないことから解放されてほしいからなんです。不安と恐れは、実際には起きていないのに、ものすごい苦しみを与えるもの。それに皆さんは人生の長い間苦しんできたと思います。そこから抜け出すために必要なのは、知ること。知るために学ぶこと。そこから全てが始まります。意識が変われば、全てが変わります。"], [3420, "ジョン", "もう一つ、投資をすると毎日が楽しくなります。世界が見えてくるんです。世界とのご縁を結ばせてくれるのが投資。僕自身、投資してよかったと思うのは、世界の情勢を冷静に見られるようになったこと。そして、お金の不安から抜け出すと、不思議と無駄なお金を使わなくなるんです。"], [3440, "ジョン", "投資は精神の修行にもなります。チャートが上がったり下がったり、赤になったり青になったりすると、心が揺れる。下がる日は必ず来ます。でも「来たらどうしよう」ではなく、来ることを最初から想定しておけば、起きても心を穏やかに保てる。人生もチャートと似ていて、思わぬ形で望まないことが起きることもある。でも、最終的にはうまくいくんだと、長期が本質なんだと信じる。目先の上下には、あえて鈍感でいる。僕はこれを「知的な鈍感さ」と呼んでいます。"], [3546, "ジョン", "長い目でうまくいくことを信じられたら、目先で何が起きても慌てることも、不安になることもない。そうすると人生が穏やかになって、余裕が生まれる。判断力も高まるし、愛情も溢れる。余裕がないと人にきつく当たるけれど、余裕があると人は大らかになれるんです。投資を通じて、皆さんの人生に豊かさと自由の翼がついて、美しく羽ばたくことを、心から楽しみにしています。応援しています。"], [3580, "りせ", "素晴らしい講義のようなお話でした。今日の感想を3daysプログラムのオープンチャットにアウトプットしていただくと、抽選でジョンさんおすすめのお金と投資の書籍をセットでプレゼントします。ぜひ何度も見返して、お金のマインドを変えて、今日から投資をスタートしてください。"], [3660, "ジョン", "りせさんの活動は本当に素晴らしいので、たくさんの方を幸せにしてほしいと思います。りせさんと関わると、みんな幸せになるので、ぜひご縁を続けてください。僕は普段お金について一切話さないので、今日は持っているものをだいぶお伝えしたと思います。それを皆さんの人生の階段に、エレベーターにして、高いところに登って美しい景色を見てほしいと思います。"], [3720, "りせ", "ジョンさん、本当にありがとうございました。皆さん、ここからは少しだけ私と振り返りをさせてください。すごかったですね。19歳の時の私の人を見る目は素晴らしかった、と改めて思いました（笑）。ジョンさんが、人生のいろんなことが複利のようにつながっていくとお話しされていましたが、こういうご縁もまさにそうだなと。投資の複利も、人生の複利も、本当に実感しています。"], [3800, "りせ", "ジョンさんもお話しされていましたが、私は投資があることで、働かなくてもお金が増えていく状況を作ることができて、そのおかげで子どもとも向き合えているし、余裕を持って過ごせています。そんな人生が来るなんて想像していなかったけれど、それを得られているのは、昔の私が行動してくれたおかげだと思っています。"], [3913, "りせ", "（コメント「目先の利益が早く欲しい」を受けて）その気持ちも分かります。実は私も、ジョンさんと同じく長期・分散・積み立ては実践していて、それに加えて株式投資で、お金を増やすスピードを上げています。そこを3daysプログラムでお話しします。人生を大きく動かしている人たちには、そのために何かをやった期間がある。私にとってはそれが株式投資でした。株は積み立てと比べると早く利益が出やすいので、数年やってみて人生がすごく変わって、仕事への依存度がなくなり、それこそジョンさんがおっしゃっていた人間関係の悩みの多くをなくすことができました。その経験から、頑張り屋の女性に投資をしてほしいと思って起業しました。"], [4040, "りせ", "お話を聞きながら、AIとお金はすごく似ていると思いました。お金も、指示がないと勝手に動くことはないんですよね。「あなたはここで働いてください」と私たちが指示するからこそ増えていってくれる。AIも、こちらが「こういうことをしてほしい」と伝えるところからスタートします。指示を出す力は、意思表示できる人として鍛えていくもの。今はAIがその指示のサポートをしてくれるので、昔よりずっとやりやすくなっています。"], [4110, "りせ", "積み立ては、全人類やらない理由がない投資です。まだの人はぜひこれを機に始めてください。それに加えて株式投資ができると、自由の翼を得るスピードがすごく早くなります。ただ、明日いきなり人生が変わるというものではなく、1年、2年と続けていくうちに、私が会社のお給料に頼らなくてよくなったように、皆さんの人生も変わっていきます。12月1日からの3daysプログラムで、心を込めてお話しします。"], [4210, "りせ", "感想を書くことは、今日の学びを自分の中に落とし込んだり、自分の進む道が見えてきたりすることにつながります。書くのが恥ずかしい方は、他の方の感想を見るだけでも大丈夫です。次回は18日、ハナミラの受講生さんで、フリーランスで働きながら株式投資を収入の柱にしている方とのライブです。2児のママでもあるので、ご自分の働き方に悩んでいる方、ママさんたちにぜひ聞いてほしいです。"], [4430, "りせ", "（コメントを受けて）「何度も見返したい」「人生が変わる1時間」「投資は精神の修行、本当にそう」「ずっと広告を怪しんでいたけど、お人柄を知ってもっと早く勉強すればよかった」…ありがとうございます。3daysプログラムの特典では、おすすめの証券口座と開き方も細かくお伝えしているので、1人で開くのが不安な方もぜひ活用してください。今日も見ていただいてありがとうございました。18日にお会いしましょう。"]]}, {"id": "maya", "vid": "zvvudk4HhEM", "date": "11/18（水）", "type": "受講生ライブ", "guestName": "寺沢まやさん", "guestRole": "クライアントワーカーのための売上アップコンサルタント／ハナミラ受講生・2児のママ", "title": "知らないフリーランスは損をする！これからの時代の資産形成術", "duration": "約51分", "message": "フリーランスこそ、働けない日にも回る「収入の柱」を。株は小さく始められて、仲間と続ければ、今の暮らしも将来の安心も両方つくれる。", "slides": [{"t": 170, "h": "ゲスト：寺沢まやさん", "p": "ネット広告代理店で会社員を経験したあと、出産・育児を経てフリーランスに。今は在宅で経営者や個人事業主を裏方で支える人たちの、売上アップのコンサルをしています。2025年にハナミラに入って個別株を始めました。", "li": ["小学生の男の子2人のママ", "今日は、より身近な立場から投資のリアルを話してくれました"]}, {"t": 270, "h": "フリーランスこそ、収入の柱を複数に", "p": "自分や子どもが体調を崩すと、仕事も収入も一緒に止まってしまう。それがフリーランスの大きな不安でした。", "li": ["子ども2人が同時にインフルエンザで、1週間仕事が止まったことも", "積み立てと個別株があるから「他にも柱がある」と思えた", "投資があると、仕事でもいろんなチャレンジがしやすくなる"]}, {"t": 447, "h": "「株＝ギャンブル」の怖さが消えた理由", "p": "最初は「損しそう」「ギャンブルでは？」と、個別株へのハードルがとても高かったそう。", "li": ["ハナミラでは、その会社が社会に求められているかを見る", "社長・事業・商品に価値があるかを判断して選ぶ", "推し活のように「応援したい会社」を探す楽しさに変わった"]}, {"t": 616, "h": "不動産ではなく株を選んだ理由", "p": "働く時間を減らしても収入が得られる方法を考えて、他の選択肢も検討した結果、株を選びました。", "li": ["不動産は物件を見に行くなど、自分で動く部分が多い", "株はパソコンやスマホがあれば、仕事の合間でもできる", "少額から始められる"]}, {"t": 774, "h": "記念に買った株が、家族旅行の飛行機代に", "p": "講座の卒業イベント「銘柄発表会」で、チームで選んだ株を記念に購入。数か月そのままにしていたら、しっかり利益が出ていました。", "li": ["その年に出た利益で、家族でオーストラリアへ", "「みんなで選んだ株で、こんな体験ができるんだ」という驚き", "実際に利益につながる学びだと実感"]}, {"t": 1416, "h": "積み立ては「将来」、個別株は「今」のため", "p": "りせさんの「積み立ては20年後の自分、個別株は今や数年後の自分を豊かにする投資」という言葉が、まやさんの背中を押しました。", "li": ["将来への備えはしていたけれど、今を豊かにする準備が足りなかった", "子どもが小さい今こそ、一緒にたくさん経験したい", "海外は物価も上がっていて「いつか」では行けなくなるかも"]}, {"t": 1720, "h": "仕事と両立できる？", "p": "まったく問題なし。ずっとチャートを見ている必要はありません。", "li": ["1日10分、朝や午後に見る時間をつくるだけ", "100株より少ない単位でも買えるので、少額から始められる", "「どうなったら買う・売る」というマイルールを決めておけば、その時だけ動けばいい"]}, {"t": 1988, "h": "成果の秘訣は「投資仲間」", "p": "経済の情報は無数にあって、1人で追いかけるのはまず無理。仲間がいると、それぞれが調べたことを持ち寄れます。", "li": ["自分では気づかない銘柄や視点に出会える", "忙しくても、仲間の姿を見ると「やりたかったんだ」と思い出せる", "隣の人の当たり前が、自分の当たり前の基準を上げてくれる"], "key": "どこに身を置いてやるかが、すごく大事"}, {"t": 2469, "h": "投資を始めて変わったこと", "p": "公務員家庭で育ち、株とは無縁だったまやさん。", "li": ["漠然とした将来の不安が薄れた", "投資を先入観なく、フラットに見られるようになった", "子どもが好きなおもちゃを見て、その会社の株価を調べるように"]}, {"t": 2732, "h": "まやさんからのメッセージ", "p": "怖いと思っている方も、まずは一歩踏み出して、その世界を知るところから。", "li": ["株は少額からでも始められる", "ちょっと知るだけで、怖さはなくなっていく", "理想の人生に近づく一歩にしてほしい"]}], "transcript": [[1, "りせ", "皆さん、こんばんは。「世界一分かりやすいAI時代の女子流株のはじめ方3daysプログラム」主催の松下りせです。日本最大級の女性向け資産運用スクール「ハナミラ」を経営していて、私自身も株式投資で資産を増やしてきました。そのノウハウを3日間に詰め込んだプログラムを12月1日から開催します。今日もそれを記念したコラボライブです。プログラムまで、あと2週間くらいになりましたね。"], [84, "りせ", "今回は、皆さんにより近い立場で投資のお話をしてくださる、素敵な女性をお招きしています。クライアントワーカーのための売上アップコンサルタント、寺沢まやさんです。ご自身もフリーランスとして活躍されていて、ハナミラで株を始めて、収入の柱を作った方です。フリーランスとして仕事をする中で、資産形成をどうやっているのか、具体的に伺っていきます。"], [170, "寺沢", "初めましての方もいらっしゃると思います。寺沢まやと申します。クライアントワーカーのための売上アップコンサルとして活動しています。在宅で、経営者や個人事業主の裏方のサポートをしている方々の売上を上げるためのコンサルです。"], [219, "寺沢", "フリーランスになって4年目です。それまで13年間、ネット専業の広告代理店で会社員として働いていました。子どもが2人いて、出産と育休を経て退職して、フリーランスになりました。個別株を始めたのはハナミラに入ってからで、2025年の1月に入会したはずなので、2年目ですね。"], [270, "寺沢", "収入の柱を、働くことに紐づく収入以外のところからも作りたい、という思いがあってハナミラに来ました。フリーランスは忙しかったりもしますし、会社員のように毎月決まった給料があるわけではなく、月によってばらつきもある。自由度が高い反面、不安定さもあると思います。"], [307, "りせ", "私も独立してみて、決まった給料がないからこそ、収入の柱の多さはすごく大切だと感じます。"], [324, "寺沢", "自分の体調不良や子どもの体調不良、家族の突発的な何かがあった時に、自分の稼働が止まると、収入まで一緒に止まってしまう。それが私の中で大きな不安でした。だから別の収入源が欲しかったんです。"], [345, "りせ", "投資があると、フリーランスも安心してできますよね。フリーランスになるのは怖いと思っている方もいるかもしれないけど、投資もあると思えば、いろんなチャレンジができる。仕事をしながら資産運用もするのは、すごくいい組み合わせだと思います。"], [395, "寺沢", "ちょうど10月末に、子ども2人が同時にインフルエンザにかかって、1週間ずっと家にいて仕事が滞った時があったんです。働くことに紐づく仕事だけだったら、稼働が止まった時の不安はもっと大きかったと思います。私は積み立て投資と個別株投資をしているので、他にも収入の柱があると思えたのは、安心感につながっています。"], [447, "寺沢", "最初は、個別株へのハードルがすごく高かったんです。株ってギャンブルじゃないのか、損しちゃうんじゃないか、という気持ちがあって、ずっと手が出せなかった。でもハナミラに入って、そうじゃないと気づかせていただきました。ハナミラの教えは、その会社が本当に社会に求められているのかを見ていきましょう、というものですよね。会社や社長さん、ビジネスや商品・サービスに、本当に社会的な意義や価値があるかを判断してから、推し活みたいに応援していける会社を見つけていこう、という教え。そこがすごく本質的だなと思ったんです。だから、ギャンブルっぽいという怖さはなくなって、推せる会社を見つけたい、という前向きな気持ちに変わりました。"], [514, "りせ", "利益のためだけに値動きを追う、ということに違和感を持つ方も多いと思うんです。もちろん値動きで利益が出ればそれはいいんですけど、会社の本質も見ながらやると、納得感もあって、やっていることが楽しくなりますよね。"], [559, "寺沢", "チャートだけ見ていると気持ちが疲れてくると思うんですけど、会社のビジョンや、何を目指しているのか、何を成し遂げたいのかに共感できると、応援したいと思える。そんなふうに銘柄を選ぶ楽しさがありますね。"], [590, "りせ", "投資を検討する前に、他の選択肢も考えたりしましたか？"], [616, "寺沢", "会社員を辞めてフリーランスになった後は、業務委託でお仕事を振ってもらって、自分で手を動かしていました。インスタの投稿を作ったり、動画サイトを管理したり、講座運営をされているお客様の事務局として運営をサポートしたり。裏方の仕事です。そのやり方や、その仕事で売上を上げる方法を、今度は教える立場になって、フェーズが少し変わりました。それでも、もう少し働く時間を減らして、他から収入を得られる方法はないかなと考えた時に選んだのが、個別株の投資でした。"], [684, "寺沢", "他に検討したのは、よく言われる不動産投資です。でも私にとってはハードルがもっと高かった。物件を見に行ったり、査定をしたり、自分で動かなきゃいけない部分が多いので。株はパソコン1つあればできるし、手軽さとハードルの低さがありました。すぐできて、少額からでもできる。不動産だと頭金が必要ですよね。そういうところで株に巡り合いました。"], [774, "寺沢", "最初に買った株は、ハナミラの講座の期間中にある「銘柄発表会」の銘柄です。卒業イベントとして、チームのみんなでどんな銘柄にするか話し合って決めて発表するんですけど、その銘柄を、卒業する3月のタイミングで記念に買ったんです。「みんなで発表やったぞ」みたいな感じで、えいやと思って。"], [833, "寺沢", "それを数か月ほったらかしにしていたら、ちょっと見たら結構な利益になっていて、そこで利益を確定して、また買いました。その年は調子が良くて、全体でもしっかり利益が出たんです。それを家族旅行に使わせていただきました。今年の2月に家族でオーストラリアに行ったんですけど、その時の飛行機代にしました。"], [870, "寺沢", "講座の中でみんなで選んだ株で、こんな体験ができるのか、こんないい思いをさせていただけるのか、というのが最初の衝撃でした。実践として使える、ちゃんと利益が出る学びを教えてくださっているんだな、とそこで実感しました。"], [915, "りせ", "まやさんもグループの皆さんも、行動力のある方たちが集まっていたからこそだと思います。成果が出て、自分自身に変化したことはありますか？"], [942, "寺沢", "将来への不安が薄れたのが大きいです。会社員の頃は、漠然とした将来の不安がすごくあって、とにかく堅実に貯金していました。その不安が薄れました。"], [987, "寺沢", "フリーランスになったのは、育休中に気持ちが変わって、この先の人生をどう生きたいんだろうと考える時間ができたからです。広告代理店は忙しいので、せっかく来てくれた子どもを抱えてまたあの世界に戻るのはどうなんだろうと思って、フリーランスになりました。"], [1037, "りせ", "私も子どもがいるので、すごく分かります。子どもができると、時間と得られるお金のバランスをなおさら考えますよね。稼ぐのも大事だけど、仕事は増やしたくない。"], [1060, "寺沢", "めちゃくちゃ考えます。時間の制約も出るし、これからお金はかかってくる。教育費は、かけようと思えばいくらでもかけられるので。だから私は、資産運用はマストでやったほうがいいと思います。心の安定も、経済的な安定もカバーしてくれる。"], [1095, "りせ", "最近、「投資をしていなかった世界の最悪を想像する」という話を聞いたんですが、想像するとヤバいなと思って。どんな働き方を選ぶにしても、資産運用はセットでやったほうがいいと思います。"], [1143, "寺沢", "フリーランスだけでなく、会社員でもやっておいたほうがいいと思っています。今、物価が上がって、円安も進んでいる。それに対抗するだけの給料の上昇はないじゃないですか。だったら自分で考えて、コツコツ準備しておかないといけない。副業禁止の会社はあっても、投資が禁止の会社はほとんどないと思うんです。"], [1237, "寺沢", "今年2月に家族でオーストラリアに1週間ほど行って、すごくいい思い出になったんですけど、円安をすごく感じました。大学生の時に1年ほど留学していたので、その頃と比べると円の価値がだいぶ下がっていて。物価も高くて、家族4人でカフェで朝ご飯を食べるだけで、日本の感覚の何倍もかかるんです。子どもたちにもいい刺激になったけど、年に何回も海外に行く生活は、今の日本だと厳しくなってきているなと感じました。だからこそ、楽しむためのお金を株で準備しています。"], [1358, "寺沢", "NISAで長期的にコツコツ積み立てていて、それは将来の教育費や老後のために、何十年という単位で考えています。でも、今この瞬間も豊かに楽しく生きたい。それを個別株の利益でまかないたい、と思ってやっています。"], [1416, "寺沢", "実はこの考え方を教えてくださったのは、りせさんなんです。初めてりせさんにお会いしたのは、都内の小規模なリアルイベントでした。その時に、「積み立て投資は20年後の自分を豊かにする投資。でも個別株投資は、2〜3年後や今の自分を豊かにする投資なんだよ」とおっしゃっていて。それを聞いた時に、20年後の自分への備えはしているけれど、今の私を豊かにするための活動は何かしているかなと考えたら、そこが不足していると思ったんです。子どもが小さい今、お金が欲しい。一緒に豊かに過ごしたい。自分が理想とする人生を叶えるためにやらなきゃいけないことだ、と思いました。"], [1500, "りせ", "嬉しいです。積み立ては、もう無心で続けることが大切で、その間に使ってしまったらもったいない世界だと思います。だからこそ、1年後、2年後、3年後の、本当に今やりたいことにお金を使えることが、皆さんが本来やりたいことだと思うんです。"], [1535, "寺沢", "「いつか」と言っていたら、本当に行けなくなる時が来るなと、今年海外に行って感じました。どんどん値段が上がっているので。うちは小学生の男の子2人なんですけど、思春期を超えたら一緒に旅行に行ってくれなくなるんじゃないかという不安もあって、今のうちにたくさん経験したいと思って投資も頑張っています。"], [1586, "りせ", "お母さんが投資に前向きだと、お子さんにも伝わっていくと思います。親が楽しそうに仕事や投資をしていたら、子どものイメージも良くなっていく。"], [1606, "寺沢", "積極的に学ばせるというより、仕事している姿や投資している姿を見せて、「これは株のお金で飛行機に乗れたんだよ」と言ってあげられると、無意識の部分が変わっていくと思うので、それこそ教育だなと感じます。"], [1666, "りせ", "「まやさんだからできたんでしょう」と思っている方もいると思うんですけど、どう思いますか？"], [1680, "寺沢", "私は同期の中でも、どちらかというとできないほうだと思います。私だからじゃないです。みんなできています。ちゃんとコツコツ調べることができれば、誰でも利益が出る、とは言葉にしにくいですけど、ハナミラが教えてくれることを実践すれば、それなりの結果につながる、という学びをいただいていると思います。"], [1720, "寺沢", "仕事との両立も全然問題なくて、ずっとチャートを見ていることはないです。ハナミラは会社の業績や会社そのものをよく見る教えなので、ずっとチャートを見ている必要はなくて、1日10分、朝や午後に見る時間を作っておけば、時間を取られた感覚はないです。それに、100株より少ない数でも買える証券会社もあるので、少額から始められます。ハードルは低いと思います。会社員の方でも、通勤時間や昼休みにちょっと調べることは全然できると思います。"], [1813, "りせ", "ずっと見ないほうが成績が良かったりしますよね。ずっと見ていると、下がったから売らなきゃ、と無駄な売りをして、その後上がった、なんてこともあるので。"], [1846, "寺沢", "「マイルールを決めなさい」と教えてくださるじゃないですか。どうなったら買って、どうなったら売るか、ルールを決めてから買おう、と。私は未だにそれを破ることがあるんですけど（笑）、そのルールに乗っていれば、ずっと画面を見ていなくても、ルールの状態になった時にポチっとすればいいだけ。時間がない人でもできると思います。"], [1925, "りせ", "数字や計算は得意なほうですか？"], [1932, "寺沢", "自分では得意なイメージはないんですけど、周りからは数字に強いと言ってもらえることは多いです。元々営業職だったので、売上を見るような数字の見方ができて、株を買う時も全部スプレッドシートにまとめちゃう癖があるんです。でも、ノートに書く人はノートで、自分が管理しやすい方法が一番だと思います。"], [1988, "寺沢", "成果の秘訣は、本音で思うんですけど、投資は1人でやるものじゃないということ。投資仲間を作ることが秘訣だと思います。金融や経済の情報は無数にあって、自分1人で追いかけるのはまず不可能。その中から業界や株を選ぶなんて、そもそも時間がないんです。でも投資仲間と一緒にやっていると、みんなが調べたことを持ち寄れるし、自分では気づかない視点を教えてくれる。銘柄発表会でも、自分が気づいていなかった銘柄を発表する人が教えてくれる。情報で勝っている感じがします。どこに身を置いてやるかがすごく大事です。1人だったら続けられていないし、何が正解かも分からなくてモヤモヤしていたと思います。"], [2085, "りせ", "私も同じことを思います。日々、生活が回っていればまあいいか、と後回しにしてしまうこともあると思うんです。でも仲間や環境があると、「私これをやりたかったんだ」と引き戻してくれる。"], [2131, "寺沢", "ふるいにかけられた上質な情報が集まる感じです。みんながそれぞれ株のことを真剣に考えていて、それを分け合ってくれる場になっているので、上質な情報にすぐアクセスできる。みんなが頑張っている姿を見ると、自分も頑張ろうと思えます。1人だったら、自分の仕事が忙しくなったら投資は後回しにしていたかもしれない。でも片足でも突っ込んでおけば、イベントのお知らせなどが来るので、後回しにしなくて済む環境になっていると思います。"], [2211, "寺沢", "みんなと会えるリアルイベントにもすごく感謝しています。最近だとカンボジアのツアーに行かせていただきました。大人の修学旅行みたいで、みんなで一緒に行けたのがすごく思い出になっています。これから伸びていくだろう国の不動産を見たり、お寺や観光地を回ったり。7月に子どもたちを連れてマレーシアに短期留学で行っていたので、東南アジアでも国によって発展も雰囲気も全然違うと分かって、すごく興味深かったです。"], [2316, "寺沢", "1人だったら、カンボジアに行こうとは思わなかったと思います。ハナミラの企画が、今まで興味の対象外だったところにも視野を広げてくれるんです。不動産にも興味が出てきました。不動産をやるにしても頭金を作るところは必要なので、株と組み合わせないといけないなと思います。それに、隣にいる人が「そんな世界があるのね」ということをやっていると、自分の中の当たり前の基準がどんどん上がっていく。コミュニティの良さや魅力はすごくありますね。"], [2469, "寺沢", "お金の考え方でいうと、私はもともとすごく真面目なタイプで、両親が公務員の家庭に育ったので、株とは無縁だったんです。だからギャンブルなんじゃないかという気持ちがあったと思うんですけど、実際に始めて、怪しくないコミュニティで怪しくない方に教えていただいて、今までの先入観が取り払われました。いいものはいいものとしてフラットに見られるようになって、活用できるようになったと思います。"], [2556, "寺沢", "世の中の見方では、株価を調べたくなる瞬間がありますね。うちの子どもたちは電車や車のおもちゃが大好きで、そのメーカーにすごくお世話になっているので、ふとした時に株価を見てみたり。生活の中で自然とやっています。"], [2606, "りせ", "まやさんのお話、とても分かりやすかったです。3daysプログラムでは、まやさんが学んだ株のノウハウを、AIの活用のしかたも含めて3日間で学べます。"], [2662, "寺沢", "私も復習とバージョンアップのために参加します！私のほうでも、クライアントワークをしていて売上を上げたいけれどどうしたらいいか分からない方向けに、新規メンバーの募集をしていて、今回が最後の募集になる予定です。気になる方はインスタからのぞいてみてください。"], [2732, "寺沢", "怖いなと思っている方も、まず一歩踏み出して、その世界を知るところから始めたらいいんじゃないかなと思います。株は少額からでも投資できるし、手頃な金額から買える銘柄もたくさんあります。ちょっと知ることで、その怖さはなくなっていくと思うので、その一歩が、皆さんが理想とする人生に近づく一歩になったらいいなと思います。ハナミラに来てくださったら私もいますので、またイベントでお会いできたら嬉しいです。"], [2803, "りせ", "まやさん、素敵なお話をありがとうございました。まやさんもおっしゃっていましたが、これは特別な人の話ではなく、私たちがお伝えしていることをしっかりやっていただくと、こういう利益が出てくるんです。お金の話は将来の不安にフォーカスされがちですが、今の生活をより豊かにしたり、今の自分をもっと幸せにしたりするためのお金も作って、人生を楽しんでいただけたら嬉しいです。"], [2878, "りせ", "私も独身で子どももいない時に投資を始めて、その時も本当にやってよかったと思っていましたが、子どもが生まれて、なおさらそう思うようになりました。どんなフェーズの女性でも、並行してやっていくと、人生の至るところで投資があってよかったと思うはずです。3daysプログラムは12月1日・3日・5日。考え方、銘柄の選び方、買い方までしっかりお伝えします。"], [2977, "りせ", "今日の感想をオープンチャットに書いていただくと、抽選でAmazonギフト券をプレゼントします。今回は受講生さんとのお話だったので、より身近に感じていただけたと思います。次回は20日21時半から、KADOKAWAの編集長・伊藤直樹さんとのコラボで、AI時代の投資術をお話しします。今日も見てくださってありがとうございました。"]]}, {"id": "1120", "vid": "sitcSD8NHAw", "date": "11/20（金）", "type": "コラボライブ", "guestName": "伊藤直樹さん", "guestRole": "KADOKAWA ビジネス書編集長", "guest": "伊藤直樹さん（KADOKAWA ビジネス書編集長）", "title": "投資が難しい時代はもう終わり。AI時代の知識ゼロからの株式投資術", "duration": "約58分", "message": "AIは「上がる株を教えてくれる魔法」ではなく、調べものをまかせられる心強い秘書。投資の考え方を身につけてAIを味方にすれば、知識ゼロからでも情報の差を一気に縮められる。", "slides": [{"t": 127, "h": "ゲスト：伊藤直樹さん", "p": "KADOKAWAでビジネス書の編集長として、数々のベストセラーを手がけてきた方。最近は「お金・投資」の本がとても売れていて、AIで投資をする本も担当しています。", "li": ["今日は伊藤さんが聞き手になって、りせさんにAI×投資を質問", "引き出し力がすごい回です"]}, {"t": 195, "h": "AIに聞けば、儲かる株が分かる？", "p": "りせさんの答えは「半分当たっていて、半分そうじゃない」。", "li": ["いい候補はかなり出してくれるようになった", "でも、そうじゃないものも紛れている", "最後に選ぶ力は、やっぱり自分に必要"], "key": "AIは候補出し、選ぶのは自分"}, {"t": 273, "h": "りせさんのAIの使い方", "p": "昔はまずニュースや資料を開いていたけれど、今は調べものの最初の一手がAIになりました。", "li": ["自分の基準で、銘柄をピックアップしてもらう", "気になる銘柄の「心配な点」を調べてもらう", "ここ1年ほどで、古い情報を拾うことが減って使いやすくなった"]}, {"t": 401, "h": "必要なのは「投資の考え方」×「AIへの聞き方」", "p": "これまでの投資の考え方は大切。それに加えて、知りたいことをAIにどう聞けば欲しい答えが返ってくるか、という力が求められています。", "li": ["自分の着眼点を、どうAIに落とし込むか", "ちゃんと投資している人ほど、AIを上手に使っている", "調べものの量にキリがない分野だから、AIとの相性がいい"]}, {"t": 865, "h": "AIに「見張り役」と「秘書」をまかせる", "p": "全部を自分で追いかけると疲れてしまう。覚えておきたいことや気になる情報は、AIに知らせてもらえます。", "li": ["決算発表の前に、その会社の動きを調べて知らせてもらう", "「1か月後にこの銘柄をチェック」を忘れずに通知", "株価が決めた値段になったら知らせる機能は、証券会社のアプリにもある"]}, {"t": 1134, "h": "りせさんが株を買うときに見るもの", "p": "基本で一番大事なのは「売上」。その会社が成長しているかが、数字で一番分かりやすく出るところです。", "li": ["成長しているのに、株価が安いものは狙い目", "成長していないのに株価だけ上がっているものは、慌てて飛びつかない", "売上などの数字は、AIでも拾いやすい"]}, {"t": 1357, "h": "AIで「情報の差」が縮まる時代", "p": "投資は情報を持っている人が有利なゲーム。AIで、始めたばかりの人でも情報に早くアクセスできるようになりました。", "li": ["気づいている投資家は、今すごくAIを触っている", "AIの進化は速く、数年で差がつく", "投資の力とAIの力、両方あると一気に速くなる"], "key": "今から始める人には、むしろチャンス"}, {"t": 2012, "h": "資産を持つと「挑戦と選択の幅」が広がる", "p": "伊藤さんの言葉。資産を持つことは、お金の不安を消すだけではありません。", "li": ["「資産があるから、なんとかなる」と思える", "だから「やってみるか」と挑戦できる", "合わなければやめてもいい。やってみないと分からない"]}, {"t": 2356, "h": "女性同士のコミュニティが強い理由", "p": "女性は、いいと思ったものを人にシェアするのが得意。だから、いい情報が集まって回っていきます。", "li": ["男性もいる場だと、話しづらくて続かない人も", "話すことで、学んだことが身につく", "伊藤さん「ベストセラーの口コミも、最初は女性から起きる」"]}, {"t": 2583, "h": "年を重ねるほど、投資", "p": "体を動かす仕事はだんだん難しくなるけれど、投資はスマホ1台で、定年なく続けられます。", "li": ["これまで生きてきた経験も生かせる", "70代近い受講生さんもいる", "気持ちがあれば、年齢は関係ない"]}], "transcript": [[1, "りせ", "皆さん、こんばんは。12月1日から開催する、AI時代の株のはじめ方をお伝えする3daysプログラムを記念して、コラボライブをしています。シリーズのテーマは「超一流のお金の哲学」。今日は、皆さん大好きな、KADOKAWAの編集長・伊藤直樹さんにお越しいただきました。テーマは「投資が難しい時代はもう終わり。AI時代の知識ゼロからの株式投資術」です。"], [66, "りせ", "では、伊藤さんをお呼びします。よろしくお願いします。軽く自己紹介をお願いできますか？"], [127, "伊藤", "初めましての方も、よろしくお願いします。出版社でビジネス書の編集長をしていて、これまで数々のベストセラーを毎年作ってきました。最近は投資、お金の本がめちゃくちゃ売れる傾向にあって、今日はりせさんに投資のことを色々伺いたいと楽しみにしていました。"], [160, "伊藤", "僕らもAIでほったらかし投資をする、という本を作らせていただいて、それが売れているんですけど、AI投資というジャンルが今すごく流行っていると感じます。実際に僕もAIに「どういう株を買えばいいの？」と聞いてみたら、結構細かく教えてくれるんです。AIが勝率の高い銘柄や投資法を教えてくれて、その通りにやったら本当に稼げる世界なのかなと思っていて。プロの率直なご意見を伺いたいです。"], [195, "りせ", "半分当たっていて、半分そうじゃないところがある、というのが実際だと思います。AIが選んでくれるもので、実際にいいものもあるんです。ただ、そうじゃないものも紛れていたりするので、最終的に選択する力は大事。でも、候補はかなり出してくれるようになっていると思います。"], [273, "りせ", "私もAIはめちゃめちゃ活用しています。自分が欲しいと思っている基準で銘柄をピックアップしてもらうこともあるし、いいなと思っている銘柄の心配な点をAIで調べることもあります。昔は1発目からニュースを開いたり資料を見に行ったりしていたんですけど、今は本当に、最初の一手がAIになったという感じです。"], [335, "伊藤", "AIが引っ張ってくる情報には、プロの目から見ても価値があると感じているということですか？"], [345, "りせ", "絶対かどうかは見極めなきゃいけないところはあるんですけど、結構いいことを言ってくれたり、自分で調べに行くのが大変なことを教えてくれたりするようになっています。"], [380, "伊藤", "AIは毎月のようにモデルが変わるくらい進化していますが、投資×AIはもう必須のスキルということですか？"], [401, "りせ", "それはもう間違いないと思います。従来の投資の考え方は大切ですが、それに加えて、自分が知りたいことの聞き方が大事になっています。今はみんな、普段やっていたことをいかに楽にできるかを探している。投資もそうで、自分のある着眼点を、どうやってAIに落とし込んで、望む答えを引っ張ってこられるか。そこはみんな日々研究していると思います。"], [470, "伊藤", "たとえば、勝率が高い有名な投資家の買い方を研究・分析する、というのもやってくれるんですよね。毎日の売買の記録を公開している人のデータがあれば、AIに勉強してもらって、次に何を買うだろうかを聞けるわけですもんね。"], [535, "りせ", "その可能性があるものを考えてくれると思います。スクールでも最近、AIの話を体系的に始めました。どう活用したらいいか、情報がまだ玉石混交で、AIによって動き方も違うので、下手なことは言えないところもあったんです。でも、だいぶ賢くなってきて、この1年くらいで前より使えるようになったと思います。"], [606, "りせ", "少し前は、普通に聞くと2年くらい前の古い情報を拾ってきたりしていたんです。どこかのネット記事から引っ張ってきたんだろうな、というのがよく分かる感じで。今も時系列のミスなどはあるんですけど、大きく的外れな方向から引っ張ってくることは少なくなって、本当に使い勝手が良くなりました。情報の取り方が変わってきているのを感じます。"], [700, "伊藤", "有名な投資家の人たちも、絶対使っていますよね。"], [710, "りせ", "絶対使っていると思いますし、ちゃんと投資している人ほど上手に使っていると思います。"], [739, "伊藤", "パターンと情報処理を組み合わせて、勝率の高いパターンに乗っかると利益が出る、というゲームのルールだと思うので、AIとの相性はめちゃくちゃいいですよね。"], [755, "りせ", "調べるとなると、量にキリがない分野なので、それが早くなっているのはすごくありがたいです。自分ではたどり着けないところまで「こういうのもあります」と出してくれて、それが本当に必要なことだったりもする。スクールでも、AIをちゃんと使えるようになってもらおう、というところを本格化しようと思っています。"], [823, "伊藤", "ある程度、自動化の時代に来ているということですか？"], [835, "りせ", "完全に、というところはまだですけど、「こういうのが欲しい」と言っておいたら探してきてくれる、という方向にもなっているので、自動化の波は昔よりだいぶ来ていると思います。"], [865, "伊藤", "最近は、メールや買い物の情報と連動して「何日に荷物が届きますよ」と知らせてくれるAIの機能もありますよね。あれを持っている株と連動させて、「この金額になったら知らせて」と設定しておけば、今売りましょう、今買いましょうと通知してくれる、ということは可能ですか？"], [937, "りせ", "それは可能ですし、実は株価のお知らせは、証券会社のアプリでもできるんです。その代わり、ちょっと入ったニュースなどはAIで送ってもらったりしています。株価だけじゃなく、「この情報に関してこういうのが来たら教えて」とお願いしたり、「この時期になったらこれをやろうと思っていた」という、つい忘れてしまうことを通知してもらったり。1か所にまとまっているほうが楽なんです。"], [1007, "りせ", "たとえば、この会社の決算発表がこの日あたりにあるから、その少し前にこういう行動をしたい、ということを忘れるんですよ。1か月後にこの銘柄をチェックする、とか。そういうのを通知でもらっています。本格的にコミットするほど、いろんな情報を追うことになって疲れてしまう。みんなそこまで頑張りたくないと思うんですけど、そういうところを楽にしてくれる、サポートしてくれるのがAIだと思います。"], [1071, "伊藤", "お助けロボ、秘書的に活用できるといい。それが誰でも可能になった、ということですよね。"], [1080, "りせ", "そうです。投資も早く始めるほど有利なところがあると思うんですけど、AIも早く上手に使えたほうが有利です。今から始める人は、AIをよりよく使うことと、投資の力、その2つがあったほうがよくて、どちらもクリアするとすごく速くなる。そこが今やっておいたほうがいいことの1つだと思います。"], [1134, "伊藤", "りせさんが株を買う条件を、参考までに少し教えていただけますか？"], [1150, "りせ", "AIでも拾いやすいのは、売上などの数字のところです。売上は、基本だし一番大事だと思います。その会社が成長しているかどうかが、数字で出る分かりやすいところなので。"], [1205, "伊藤", "以前りせさんにレクチャーしていただいた時に、実態に対して株価が上振れているのか下振れているのかで見ていくといい、というお話があって。成長率がすごく高いのに株価が安いものがあったら買ったほうがいい。逆に、全然成長していないのに株価がすごく伸びているものに踊らされて買うのは危険かもしれない、ということですよね。"], [1240, "りせ", "そうですね。こういう数字が出るはずだ、という仮説で買われている時もあって、その通りに良くなる時もある。それは数字にまだ見えていないものを読んでいる、ということなんですけど、本当にそういう見込みもないのに買われすぎているものを買うと、後が大変です。"], [1279, "伊藤", "りせさんでも、失敗することはあるんですか？"], [1290, "りせ", "未だに年に1回くらい、発注の桁を間違えることがあります（笑）。短期的に上がっていくかなと思って買ったら、やけに増えていて、おかしいと思ったら株数が一桁多かった、ということも。"], [1357, "伊藤", "前にお話しした時、りせさんが言っていた「やっていないほうがおかしいよ」という言葉が印象的でした。投資は、ある意味、情報を持っている人が勝つゲームだと思うんです。でもAIが出てきて、情報の差がなくなってきた。投資を始めたばかりの人でも、AIを使いこなして情報を取れたら、投資はますますやったほうがいいに決まっている、と感じました。"], [1424, "りせ", "本当に気づいている人たちは、投資家でもめちゃくちゃ今AIを触っていると思います。言っていないだけで。情報の差がなくなっていくと、初心者でも前より早くアクセスできるようになる。だから投資の力を持っている人は、とりあえず早くAIを味方につけています。"], [1488, "伊藤", "スクールで、AI×投資を教えているところは、まずないですよね。"], [1497, "りせ", "逆に言うと、ここでやらないと、差がついてしまうと思っています。AIは進化がすごく早いので、1〜2年で、ある程度ちゃんと使える形で使えないと、投資ができるようになっても古くなってしまう。今はまだ大丈夫ですけど、数年後にはそうなっていると思うんです。だから私たちも、ちゃんと使えるように教えていかないといけない、と思っています。"], [1620, "伊藤", "コメントで「AIで調べる時間がかなり削減されている気がします」と来ています。経験者の方が言っているのはすごいですね。"], [1640, "りせ", "私も、調べものがある時は、ずっとパソコンやスマホを開いていたんです。今は指示を出したらやってくれて、後で見て、また聞いて、ができるので、すごく楽になりました。前に1時間かかっていた想定以上のことが、10分くらいでできている感じです。時間の感覚が変わりました。"], [1752, "りせ", "AIの使い方を投資の中で学んでいくと、日常生活の時短にも使えるようになります。使うモデルによって答えが変わったりもするので、面白いなと思いながら使っています。ハナミラにはAIを使いこなしている方も多くいらっしゃるので、みんなで調べ方をシェアしていて、「そういう使い方をしているんだ」と私も学ぶことがよくあります。"], [1880, "りせ", "3daysプログラムでは、私たちの投資の方法と、AIをこういうふうに活用できるよ、という具体的なところもお話しします。知識ゼロで来ていただいても、考え方、銘柄の選び方、AIの使い方、買うタイミングまで、総合してお伝えできる場です。初心者向けにお伝えするので、今回で投資をスタートしたい方、より効率よくやりたい方に、ぜひ来ていただきたいです。"], [2012, "伊藤", "下手な副業で稼ごうとするよりも、お金の不安を解消する一番の向き合い方は、資産を持つことだと思っています。資産があれば、なんとかなるやろ、という気持ちになれる。資産を持つことはお金の不安を消すことだと思われがちですけど、僕は、挑戦と選択の幅が広がることだと思っていて。お金の不安を消すことも大事ですけど、挑戦と選択の幅を広げたほうが、人生が豊かになると思うんです。合わなかったら、別にそれでいい。やってみないと分からないことって、この世界には多いですから。"], [2120, "伊藤", "余談ですけど、最近のハナミラ、きれいな方が増えましたよね。前からきれいでしたけど、雰囲気が変わってきた。投資で資産を築くことで、より美しくなるという挑戦や選択の幅が広がって、会員さんたちがどんどん素敵になっていくのを見ていると、投資っていいなと純粋に思います。"], [2215, "りせ", "嬉しいです。本当に気持ちのいい方が多くて、居心地が良くて、自分らしく生きている方が多いと思います。人数も増えてきたので、いい影響が伝わっていくのはあると思います。"], [2280, "りせ", "（質問「すでにハナミラに入っている人も3daysは受けられますか？」を受けて）受けられます。在籍している方は、受けなくてもハナミラの中でしっかりAIのことをお伝えしていくので安心してください。モチベーションが上がるので、確認のために改めて来てくださる方も多いです。"], [2356, "伊藤", "女性同士のコミュニティって、投資と相性がいいなと思います。"], [2366, "りせ", "男性もいるコミュニティもたくさんあるんですけど、話しづらいという方も多いんです。コミュニティは、喋ることで学んだことが定着していく。でもそれが自由にできないと、萎縮してしまって身につかない方もいる。メディア関係の受講生さんに聞いた話なんですが、自分がいいと思っているものを人に教える、という環境は、男性だけだとなかなか起きないらしいんです。女性がたくさんいると起きる。だから「この銘柄いいと思う」と話してくださる方がいる。それが女性ならではなんだなと改めて思いました。"], [2470, "伊藤", "面白いデータがあって、ビジネス書の口コミを最初に起こすのは女性なんです。男性は、いい本ほど他の人に知られたくなかったりする。女性は「この本よかったから読んでみて」とすごく口コミを起こしてくれるので、ベストセラーを作る時も、最初は女性に読んでいただけるものにすることが大事なんです。"], [2530, "りせ", "株でもまさにそうですね。せっかく見つけたものを独り占めしたいかシェアしたいかは、性格や環境で差が出ると思うんですけど、ハナミラの方々は、自分がいいと思っているものを伝えてくれるし、だから他の方もそうする。それで回っているので、すごくいい情報が集まっていると思います。"], [2583, "りせ", "（コメント「りせさんよりずっと年上の超初心者でも大丈夫ですか？」を受けて）年齢は全然関係ないですし、私は、年を重ねるほどむしろ投資だと思っています。体力的に、体を動かすことはできないことが増えていくと思うんです。新しい仕事を始めるにも年齢の壁がある。でも投資は、スマホ1台で、定年なくずっとできる。今まで生きてきた経験も生きるので、「もうこれしかない」と来られる方もたくさんいて、しっかり成果を出して、自分の生活を良くしたり、寄付をしたりと、いい形でお金を回されている方がたくさんいます。70代近い方もいらっしゃいます。気持ちがあれば大丈夫。こうやってインスタのライブを見ている時点で、もう大丈夫だと思います。"], [2690, "伊藤", "下は何歳から入れるんですか？"], [2700, "りせ", "小学生は親御さんのこともあるのでまだですが、大学生の方は来てくださったことがあります。若いうちから当たり前になっているといいなと思うので、子ども向けもいつかやりたいです。投資が普通の人は、80歳でも全然現役。好きなだけ続けられるのは、素晴らしいことだと思います。"], [2765, "りせ", "ハナミラに興味を持っていただけたら、ノウハウの相性もあると思うので、まずは3daysプログラムに参加して、どんなことをしているのかをよく知っていただけるといいと思います。普段私たちがどういう形で投資しているのか、しっかりお伝えします。"], [2900, "りせ", "（「今は買い時ですか？」を受けて）少し前よりは下がってきているので、買いやすくはなってきていると思います。ただ、正直もう少し様子を見ないと分からないところもあります。だからこそ、今は勉強しておくのにちょうどいい期間で、買う銘柄をピックアップしておくにもすごくいい時期だと思います。長い目で見れば上がっていくと思っていますが、高値で買うより全然いいので、こういうところでちゃんと勉強して、できるようになっておくのがいいと思います。"], [3042, "りせ", "3daysプログラムに参加していただくと、伊藤さんが最近ハナミラで、AI時代の投資について伊藤さん自身の考えも合わせてお話ししてくださった特別セミナーを、編集したスペシャル版で見られます。"], [3080, "伊藤", "具体的に「こういうプロンプトを書きなさい」という話だと、あまり意味がないと思っていて。原理原則を知ることが大事なんです。原理原則さえ分かれば、それを応用するのはその人の裁量でできるし、その人の才能や個性が出てくる。その原理原則のお話をさせていただいたので、気になる方はぜひ受け取ってください。個人がなんとかするには、もう資産を作るしかない時代だと思います。"], [3190, "りせ", "今、投資やAIにアクセスされている方はラッキーだと思うので、ぜひそれを味方に、より豊かになってください。今日のライブの感想をオープンチャットにアウトプットしてくださった方には、抽選でパレスホテルの紅茶もプレゼントします。書くのが恥ずかしい方も、特別セミナーは参加するだけで受け取れるので安心してください。伊藤さん、ありがとうございました。"], [3322, "りせ", "伊藤さんの鋭い引き出し力で、AIの投資での使い方や、今みんなが何に注目してやっているのかをお話しさせていただきました。AIも投資も、今やるといい。私たちが普段やっている投資の方法と、それをどうAIで活用して、いい情報を集めて利益につなげているのかまで、12月1日からのプログラムでしっかりお伝えします。次回は明日13時から、オープンチャット限定のYouTubeライブで、これから投資を始める方がどんなふうにステップアップしていけばいいのかをお話しします。今日もありがとうございました。"]]}];
const $ = (s, r=document) => r.querySelector(s);
const fmt = s => { const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=String(s%60).padStart(2,'0'); return h? `${h}:${String(m).padStart(2,'0')}:${x}` : `${m}:${x}`; };
const yt = (vid, t) => `https://youtu.be/${vid}${t?`?t=${t}`:''}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const playIcon = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
let fontSize = 16;
try { fontSize = parseInt(localStorage.getItem('txs')) || 16; } catch(e) {}

function renderPicker(cur){
  $('#picker').innerHTML = LIVES.map(l => `
    <button class="pick${l.soon?' soon':''}" data-id="${l.id}" aria-current="${l.id===cur}">
      <div class="d">${esc(l.date)}・${esc(l.type)}</div>
      <div class="t">${esc(l.title)}</div>
    </button>`).join('');
  $('#picker').querySelectorAll('.pick').forEach(b => b.onclick = () => { location.hash = 'live-' + b.dataset.id; });
}

function renderLive(l, mode){
  const host = $('#live');
  const head = `
    <div class="livehead">
      <div class="tags"><span class="tag">${esc(l.date)}</span><span class="tag g">${esc(l.type)}</span>${l.duration?`<span class="tag g">${esc(l.duration)}</span>`:''}</div>
      <h2>${esc(l.title)}</h2>
      ${l.guest?`<div class="guest">ゲスト：${esc(l.guest)}</div>`:''}
    </div>`;
  if (l.soon){
    host.innerHTML = head + `<div class="card soonbox"><strong>まとめを準備中です</strong><p>できあがり次第、ここに追加します。<br>先にライブ動画で見ることもできます。</p><div style="margin-top:16px"><a class="bigbtn" target="_blank" rel="noopener" href="${yt(l.vid)}">${playIcon}ライブ動画を見る</a></div></div>`;
    return;
  }
  const slides = l.slides.map((s,i) => `
    <article class="slide" aria-label="${i+1}枚目">
      <div class="no">${String(i+1).padStart(2,'0')} / ${String(l.slides.length).padStart(2,'0')}</div>
      <h3>${esc(s.h)}</h3>
      <p>${esc(s.p)}</p>
      ${s.li?`<ul>${s.li.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
      ${s.key?`<div class="key">${esc(s.key)}</div>`:''}
      <div class="go"><a class="listen" target="_blank" rel="noopener" href="${yt(l.vid,s.t)}">${playIcon}この話を聞く（${fmt(s.t)}〜）</a></div>
    </article>`).join('');
  const chapters = l.slides.map(s => `<li><a href="${yt(l.vid,s.t)}" data-t="${s.t}"><span class="tm">${fmt(s.t)}</span><span class="ct">${esc(s.h)}</span></a></li>`).join('');
  const secStarts = new Map(l.slides.map(s => [s.t, s.h]));
  const tx = l.transcript.map(([t, who, text]) => {
    const isGuest = who && who !== 'りせ';
    return `<div class="para">
      <div class="pm"><a target="_blank" rel="noopener" href="${yt(l.vid,t)}">${fmt(t)}</a>${who?`<span class="who${isGuest?' guest':''}">${esc(who==='りせ'?'りせ':who+'さん')}</span>`:''}</div>
      <p>${esc(text)}</p></div>`;
  }).join('');

  host.innerHTML = head + `
    <div class="msg"><div class="lab">このライブでいちばん伝えたいこと</div><p>${esc(l.message)}</p></div>
    <div class="modes" role="tablist">
      <button class="mode" role="tab" data-m="sum" aria-selected="${mode==='sum'}">3分で要約<small>スライドで読む</small></button>
      <button class="mode" role="tab" data-m="aud" aria-selected="${mode==='aud'}">音声で聞く<small>ながら聞きに</small></button>
      <button class="mode" role="tab" data-m="txt" aria-selected="${mode==='txt'}">全文を読む<small>文字起こし</small></button>
    </div>
    <div class="panel" data-p="sum" ${mode!=='sum'?'hidden':''}>
      <div class="deck" id="deck">${slides}</div>
      <div class="deckbar"><div class="dots" id="dots">${l.slides.map((_,i)=>`<button aria-label="${i+1}枚目へ" aria-current="${i===0}"></button>`).join('')}</div>
      <div class="arrows"><button id="prev" aria-label="前へ">‹</button><button id="next" aria-label="次へ">›</button></div></div>
      <p class="hint">横にスワイプしてめくれます</p>
    </div>
    <div class="panel" data-p="aud" ${mode!=='aud'?'hidden':''}>
      <div class="card">
        <div class="player"><iframe id="yt" src="https://www.youtube-nocookie.com/embed/${l.vid}?playsinline=1&rel=0" title="${esc(l.title)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
        <p class="note">家事や移動中に、イヤホンでながら聞きするのがおすすめです。下の目次をタップすると、その場面から再生します。</p>
        <a class="sublink" target="_blank" rel="noopener" href="${yt(l.vid)}">YouTubeアプリで開く</a>
        <ul class="chap">${chapters}</ul>
      </div>
    </div>
    <div class="panel" data-p="txt" ${mode!=='txt'?'hidden':''}>
      <div class="tools"><p class="note">時刻をタップすると、その場面から聞けます。</p>
        <div class="fs" role="group" aria-label="文字の大きさ"><button data-fs="15">小</button><button data-fs="16">中</button><button data-fs="18">大</button></div></div>
      <div class="tx" id="tx" style="--txs:${fontSize}px">${tx}</div>
    </div>`;

  host.querySelectorAll('.mode').forEach(b => b.onclick = () => {
    host.querySelectorAll('.mode').forEach(x => x.setAttribute('aria-selected', x===b));
    host.querySelectorAll('.panel').forEach(p => p.hidden = p.dataset.p !== b.dataset.m);
    const top = $('.modes').getBoundingClientRect().top + scrollY - 4;
    if (scrollY > top) scrollTo({top, behavior:'smooth'});
  });
  host.querySelectorAll('.chap a').forEach(a => a.onclick = e => { e.preventDefault();
    $('#yt').src = `https://www.youtube-nocookie.com/embed/${l.vid}?playsinline=1&rel=0&autoplay=1&start=${a.dataset.t}`;
    $('#yt').scrollIntoView({behavior:'smooth', block:'center'}); });
  host.querySelectorAll('.fs button').forEach(b => {
    b.setAttribute('aria-pressed', +b.dataset.fs === fontSize);
    b.onclick = () => { fontSize = +b.dataset.fs; $('#tx').style.setProperty('--txs', fontSize+'px');
      host.querySelectorAll('.chap a').forEach(a => a.onclick = e => { e.preventDefault();
    $('#yt').src = `https://www.youtube-nocookie.com/embed/${l.vid}?playsinline=1&rel=0&autoplay=1&start=${a.dataset.t}`;
    $('#yt').scrollIntoView({behavior:'smooth', block:'center'}); });
  host.querySelectorAll('.fs button').forEach(x => x.setAttribute('aria-pressed', x===b));
      try { localStorage.setItem('txs', fontSize); } catch(e) {} };
  });
  const deck = $('#deck'), dots = [...$('#dots').children], n = l.slides.length;
  const idx = () => Math.round(deck.scrollLeft / (deck.clientWidth + 12));
  const go = i => deck.scrollTo({left: Math.max(0,Math.min(n-1,i)) * (deck.clientWidth + 12), behavior:'smooth'});
  const sync = () => { const i = idx(); dots.forEach((d,k)=>d.setAttribute('aria-current', k===i)); $('#prev').disabled = i===0; $('#next').disabled = i===n-1; };
  deck.addEventListener('scroll', () => requestAnimationFrame(sync), {passive:true});
  dots.forEach((d,k) => d.onclick = () => go(k));
  $('#prev').onclick = () => go(idx()-1); $('#next').onclick = () => go(idx()+1);
  sync();
}

function route(){
  const m = location.hash.match(/^#live-(\w+)$/);
  const ready = LIVES.filter(l => !l.soon);
  const l = (m && LIVES.find(x => x.id === m[1])) || ready[0] || LIVES[0];
  renderPicker(l.id);
  renderLive(l, 'sum');
}
addEventListener('hashchange', () => { route(); $('#picker').scrollIntoView({behavior:'smooth', block:'start'}); });
route();
</script>
</body>

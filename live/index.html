<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>連続ライブ 見逃しまとめ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#2B3A5C; --coral:#F0647A; --gray:#9AA0A6;
  --coral-soft:#FDECEF; --cream:#FFF9F6; --line:#ECE6E3; --ink:#2B3A5C; --sub:#6B7385;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);background:var(--cream);line-height:1.8;font-size:16px}
a{color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 48px}

/* hero */
.hero{background:linear-gradient(160deg,#fff 0%,var(--coral-soft) 100%);border-bottom:1px solid var(--line)}
.hero .wrap{padding-top:28px;padding-bottom:22px}
.eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--coral);background:#fff;border:1px solid #F7C3CC;border-radius:999px;padding:2px 12px}
.hero h1{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:28px;line-height:1.35;margin:12px 0 8px}
.hero p{font-size:14px;color:var(--sub)}
.ways{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.ways span{font-size:13px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px}

/* live picker */
.picker{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0 6px}
.pick{appearance:none;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s}
.pick .d{font-size:12px;color:var(--sub);font-weight:700}
.pick .t{font-size:13px;font-weight:700;line-height:1.45;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pick[aria-current="true"]{border-color:var(--coral);box-shadow:0 2px 0 var(--coral)}
.pick.soon{opacity:.6}

/* live head */
.livehead{margin-top:22px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--navy);color:#fff}
.tag.g{background:#fff;color:var(--navy);border:1px solid var(--line)}
.livehead h2{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:22px;line-height:1.45;margin:10px 0 4px}
.guest{font-size:14px;color:var(--sub)}

/* key message */
.msg{margin:18px 0 6px;background:var(--coral);color:#fff;border-radius:var(--radius);padding:20px 20px 18px;position:relative}
.msg .lab{font-size:12px;font-weight:700;letter-spacing:.08em;opacity:.95}
.msg p{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:20px;line-height:1.6;margin-top:6px}

/* mode tabs */
.modes{position:sticky;top:0;z-index:5;background:var(--cream);display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px 0 10px;margin-top:14px}
.mode{appearance:none;font:inherit;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px;cursor:pointer;color:var(--navy);font-weight:700;font-size:14px;line-height:1.3}
.mode small{display:block;font-size:11px;font-weight:500;color:var(--sub)}
.mode[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.mode[aria-selected="true"] small{color:#D6DBE6}
.panel[hidden]{display:none}

/* slides */
.deck{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:4px 2px 12px;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 20px 18px;display:flex;flex-direction:column;min-height:420px}
.slide .no{font-size:12px;font-weight:700;color:var(--coral)}
.slide h3{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:20px;line-height:1.5;margin:4px 0 10px}
.slide p{font-size:15px}
.slide ul{list-style:none;margin:12px 0 0;display:grid;gap:8px}
.slide li{font-size:15px;background:#F6F7FA;border-radius:10px;padding:8px 12px 8px 30px;position:relative;line-height:1.6}
.slide li::before{content:"";position:absolute;left:12px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--navy)}
.slide .key{margin-top:14px;border:2px solid var(--coral);color:var(--coral);border-radius:12px;padding:10px 12px;font-weight:700;font-size:16px;line-height:1.55}
.slide .key::before{content:"ここがポイント";display:block;font-size:11px;letter-spacing:.06em;margin-bottom:2px}
.slide .go{margin-top:auto;padding-top:16px}
.listen{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;text-decoration:none;color:var(--navy);border:1.5px solid var(--navy);border-radius:999px;padding:5px 12px}
.listen svg{width:14px;height:14px}
.deckbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:8px;height:8px;border-radius:50%;border:0;background:#D9D4D1;cursor:pointer;padding:0}
.dots button[aria-current="true"]{background:var(--coral);width:20px;border-radius:6px}
.arrows{display:flex;gap:8px}
.arrows button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer;color:var(--navy);font-size:18px;font-weight:700}
.arrows button:disabled{opacity:.35;cursor:default}
.hint{font-size:12px;color:var(--sub);text-align:center;margin-top:8px}

/* audio */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--navy);color:#fff;text-decoration:none;border-radius:14px;padding:14px;font-weight:700;font-size:16px}
.bigbtn svg{width:22px;height:22px}
.note{font-size:13px;color:var(--sub);margin-top:10px}
.chap{list-style:none;margin-top:16px;border-top:1px solid var(--line)}
.chap li a{display:flex;gap:12px;align-items:baseline;padding:12px 2px;border-bottom:1px solid var(--line);text-decoration:none}
.chap .tm{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--coral);font-variant-numeric:tabular-nums;min-width:52px}
.chap .ct{font-size:15px;font-weight:500}

.player{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.sublink{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:var(--navy)}
/* transcript */
.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tools .note{margin:0}
.fs{display:flex;gap:4px}
.fs button{appearance:none;font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;cursor:pointer;color:var(--navy)}
.fs button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.tx{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:6px 18px}
.para{padding:14px 0;border-bottom:1px solid var(--line)}
.para:last-child{border-bottom:0}
.pm{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.pm a{font-size:12px;font-weight:700;color:var(--coral);text-decoration:none;font-variant-numeric:tabular-nums}
.who{font-size:12px;font-weight:700;border-radius:6px;padding:0 8px;background:var(--navy);color:#fff}
.who.guest{background:#E9ECF2;color:var(--navy)}
.para p{font-size:var(--txs,16px);line-height:1.9}
.para.sec{background:var(--coral-soft);margin:6px -18px;padding:12px 18px;border-bottom:0}
.para.sec .sech{font-weight:700;color:var(--coral);font-size:13px}

/* soon */
.soonbox{margin-top:22px;text-align:center;padding:36px 20px}
.soonbox p{color:var(--sub);font-size:14px;margin-top:8px}

/* cta */
.cta{margin-top:34px;background:var(--navy);color:#fff;border-radius:var(--radius);padding:22px 20px;text-align:center}
.cta .s{font-size:12px;letter-spacing:.06em;opacity:.85}
.cta h4{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:19px;line-height:1.5;margin:6px 0}
.cta p{font-size:14px;opacity:.95}
.cta a{display:inline-block;margin-top:14px;background:var(--coral);color:#fff;text-decoration:none;font-weight:700;border-radius:999px;padding:12px 26px}
.foot{font-size:12px;color:var(--gray);text-align:center;margin-top:22px;line-height:1.7}
@media (min-width:560px){.picker{grid-template-columns:repeat(4,1fr)}.hero h1{font-size:32px}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <span class="eyebrow">株のはじめ方3daysプログラム 開催記念</span>
    <h1>連続ライブ<br>見逃しまとめ</h1>
    <p>忙しくてリアルタイムで見られなかった方へ。気になる回を選んで、好きな受け取り方でどうぞ。</p>
    <div class="ways"><span>3分で要約</span><span>音声で聞く</span><span>全文を読む</span></div>
  </div>
</header>
<main class="wrap">
  <nav class="picker" id="picker" aria-label="ライブを選ぶ"></nav>
  <section id="live"></section>
  <p class="foot">文字起こしはライブの自動字幕をもとに、読みやすく整えています。<br>コメント紹介などは一部短くしています。</p>
</main>

<script>
const LIVES = [{"id": "1103", "vid": "ip2a5RLWWY8", "date": "11/3（火）", "type": "単独ライブ", "guest": "", "title": "知識ゼロから億超えした秘密の投資術", "duration": "約62分", "message": "お金に働いてもらう側になれば、物価高もAI時代もこわくない。いちばん大事なのは「何のために投資するのか」を自分で決めること。", "slides": [{"t": 191, "h": "ママになって実感した「お金に働いてもらう」価値", "p": "今年2月に出産したりせさん。赤ちゃんのお世話中はスマホを見る時間もほとんどない。それでも、持っている株は上がっていってくれる。", "li": ["投資は「自分の時間を使って働く」のではなく、お金に働いてもらうこと", "自分が代われないこと（子育て・仕事・介護など）に時間を使える", "AIが銘柄を調べてくれる時代になり、さらに続けやすくなった"]}, {"t": 561, "h": "物価は上がり続ける。現金だけでは目減りする", "p": "世の中のお金の量は増え続けるので、何もしないと1円の価値は下がっていく。そこに人件費の上昇や円安も重なっています。", "li": ["一度上がった物の値段は、なかなか下がらない", "人口が減ると人の労力が貴重になり、値上がりに拍車がかかる", "現金だけ持っている＝「価値が減るほう」に賭けているのと同じ"]}, {"t": 750, "h": "お金をそのまま持つより「持つ側」に回る", "p": "株を買う＝企業のオーナーになること。企業はビル・土地・技術・ノウハウなど実体のあるものを持っていて、それを使って稼いでくれます。", "li": ["企業が稼いで価値が上がれば、株価も上がる", "不動産や金なども「持つ側」の選択肢", "投資をしていると、自分の資産も上がるので物価高がストレスになりにくい"], "key": "株に興味を持った人は、時代に合った感覚を持っている"}, {"t": 1008, "h": "AIで仕事が変わっても、運用のスキルは奪われない", "p": "1年前「仕事の多くがAIやロボットに置きかわる」と話したときは実感がなかった人も、今は「本当に起きるかも」と感じているはず。", "li": ["りせさんも、外注先を探す前に「AIでできないか」を考えるように", "お金を運用するスキルは奪われない。スマホ1台で自分でできる", "AIで伸びる企業に投資すれば、自分がそこで働いていなくてもお金が働いてくれる"]}, {"t": 1325, "h": "AIは「上がる株を教えてくれる魔法」ではない", "p": "AIに聞けば100%上がる株が分かる…は半分正解で半分まちがい。情報はくれても、それを使いこなせるかは自分しだい。", "li": ["投資の知識・考え方を身につけてから、AIを使うのが一番早い", "AIのおかげで、初心者が中級者になるまでの時間がぐっと短く", "今から始める人は、一気にレベルアップできるチャンス"]}, {"t": 1453, "h": "子育て中でも続けられる投資スタイル", "p": "子どもの前ではスマホを触らないと決めているりせさん。それでも資産を増やせているのは、もともとのスタイルとAIの組み合わせ。", "li": ["「1日10分くらいしか見ない」と決めた株を買って、そのまま持つ", "いい銘柄を探す調べものは、AIにまかせて大幅に時短", "今は数百円〜数万円の少ない金額からでも株を始められる"]}, {"t": 1841, "h": "「なんとなく増えたらいいな」の人から脱落する", "p": "ゴールが決まっていない人、なぜやるのかが決まっていない人は、途中でやめてしまう。これは本当に予言です。", "li": ["例：3年後に子どもと1か月ハワイへ", "例：夫に「仕事を減らしていいよ」と言える蓄えをつくる", "「いつまでに・いくら」が決まると、どの株を買うかの計画が立てられる"], "key": "まずは自分と約束すること（言えるだけで一歩前進）"}, {"t": 2343, "h": "前向きさと「素直さ」が投資の土台", "p": "投資は企業の未来の成長にお金を投じるもの。だから、うまくいく人は基本的に前向き。", "li": ["変なプライドや「こうあらねば」という「謎の鎧」を脱ぐ", "素直に受け取る人ほど、何でも吸収して実行できる", "りせさんも、最初は斜に構えていたタイプ。環境の中で少しずつ変われた"]}, {"t": 3161, "h": "まとめ：投資を味方にすると叶う人生", "p": "物価が上がってもストレスにならない。AIで仕事が変わっても奪われない。赤ちゃんを抱っこしている間もお金が働いてくれる。", "li": ["人生の悩みの多くは、お金で解決できる", "でも家族や大切な人との時間は、お金では買えない", "そのお金では買えないものを大切にするために、お金に働いてもらう"], "key": "何のために投資をするのか、自分に聞いてみよう"}], "transcript": [[1, "", "皆さん、こんばんは。日本最大級の女性向け株式投資スクール代表の松下りせと申します。ぜひたくさんコメントしながら聞いていただけたら嬉しいです。久しぶりのライブですが、今回は「世界一やさしいAI時代の株のはじめ方3daysプログラム」を記念して、今日から連続ライブを開催します。プログラムは12月1日スタート。それまでの間、皆さんと投資の知識を高めていくライブをしていきますので、ぜひ全部ご覧ください。"], [66, "", "単独ライブは本当に久しぶりで少し緊張していますが、楽しくできたら嬉しいです。今回は「時間もお金も自由になる、知識ゼロから億超えしたママ投資家の投資術」をお送りします。私がこれまで経験してきたこと、そして今年2月に出産してから、さらに強化してやってきたことをまとめてお話しします。"], [130, "", "このプログラムに参加してくださっている方は、投資をスタートしたい、株を始めたい、なんとなくやっているけどもっとしっかり考えて利益を出せるようになりたい、そんな気持ちで来てくださっていると思います。連続ライブの初回なので、投資でうまくいくために一番大切な、基本中の基本だけど、ここがぶれるとなかなかうまくいかない、というお話をメインにします。"], [191, "", "私の最近のアップデートから話すと、ママになりました。息子が生まれて、今8か月です。正直、産む前はその後どうなるのか全然想像がつかなくて、仕事も投資も上手に続けていけるのか、ずっと不安でした。寝不足、授乳、離乳食…いろいろあると聞いていたので。でもやってみたら逆で、投資をしていて本当によかった、とずっと思っていました。"], [255, "", "投資は、時間を使って働くことではなく、お金に働いてもらうこと。自分が何かを考えたり行動したりしていない時に、資産を増やしていってくれます。赤ちゃんのお世話をしている間に、持っている株が上がっていてくれるわけです。これってすごいことだなと。子育てしてみて、こんなに子どもから手が離せないのかとびっくりしています。目の前にいると気になるし、抱っこと言われたら抱っこしてあげたい。スマホを見ている暇はほとんどなくて、フルタイムの会社員だった時くらい見られていません。それでもお金は働いてくれるんです。"], [319, "", "私は26歳で株をスタートして、28歳で本気で取り組み、知識ゼロから億以上の資産を築けるようになりました。その価値が本当に発揮されたのは、子どもができて、自分にしかできないこと、他の人じゃなく私が見てあげたいことができた時でした。それに時間を使えるのは素晴らしいことで、これが「お金に働いてもらう」本当の価値なんだと改めて実感しました。人によっては、大切な仕事だったり、家族のことだったり、介護だったりすると思います。だからこそ、投資を味方にすることはめちゃめちゃ大事だと思ったんです。"], [383, "", "しかもこのご時世、AIが出てきました。指示をすれば、自分の代わりに銘柄について調べてくれたりする。本当にこの時代に子育てできてよかったと思っています。大事なものを大事にできるからです。投資はいろんな人にとって、すごくスタートしやすくなったと思います。私も産む前から使っていましたが、子どもに時間を使いたい気持ちが高まるにつれて、投資でもできるだけAIを活用しようと意識しています。その結果、皆さんにお伝えしたいこともたくさん増えました。"], [446, "", "3daysプログラムは以前も別のテーマで開催したことがあって、出産もあるのでそれを最後にしようと思っていたんです。でも今回、AIという切り口があるので、もう一度リニューアルしてお届けすることにしました。皆さんは投資でAIを使っていますか？（コメントを受けて）「AI活用すごく気になります」、ありがとうございます。AIもインスタも、機能がどんどんアップデートしますよね。すごく効率よく使っている人もいれば、ちょっと危ない使い方をしている人もいる。こう使うと強い味方になってくれる、というお話も、プログラムで体系的にしていきます。AIが普及した今の時代の株のはじめ方を、知識ゼロの人に向けて世界一分かりやすく3日間でお伝えします。"], [561, "", "AIの進化は便利な一方で、社会の構造が今すごく変わっていることも、皆さん感じていると思います。まず、AIをさておいても、物価の上昇はどんどん加速していますよね。1年前にライブをした時は、高級ブランドの値上がりの話をしていましたが、今は食料品なども本当に値上がりしています。"], [624, "", "この先、人口が減ることなどを考えると、人の労力が貴重になって、物価上昇にはさらに拍車がかかるのではないかと思っています。物の値段は一度高くなると、なかなか安くならないんです。そして、いつもお話ししていることですが、普通に生きている限り、お金の価値は実は下がっていっています。世の中のお金の量は基本的に増え続けているので、私たちが持っている1円の価値は、放っておくと下がっていくんです。"], [688, "", "それに加えて、人件費の上昇や物の価格の上昇が、最終的に消費者に直撃する。これは世界的なトレンドですが、日本の場合はさらに円安が重なって、どんどん拍車がかかっています。日本円の現金だけを持っているのは、「何もしていない」のではなく、基本的に価値が減るほうに賭けているのと同じなんです。それに気づいて、預金をやめて投資に回す人もどんどん増えています。おじいちゃん・おばあちゃん世代も気がつき始めていて、若い世代、現役世代はなおさら大事な時代になりました。"], [750, "", "じゃあどう対策すればいいか。私はAIが生まれたことでさらに拍車がかかっていると思っていますが、お金をそのまま持つのではなく、何かを所有する側に変わっていくことがすごく大切です。株に興味がある人は、とても感覚がいいと思います。株式投資は、株を買うことでその企業のオーナーになること。間接的に企業を所有できる権利なんです。"], [814, "", "株というと電子的なものを想像する人も多いのですが、企業は実体のあるものです。ビルや土地、サービスや技術、ノウハウを持っています。それをうまく使って稼いでくれれば、自分の株も上がっていくし、企業が持っているものの価値が上がれば、株価も上がっていきます。ただお金を持つのではなく、所有する側に回ることがすごく大事。今日このライブを聞きに来てくださっている方、株を始めるぞと思っている方は、すごく時代に合った感覚をお持ちなので、自信を持ってください。"], [878, "", "常々思っているのですが、投資をしていると、物価高って実はストレスじゃなくなっていくんです。自分が持っているものの価値も上がっていくので。節約している人たちは「物が高くなったな」とよく話していると思うんですけど、投資や運用をしっかりやっていると、自分の資産も上がっていくので、価格が上がること自体にストレスが起きにくくなります。企業でも、不動産でも、金でも、お金を何かしらの物に変えている人ほど、物価上昇はストレスにならないんです。"], [942, "", "皆さんの中で、株は初めてという方、投資をやっているという方、ぜひ自分の状況をコメントしてください。（コメントを受けて）「どのように始めればいいか知りたい」「全く投資はしたことがない」「ミニ株をしています」、ありがとうございます。どんなところからでもトライすることが一番大事です。初めての方にも分かりやすく、「世界一分かりやすい」に恥じないようにお話ししていきます。"], [1008, "", "2025年の段階で、「5年後には仕事の多くがAIやロボットに置きかわる」というお話をしました。当時は、本当にそんなことが起きるの？と実感がない方が多かったんです。あれから1年経って、思ったより波が早く来ていると感じている方も多いのではないでしょうか。私の夫はエンジニアなんですが、家でもずっとAIの話をしていて、AIのおかげで外注しなくて済むようになったところがすごくたくさんあると感じています。"], [1199, "", "AIによって多くの仕事がなくなるとも言われています。実際に私も、以前は会社の仕事を誰かに依頼する時、まずスキルマーケットで探したり、インスタで探したりしていました。今は、まず「AIでできないかな」と考えるようになりました。今私たちがしているようなお金の稼ぎ方が、だんだんできなくなっていくんです。"], [1264, "", "その中で投資が一番いいなと思うのは、投資のスキルは奪われないスキルだということ。AIの時代でも絶対にやったほうがいいと思いますし、スマホ1台で自分1人でできる。これからAIが普及していくにつれて、資産運用の価値に目覚める人は増えていくと思います。しかも今は、AIのおかげでどんどんやりやすくなっています。初心者が中級者になるまでにかかっていた時間が、めちゃめちゃショートカットされている。今から投資を始めたいと思っている人は、一気にレベルアップして運用できるので、すごいチャンスです。羨ましいくらいです。"], [1325, "", "ここで多くの人が勘違いしていることがあって、「AIに聞けば100%上がる株を教えてくれるんでしょう」と思っている方もいるんです。それは半分正解で、半分間違いだと、実際に自分でやっていて思います。いろんな情報を与えてくれるけれど、それを上手に使えるかどうかは、AIの使い方と、適切な投資の知識を持っているかどうかで大きく差がつきます。考え方を自分で身につけたうえでAIを活用するのが一番早い。ぜひプログラムで身につけてください。"], [1394, "", "仕事が減ったとしても、お金を運用するスキルは奪われないし、むしろAIでどんどん効率よくできるようになっています。それに、AIがどんどん発展していったとしても、AIで急成長する企業に投資していれば、自分がその会社で働いていなくても、自分のお金がそこで働いてくれる。仮に自分の仕事がなくなったとしても、AIで活躍している企業の株を持っておけば、資産は増えていくんです。自分にそのスキルがなくても、お金を投じることで資産を増やせる。それが投資の面白いところで、投資家のおいしいところだと思っています。"], [1453, "", "実際に今、私がどう投資をしているかというと、昔より本当にスマホを見られる時間が減りました。子育てされている方はもう実感されていると思いますが、赤ちゃんがいるとスマホを触れないんです。触ることはできるけど、子どもが興味を持ってしまうので、それよりこういうことで遊んでほしい、というのがあるんですよね。だから子どもの前ではスマホを触らないようにしていて、子どもが起きている時は調べものもできるだけしません。株を買ったり、銘柄をチェックしたりも、昔よりしづらくなりました。"], [1531, "", "でも、もともと私の投資スタイルは、1日10分くらいしか見ないと決めた株を買って、そのまま放置しておくというものだったので、そこまでストレスになりませんでした。さらに今は、いい銘柄を見つけるための調べものもAIにまかせて進めているので、格段に時間がかからなくなって、すごく楽になったんです。子どものためにスマホを見ないと徹底して、日中は本当に見られていないけれど、もともとの投資スタイルとAIを組み合わせることで、資産を増やせるようになりました。本当にこの時代に出産してよかったと思っています。"], [1611, "", "去年と比べても何倍も早くなりました。欲しい情報は伝えておけば調べてくれるし、「こういう情報が欲しい」と言っておくと送ってくれたりもする。自分で探しに行く手間も省けて、すごい時短です。3daysではこのあたりのお話もします。今は、本当に少ない金額からでも株をスタートできます。ぜひこのプログラムで、少額からでもスタートしてください。"], [1680, "", "私は今年、子育てをしながらでも、億単位の利益を出すことができています。せっかくのライブなので、アウトプットしながら聞いてほしいんですけど、皆さんは投資で、年でも月でもいいので、実際いくら増えたら嬉しいですか？正直な数字で答えてみてください。私は会社員で投資をスタートした時、月5万、10万増えたら嬉しいなと思っていました。そのうち、当時の自分の月収くらいのお金が増えたら嬉しいな、と目標を置いていました。"], [1750, "", "（コメントを受けて）「月50万」「100万」「今のお給料くらい欲しい」「月30万」「年100万」…皆さん素晴らしいですね、アウトプット慣れしています。私も最初は月収くらいを目標にして、その後、月100万円を目標にして達成していきました。投資をすると、自分が働かなくてもそういったことを叶えられる世界になります。私も子育て中の今、それが叶えられていますし、皆さんもやっていけばできるようになります。"], [1841, "", "今回ライブでアウトプットしてもらったのには理由があります。3daysプログラムは、オープンチャットも活用しながら行っています。なぜプログラムの前からオープンチャットをやっているかというと、なぜ自分は投資をするのか、何のために投資をするのか、何を叶えたいのかを明確にして、そのうえで知識やスキルを得ていくことが、とても大切だからです。"], [1880, "", "私も投資をスタートする前は斜に構えていて、そういうことを頑張っている人を冷めた目で見ていたことがありました。お恥ずかしながら、貧乏マインドだったなと思います。でも、それができている人のほうが、見ていてうまくいっていたし、私自身も目標を設定して人に言うようになって、「自分はこれがしたいんだ」としっかり思えるようになってから、投資がうまくいきました。"], [1906, "", "投資をやっている方は実感があると思いますが、ゴールが決まっていない人、なぜそれをやるのかが決まっていない人から脱落していきます。なんとなく増えたらいいな、だとやめちゃうんです。これは本当に予言です。たとえば、3年後に子どもと1か月ハワイに行く、夫に「仕事を減らしていいよ」と言える蓄えを作る、夫婦で早期リタイアする。自分のやりたいことと、それをいつまでにやるかを決めると、投資を続けることができて、だからこそ叶えられるんです。"], [1970, "", "やりたいことがあると、自分の人生をよくしていくために、いつまでにいくら欲しいのかが明確になります。それが明確になって初めて、手元のお金をどう増やしていけばいいか、具体的な計画が立てられる。投資をよく知らない人、なんとなく始めようとしている人に「いくら増えたら嬉しい？」と聞くと、「なんとなくたくさん」「できるだけ多く」という答えが本当に多いんです。"], [2010, "", "これが起こる理由は2つ。自分の叶えたい人生に真剣に向き合っていないことと、単純に知識不足です。知識がないから、どれくらいの投資でどれくらい資産を増やせるのか具体的なイメージが湧かない。そして、知識やスキルがあっても、ぼんやりしていると「来年までにいくら作りたいから、この株を買おう」というところがぼやけてしまう。そうすると、本当に投資をやらなくなってしまいます。"], [2070, "", "私がなぜ投資でうまくいって、億を作れるようになったのかを振り返ると、全然高尚な話ではないんです。でも、たとえば月100万円の利益を出せるようになりたい、という思いを強く持って、だからこのお金をいつまでにこうしよう、だからこういう銘柄を買おう、と考えることができた。それが結果的に資産を増やすことにつながりました。今皆さんに「いくら欲しいですか」と聞いたのは、まずそれを言えること、自分との約束ができることが、本当に一番大事だからです。"], [2120, "", "とはいえ、やりたいことがすぐに出てこない人もいると思います。そういう人は、今回は練習だと思ってください。私も最初は出てこなかったんです。考えたことないし、自分にできるか分からないし、といろんな理由をつけて。でもある時から、今振り返ると環境の力だと思うんですけど、自分も頑張りたいと思えるようになって、目標を立てられるようになり、そのために投資を頑張ろうと思えて、結果的に資産を増やすことにつながりました。"], [2159, "", "3daysの本番では、知識やスキル、大切な考え方をしっかりお伝えします。その前に、それらを扱う土台となる話や、本番に入れきれなかった知識を、オープンチャットやライブでお話ししていきます。皆さんにワークに答えてもらったりもします。3days、そしてその先の投資でうまくいくための下準備だと思ってください。オープンチャットで理想の未来を書いている方を見て「それいいな」と思った方も、「まだ書けないな」「この人何やってるんだろう」と思った方もいると思います。今それを感じていることは、全部OKです。"], [2223, "", "もし少しでも一歩進みたいと思ったら、勇気を持ってアウトプットしてみてください。読んでいるだけでも、自分が何のために投資をするのか、「私はこれを叶えていくから、これをするんだ」という自分との約束が、どんどん強固になっていきます。ここに来てくださっている方は、投資を味方にして、自分の人生を花開かせていく素敵な女性たちです。いろんな方の理想の未来や、こう考えて投資を始めたんだ、を知ると、頑張る安心の土台にもなるし、「こんな質問していいのかな」「分かってない私はダメなんじゃないか」という制限も、全然そんなことないと気づけます。"], [2343, "", "（コメント「叶えたい未来を考えるのが楽しかったです」を受けて）うまくいきますね。少し脱線しますが、投資でうまくいく人は基本的に前向きなんです。投資は、自分のお金を企業の未来の成長に投じるもの。この先も世の中は良くなっていくはず、という根底がないと、何かが値上がりするとか、この企業は成長するとか思えないんです。だから前向きさは大事。でも私も最初はそれができなかった後発組なので、今できていなくても落ち込まないでくださいね。"], [2408, "", "（コメント「貧乏マインドを脱却したい」を受けて）私ももともと貧乏マインドじゃなかったわけではないので、今でも悪い癖が出るんじゃないかと思って、自分に言い聞かせているところがあります。私が感じている脱却のポイントは、斜に構えず、変なプライドを持たずに、素直に受け取ること。その「謎の鎧」がない人が、何でも吸収して実行して、うまくいきます。やりたいことや欲望はあるのに、「私は頑張ってきたし」「こんなことしても意味ないでしょう」と思ってしまう気持ち、すごく分かります。でもそこを突破してみると、本当にうまくいきました。"], [2534, "", "プライドや、「こうあらねばならない」という思い込みを取り払っていくと、いろんな物事への吸収力が上がっていきます。私自身、最初は斜に構えたところから投資をスタートしましたが、本気で頑張ろうと思った時に、皆さんのように「月100万円の利益を出したい」とちゃんと宣言して、ひたむきにやってみました。そうしたら半年後くらいに、その結果を出すことができました。アウトプットしたり、外に出さなくても自分に聞いてみたりして、振り返るきっかけにしてもらえたら嬉しいです。"], [2660, "", "3daysプログラムでは、AI時代の資産の増やし方について、今の環境に合わせたお話をします。Day1は投資の土台となる考え方。Day2は銘柄の探し方で、AIの話もしますし、今の銘柄の探し方の考え方をしっかりお伝えします。Day3は、どういう時に買っていくのか、買う時に大切なこと、どうやったら資産を増やせるのかをお話しして、皆さんのはじめの一歩につながる形にします。今の時代に合わせて内容をアップデートしています。"], [2723, "", "参加するには、ライブ下のリンクから入っていただくと、オープンチャットへのご案内があります。オープンチャットに入ったら「マストワーク0」に回答してください。これが3daysプログラムに参加するためのチケットになります。30秒くらいでできる簡単なワークです。回答してくださった方だけに、3days当日のリンクが届きます。出さなくても届くんでしょう、と思っている方もいるかもしれませんが、そんなことはなくて、本当に届かないし、アーカイブも見られません。ぜひこのライブを見終わったら、マストワーク0を提出してください。"], [2850, "", "（質問「斜に構えていたのを、本気で頑張ろうと切り替えたきっかけは？」を受けて）強いきっかけがあったわけでは全然なくて、このままやっていても変わらないなと思ったんです。私はもともとオリエンタルランドで働く会社員でした。転職してその仕事につけてすごく嬉しかったんですけど、お給料が思うように上がらなかったり、転職して下がったりして。頑張るタイプなので、報われない気持ちもありました。でも好きなことをやっているのに、お金でそんなことを思うのも嫌で、モヤモヤしていたんです。"], [2910, "", "お金の不満を会社で解消するのは現実的じゃないので、別のことをやらなきゃと思って、投資を頑張ろうと思いました。でもいざ勉強しようと思っても、前のめりになれなかった。そんな時、周りの人たちが頑張ってアウトプットしたり、利益を出したりしているのを見て、「私もここでちゃんとやらないと、またずっとモヤモヤを繰り返すんだな」と思ったんです。強烈な出来事があったわけではなく、環境にいるうちに「なんであの時ああ思ったのに、ちゃんとやっていないんだろう」と疑問に思うようになって、ちゃんとやり始めました。"], [2975, "", "その時に、お金に縛られずに、自分のやりたい仕事や人生をもっと楽しむにはどうしたらいいんだろうと思って、まず月100万円くらいの利益を出してやろう、と決めたのがきっかけでした。徐々に変わっていった感じです。大きなきっかけがないと、と思う方もいるかもしれませんが、私は周りを見ながらじわじわと「ちゃんと頑張ろう」と思えた。環境のおかげだと思います。"], [3015, "", "（質問を受けて）今回は特典もたくさん作っているので、いろんなワークがありますが、マストワークと特典ゲットワークは別です。マストワーク0は、オープンチャットで毎日案内が届きます。また、オープンチャットに入る前に登録した3daysプログラムの特設LINEに「マイページ」があって、そこからもマストワークを提出できます。3daysプログラムはアーカイブがなく当日限りなので、ぜひ予定を空けてご参加ください。AIの話も初出しでいろいろお話しします。"], [3110, "", "今日のライブを見て、「私は投資を味方にして、こんな人生を叶えたい」と思ったことを、ぜひオープンチャットにアウトプットしてください。何でもいいんです。私は、自分のお金に縛られずに、好きな仕事ややりたいことをできるようになりたい、というのがモチベーションで、それが月100万円の利益を出したい、につながりました。何のために投資をするのか、投資で何を叶えたいのか、投資を通じて何ができるようになったら嬉しいのか、ぜひ書いてみてください。"], [3161, "", "今日のまとめです。投資をしていると、物価が上がってもストレスにならない。AIで仕事が変わっても、奪われない。赤ちゃんを抱っこしている間でも、お金が働いてくれる。そんな人生を、投資を味方にすることで叶えられます。そして今は、AIのおかげで、そのためにかける労力も格段に少なくなりました。"], [3240, "", "私が実感しているのは、人生の悩みの9割はお金で解決できるということ。でも残りの1割、家族や大切な人との時間は、どうやってもお金では買えなかったりします。その1割を大切にするために、9割をお金にまかせることで、自分の理想の人生を作っていける。私は月100万円の次は億を目標に頑張ってきて、叶えることができました。3daysプログラムで株をスタートしてくださった皆さんにも、ぜひそんな人生を手に入れてほしいと思っています。"], [3290, "", "12月1日まで、ライブ配信もたくさんしますし、オープンチャットでも3daysで伝えきれない投資の知識を発信していきます。次回は、工藤りささんとのコラボライブ。「ずるいほど幸せになるお金の器の広げ方」というテーマです。たくさん受け取れるようになりたい方、投資と聞いてざわざわする方、月いくら欲しいと素直に言えない方は、ぜひ見てください。お金の器を広げていけば、億なんて遠いと思っている方も、ちゃんと手に入れられるようになるし、そのための行動もできるようになります。"], [3420, "", "（コメント「お金で買えないものを大切にしつつ、稼げるようになりたいです」を受けて）素晴らしい、なれます。今日の「投資を通じて叶えたいこと」をぜひオープンチャットにアウトプットしてください。私も全部見ていますし、先輩の女性投資家のメンバーがコメントを返したり、アドバイスをしたりもしています。アウトプットしてくださった方には特典もプレゼントします。ライブは21時、21時半を中心に行い、3daysの本番は21時からです。分からなくなったら、LINEやDM、オープンチャットで気軽に聞いてください。"], [3540, "", "「世界一やさしい株のはじめ方」として、皆さんをただの投資家デビューではなく、資産を増やせて、その先の理想の人生も叶えられる投資家にするためのプログラムにします。丸1時間お話ししました。この後、マストワーク0がまだの方はぜひ提出してください。そして、何のために投資をするのか、投資の先に何をしたいのかを、ぜひ自分に聞いてみてください。次回は11月5日21時半からのコラボライブです。今日も遅くまでありがとうございました。おやすみなさい。"]]}, {"id": "1105", "vid": "at1reI8Vbi4", "date": "11/5（木）", "type": "コラボライブ", "guest": "工藤りささん（ずる真面目な生き方研究家）", "title": "ズルいほど幸せになる「お金の器」の広げ方", "duration": "約60分", "message": "お金を増やすために人生があるのではなく、望む人生を生きるためにお金がある。がんばれる力を「自分が幸せになる方向」に使おう。", "slides": [{"t": 245, "h": "ゲスト：工藤りささん", "p": "元公務員から起業。「愛すべきクソ真面目族」（がんばり屋さん）が生きやすくなる講座やコミュニティを運営。富山県在住、3人の娘さんのママでもあります。", "li": ["真面目な人は、努力も我慢もできて責任感も強い", "でも、自分が幸せになることにはとても厳しい", "それが特にあらわれるのが「お金」"]}, {"t": 640, "h": "お金の器を小さくする3つの思い込み", "p": "真面目な人ほどハマりやすい「お金の落とし穴」。思い当たるものはありませんか？", "li": ["①我慢することが美徳（自分のために使うと罪悪感）", "②苦労しないとお金を受け取ってはいけない", "③自分のことは後回し（子どもの習い事には出せても、自分の学びには出せない）"], "key": "そのルール、実は誰も決めていない"}, {"t": 856, "h": "価値は「かけた苦労」では決まらない", "p": "1時間で問題を解決してくれる専門家と、10時間かける専門家。お客さんにとってうれしいのはどちらでしょう？", "li": ["相手にとって大事なのは、受け取ったものの価値", "「苦労しないともらえない」と思うと、わざわざ遠回りしてしまう", "簡単に入ってきたお金も「ありがとう」で受け取っていい"]}, {"t": 1236, "h": "お金と幸せは「順番」が大事", "p": "りささんは「お金さえあれば幸せになれる」と思って走ってきたけれど、売上が増えても満たされなかった経験から気づいたそう。", "li": ["お金があっても、使い方次第で幸せとは限らない", "目標を達成しては次へ…の「もっともっと」では満たされない", "りせさん「楽しく欲望を持つことが大事」"], "key": "望む人生のためにお金がある（逆ではない）"}, {"t": 2041, "h": "「受け取る許可」を出すことに慣れる", "p": "お金を受け取れるかどうかは、日常の「受け取り方」とつながっています。", "li": ["「手伝おうか？」に「大丈夫です」と即答していない？", "ほめられたら「いえいえ」ではなく「ありがとう」", "人の好意を断る＝お金に代わるものを遠ざけているのと同じ"]}, {"t": 2160, "h": "お金を使って「人に頼る」経験をする", "p": "1人で抱えられる量には限りがあります。家事代行や子どもを預けるなど、お金を使って頼る経験が「器」を広げる一歩に。", "li": ["「このお金で、私の人生はどう変わる？」という視点で使う", "空いた時間と心の余裕で、自分が力を発揮できることに集中", "りせさんも、仕事を人に頼み始めたことで投資の勉強時間ができた"]}, {"t": 2510, "h": "投資が怖いのは「知らない」から", "p": "人はよく分からないものに一番恐怖を感じます。怖さを想像でふくらませて「なぞの怪物」を作っていませんか？", "li": ["まずは「知る」こと", "次に、石橋を叩きながら小さく「実験」してみる", "今は1株投資で、数百円〜数万円から試せる時代"], "key": "知ったら、ちょっとやってみたらいい"}, {"t": 2742, "h": "自分で判断できる力＝本当の自由", "p": "誰かが「これがいい」と言った銘柄をそのまま買うと、まずうまくいかない。最後に信じるのは自分の判断です。", "li": ["判断する力は、身につけることができるスキル", "どんな状況でも自分で生み出せる、という安心感", "りせさん「投資をしてから自由になったのは、判断する力が自分にあると知ったから」"]}, {"t": 2888, "h": "ママのお金の使い方が、子どもの価値観に", "p": "子どもは、親が何を言うかより、どう行動しているかを見て学んでいます。", "li": ["「もったいない」「ぜいたくはダメ」より", "「自分にとって大切なものを選ぶ力。そのためにお金を使う」", "ママが気持ちよくお金を使う姿が、最高のお金の教育に"], "key": "お母さんだって、やりたいことをやっていい"}], "transcript": [[0, "りせ", "皆さん、こんばんは。「世界一分かりやすいAI時代の株のはじめ方3daysプログラム」開催に向けたコラボライブ「超一流のお金の哲学」を連続でお届けしています。ライブが遅くなって大変申し訳ありません。なぜかアカウントに入れなくなってしまい、夫のスマホからならログインできたので、夫のスマホを借りて配信しています。せっかく来てくださったのにすみません。無事に始められてよかったです。気を取り直して、楽しく配信させていただきます。"], [64, "りせ", "この連続ライブは、3daysプログラムの開催を記念して、お金とちゃんと向き合って豊かに拡大している素晴らしい起業家・経営者・著者の方々とコラボさせていただく企画です。今回は「ずる真面目研究家」の工藤りささんにお越しいただきました。りささんは、イメージコンサルタントなどの事業を大きく手放して、「ずるいほど幸せになる生き方」を教える事業をされています。真面目で一生懸命でがんばり屋な女性たちがどんどん豊かに変わっていくのを支援されている、本当に素敵な方です。今日は「ずるいほど幸せになるお金の器の広げ方」というテーマで、皆さんが受け取れるお金の器を広げていくお話を伺います。"], [161, "りせ", "このライブの感想を3daysプログラムのオープンチャットにアウトプットしていただくと、抽選で1名様にAmazonギフト券が当たるキャンペーンをしています。最後にお伝えするワークにぜひ回答してください。では、りささんをお呼びします。"], [228, "工藤", "よろしくお願いします。トラブル、お疲れさまでした。"], [232, "りせ", "一瞬、中止の連絡を流しかけたんですけど、夫のスマホで入れました。告知までしてくださったのに本当に申し訳なかったです。では、りささん、自己紹介をお願いします。"], [245, "工藤", "皆さん初めまして。ずる真面目な生き方研究家として活動しています、工藤りさと申します。「愛すべきクソ真面目族」の研究をしていて、そういう方々が生きやすくなるようなプログラムを、講座やコミュニティを通して提供しています。もともとは公務員で、そこから起業して今に至ります。プライベートでは富山県に住んでいて、会社を経営しながら3人の娘を育てているお母ちゃんです。今日はよろしくお願いします。"], [296, "りせ", "「愛すべきクソ真面目族」、素敵な言葉ですね。具体的にどんな研究をされているのか、最初に聞いてもいいですか？"], [315, "工藤", "クソ真面目族っているじゃないですか。たぶんりせさんもその部類だと思うんですけど。彼女たち・彼らは、がんばるのがもう特技なんです。努力もできるし、我慢もできるし、責任感もすごく強い。でもその一方で、自分が幸せになることにはすごく厳しい人が多い。今回はお金がテーマですが、お金の話になると特にそれが顕著にあらわれると思っていて。たとえば、家族のためにはお金を使えるけど、自分のためとなると「本当にこれ必要？」と思ってしまったり。誰かに頼むくらいなら自分でやったほうがいいよね、とか。お金は本当は欲しいのに、お金のことばかり考えるのはよくないと思っていたり。"], [395, "工藤", "なので今日は、クソ真面目な人ほどハマりやすいお金の思い込みについて、りせさんの見解も伺いながらお話しできたらと楽しみにしていました。"], [412, "りせ", "投資をしていても、思い込みってものすごく敵なので、深掘りできたら嬉しいです。りささん自身、クソ真面目を発動してうまくいったこと、ありますか？"], [460, "工藤", "クソ真面目は常に発動しているんですけど（笑）、真面目でいいことは素晴らしい力だと思うんです。がんばれる力って。ただ、その力を自分を抑え込んで我慢する方向に使う人が結構多いなと思っていて。私も実際そうでした。国立大学を卒業して公務員になって、いわゆる「ちゃんとした人生」を歩いてきたんです。外から見れば、いい大学に行って、安定した就職先について。公務員は毎月決まったお給料もあるし、社会的な信用もある。もちろんすごくありがたいんですけど、その頃の私は、自分が本当にどう生きたいか、どんな人生を送りたいかよりも、「どの選択が正しいか」をすごく気にしていたんです。"], [536, "工藤", "お金に関しても本当にそうで、何が欲しいか、何を体験したいか、どんな暮らしがしたいかよりも、安定していることや将来困らないことのほうが大切、みたいな。自分ではすごく真面目にやってきたつもりで、失敗しないように、誰からも何も言われない道を選んできたのに、どこか満たされない。モヤモヤしていました。"], [600, "工藤", "お金の器って、自分がいくら持っていい、受け取っていい、使ってもいいと思えるかどうかが大事だと思うんです。真面目な人が陥りやすい落とし穴があって、そこに気づいてから、私も受け取れる器が広がったなと思っています。私が考えているのは3つあります。"], [640, "工藤", "1つ目は、「我慢することが美徳」になっていないか。「私が我慢すればいい」「私が頑張ればなんとかなる」が強調されていて、しかも自分の欲しいものややりたいことを抑え込めたときに「私、偉いじゃん」とちょっと思ってしまう。そのくせ、自分のために少し高いものを買おうとすると罪悪感が生まれる。我慢イコール美徳というところが、お金を受け取れるかどうかにすごくつながっていると思います。"], [703, "工藤", "2つ目は、「苦労しないとお金を受け取ってはいけない」。りせさん、そういうの感じたことあります？"], [729, "りせ", "昔はありました。会社員の時はすごく思っていました。印象的だったのが、新卒の会社で、関西出身の偉い方が「お金は板挟み代や」と言っていて、なるほどと思っていたんです。素直だったので、自分の中の設定に1つ入っていた気がします。今は全く思わないですけど（笑）。"], [799, "工藤", "そういう思い込みがあると、どれだけお金を受け取れるかにもつながってきますよね。"], [803, "りせ", "間違いないです。これくらい板挟みになったら、これくらいお金がもらえる、ということになりますからね。恐ろしい（笑）。"], [812, "工藤", "がんばって苦労して努力した結果としてお金をもらうのは、素晴らしいことだと思うんです。ただ、思ったより簡単にお金が入ってきたときや、好きなことをして収入を得ることに、なんとなく申し訳なさを感じてしまう。「こんなに簡単にもらっちゃっていいの？」と。これは投資にも関わる話だと思いますし、自分でビジネスをされている方にも結構あるあるです。"], [856, "工藤", "お客さんからしたら、提供してもらったものに価値があるかどうかが大事なわけです。提供した人がどれだけ苦労したかは、お客さんにとってはどうでもいい話。1時間で問題を解決してくれる専門家と、10時間かけて解決してくれる専門家がいたら、10時間苦労したほうに価値があるとは限らないですよね。"], [893, "りせ", "早く答えが出たほうが嬉しいですよね、普通に考えて。"], [897, "工藤", "でも、提供する側が「苦労しないとお金を得られない」というマインドでいると、10時間かけて解決する専門家になってしまったりしませんか？それが、お金を受け取ることを制限している要因の1つだと思います。"], [944, "りせ", "コメントでも「苦労せずにもらうお金への罪悪感、確かに」と来ています。「ありがとう」でいいんですけどね。"], [960, "工藤", "3つ目は、「自分のことを後回しにしがち」。特にお母さんたちにあるあるだと思います。子どもの教育や習い事にはお金を出せるけど、自分の学びや習い事には出せない、迷ってしまう。家族旅行にはお金を出せるけど、自分1人でホテルに泊まるのは「ぜいたくじゃない？ダメじゃない？」と考えてしまう。私も昔そっち側だったのですごく分かるんですけど、引いた視点で見ると、自分のためにお金を使うことって、別に悪いことをしているわけじゃないんですよね。"], [1017, "りせ", "謎の罪の意識ですよね。"], [1021, "工藤", "そのルールって誰が決めているんだろう、ということに縛られている方は多いと思います。そういう思い込みがあると、収入がいくら増えても自由にはなりにくい。いわゆる「幸せなお金持ち」にはなりにくいと思います。りせさんは、ただお金を持っているだけじゃない、幸せなお金持ちってやっぱりいると思いますか？"], [1074, "りせ", "そう思います。お金があって自分のやりたいことができている人と、お金があるのにできていない人はいるなと。自分の軸で生きられているかどうか、だと思います。以前、知人の不動産屋さんの付き添いで、ある裕福な方のお宅に伺ったことがあるんです。高価な骨董品やブランドバッグがたくさんあって、さらに倉庫にもぎっしり。でも物に囲まれて部屋はとても狭く、正直、幸せそうには見えませんでした。何のためにこれを買ったんだろう、と。お金はあったほうが幸せになれるけれど、使い道を間違えるとそうでもない、とすごく思いました。"], [1236, "工藤", "私もどちらかというとそっちの考え方だったと思います。極端な性格で、「幸せイコールお金」だと思っていたんです。お金さえあれば幸せになると。実際、起業して公務員時代のお給料を上回るような収入を得る機会も増えたんですけど、それで幸福度が上がったかというと、最初は上がらなかったんです。公務員の時は世間体や安定、誰にも何も言われない道にいれば大丈夫と思ってやってきて、起業してからは次は売上が指標になってしまって。お金を得られたら幸せになれるはずだったのに、なんか違う、と。"], [1314, "工藤", "そこから、目標を達成しても売上が伸びても、なぜ満たされないんだろうと考えて、マインドが関係しているんだと深掘りしていきました。お金の捉え方を間違えると、お金に支配される人生になってしまう。自分なりの軸や価値観を持ったうえで得ていくことが大切だと思います。クソ真面目族の怖いところは、目標を達成したら幸せになれると思ってしまうところ。達成した瞬間に次の目標が出てきて、もっともっと…と。そういうがんばり方を見直すことで、お金という人生を豊かにする道具を使って、本当に望む人生を実現していけるんだろうなと思います。"], [1416, "りせ", "分かります。お金の器を広げる話でいくと、「楽しく欲望を持つ」ことがすごく大事だと思っていて。次の目標を立てなきゃと思うと、どこかの物差しを借りてきてしまう。でも「もっとこれをやりたい」というものが本当に内側から湧いてくるものだったら、楽しくなる。そうすると、投資でお金を増やすのもポジティブにできて、いいスパイラルになると思います。"], [1474, "工藤", "お金を増やすために人生があるんじゃなくて、自分が望む人生を生きるためにお金がある、という矢印ですよね。お金でできることは確実に増えます。住む場所を選べたり、行きたいところに行けたり、子どもにたくさんの経験をさせてあげられたり。でも、お金がたくさんあれば必ず幸せかというと、たぶんそうではない。だからこそ、その順番が大事だなと話しながら思いました。"], [1546, "工藤", "私から聞いてみたいんですけど、りせさんはお金のことを教える立場で、お金との付き合い方が上手だからそこまで行くんだと思っていて。りせさんにも、お金の器が小さかった時ってあるんですか？"], [1580, "りせ", "全然ありますよ。私、本当に普通の人なので、羨ましいとか、何かを見て悔しいと思うとか、全然あるんです。でもその時に、自分の軸を守り続けると豊かでいられるし、振り回されるとうまくいかなくなる、というのがすごく分かりやすく出るので、そこを大切にしています。悔しがれるくらいのほうがいいとは思っているんですけど、それで変なことをし始めるとうまくいかなくなる。投資でも、「私はまず自分の資産をここまでにしよう」というところにちゃんと戻れるとうまくいって、変に欲をかくと失敗する。人間としての小さいところと上手に付き合っていくと拡大する、と昔から気づけていたので、ちゃんと手元に残せるようになっているのかなと思います。"], [1709, "りせ", "お金の使い方でいうと、失敗とは思っていないんですけど、私より上手に手元に残す人はいるなと思います。私はすぐ使うタイプで、使うことでご縁を得られるからそれでいいと思っているんですけど、お金の力を借りずにもっと上手にできる人もいるだろうな、と。"], [1775, "工藤", "今日聞いてくださっている方は、お金の悩みや不安が大きい方も多いと思います。りせさんもそういう時代はありました？"], [1793, "りせ", "昔はありました。会社員の時、生活しているだけなのに貯金が減っていくなと思っていました。最初の会社の時は実家暮らしだったので困らなかったんですけど、転職して1人暮らしを始めたら、やりたいことを普通にやっていると貯金が減っていく。このままやりたいことを続けるとヤバいと思って、ちゃんとがんばらなきゃと思いました。"], [1863, "工藤", "クソ真面目族からすると、投資って怪しい、怖い、というところがあると思うんですけど、そこはなかったんですか？"], [1878, "りせ", "出会い方だと思います。きっかけは、転職先の中途同期の仲間たちでした。すごくいい人たちだと思っていた男性の同期たちが、「給料が下がって家族を養えなくてヤバいから、投資しなきゃ」と話していて。それを普通に聞いて、私もやったほうがいいのかなと思ったのがきっかけです。出会い方がよかったから踏み出せました。"], [1923, "工藤", "知っているか知らないかも大きな差だと思っていて。お金の知識がちゃんとあるかどうかが、お金を増やす選択肢を1つ持てるかどうかにつながると思うんです。"], [1944, "りせ", "確かに、器は知識で広がるところがありますね。起業1つとっても、手元に残るお金や効率のいいやり方があるように、知っているかどうかだけで入ってくるものは変わると思います。"], [1980, "工藤", "怖いのは、知らないから怖いんだろうなと。それで自分の未来の選択肢、お金を増やせる可能性を狭めている人も多いと思うので、もったいないなと思います。器を広げる話でいうと、受け取る許可を出せるかどうか、そこに慣れていくことが大事。これはお金だけの話じゃないと思っていて。"], [2056, "工藤", "たとえば「手伝おうか？」と言ってくれた時、クソ真面目族は頼るのが申し訳ないと思ったり、「ここまでは頑張れるし」と思って「大丈夫です、自分でやります」と言いませんか？全然大丈夫じゃないし、めちゃくちゃ忙しいし、キャパオーバー寸前なのに。ほめられた時も「すごいですね」と言われたら普通に受け取ればいいのに、「いやいや、全然です、私なんて」と。素直に「ありがとう」と受け取れるかどうかは、お金を受け取れるかどうかと全部つながっていると思います。"], [2118, "りせ", "間違いないですね。助けてもらうことも、場合によってはお金をかけてやることですよね。それを関係性で「やるよ」と言ってくださる方に「いやいや」と言うのは、受け取らずに遠ざけているのと同じ。お金に代わるものを失っている感じですよね。"], [2160, "工藤", "もう1つ、お金を使って誰かに頼ってみるという経験も大事だと思います。子育てして、仕事して、家事して、もう大変じゃないですか。でもがんばれてしまうクソ真面目族は、それを全部自分で、しかも1から10まできっちりやろうとする。手を抜いたらダメ、と。でも1人の人間が抱えられる量には限りがあるし、それをやっていると自分のやりたいことができない。お金を使って誰かに頼る経験を自分にさせてあげることが、お金の器を広げる一歩になると思います。お金を使う時に「このサービスに払ったら、私の人生はどう変わるんだろう」という視点が大事だなと。"], [2264, "工藤", "1〜2時間の家事代行をお願いしてみる、週に1回お願いしてみる、子どもを預けてみる。それで自分に少し余裕ができたり、機嫌よく過ごせる時間が増えたりしたら、それは豊かさにつながるわけです。お金を使って、そういう経験を買ってみることが大事だと思います。"], [2280, "りせ", "私もお話を聞いて思い出しました。器が広がったなと思うのは、周りに何かを頼み始めた時かもしれません。お金で発注というより、残業を自分で抱えていたのを後輩に頼むことが自然にできるようになって、それが結果的にいい循環になっていました。"], [2313, "工藤", "自分が頑張ればできることを人に頼んだらダメ、と思いがちですけど、頼んで他のことを頑張ればいいんですよね。がんばれる力を、自分が本当に発揮できる部分に使う。それが自分の成長にもつながるし、その時間でお金を増やすこともできると思います。"], [2364, "りせ", "それがあったから投資の勉強ができたんだな、と今思い返すと分かります。勉強したいと思った時、仕事が忙しくてやる暇がなかったので、「これは私がやらなくてもいいんじゃないか」というものを見つけて頼むことを始めました。"], [2379, "工藤", "もちろん相手に無理のない範囲で、ですけどね。意外と「人のため」と言いながら、いい人に見られたい、嫌われたくない、で自分を追い込んでいることもあると思うんです。そこに気づいて、「私が目指したい未来はこういう状態じゃないよね。もう少し心に余裕ができて、その間にお金の勉強をして増やす手段があったら、違う人生があるかもしれない」と選択できるかどうかが大事だと思います。"], [2476, "工藤", "りせさんに聞いてみたいんですけど、投資に興味はあるけれど、怖くてなかなか動けない方は多いと思うんです。クソ真面目族は失敗したくないし、「絶対損しない方法を知ってから始めたい」となりがち。でも投資の世界にそんなことはありえないと思っていて。そういう人は、まず何から考えたらいいですか？"], [2510, "りせ", "一番簡単なのは、りささんがさっき言ってくださった通り「知ること」だと思います。人は得体の知れないものに一番恐怖を抱くので、知ると「勘違いだった」と分かることが多い。最近、不動産の講座を立ち上げたんですけど、これから始めたい方の話を聞くと、知識がないゆえに怖いと思っているんだなと感じます。株も本当にそう。知らないで怖いと思っているのは、想像でふくらんで「謎の怪物A」を作っているような状態なんです。"], [2585, "りせ", "知ると「こういう感じなんだ」と分かる。次のステップは、知りながら石橋を叩いて歩いてみること。実験ですね。叩く時間を短くしたり、誰かと一緒にやってみたりして、実際にやってみると「思っていたより大丈夫だな」と分かると思います。知ったうえで怖いのか、そうじゃないのかは大きく違います。"], [2660, "工藤", "知らないから怖い、やったことないから怖い。じゃあ知ったらいいし、ちょっとやってみたらいい、ということですね。"], [2667, "りせ", "そうです。それで「違うな」と思ったら無理しなくていいし、たぶん「こんなもんか」と思うことのほうが多いと思います。今は本当にいい時代で、1株投資でとても少額から実験できるようになりました。昔は最初でも10万、20万円は要るという感じでしたが、今はやろうと思えば数百円でもできるし、それで物足りなければ3万、5万円からでも全然できます。"], [2717, "工藤", "ハナミラでも、正解を誰かに決めてもらって「これに投資したらいいよ」という教え方ではなく、自分で判断できるように教えていらっしゃると思うんです。それが本当の意味での自由なんじゃないかなと。"], [2742, "りせ", "まさにそうだと思っていて。私は投資をしてから自由になったと思うんですけど、それは判断する力が自分にあると知ったからだと、すごく思います。どんな状態になっても自分の力で生み出せる。それに、誰かが言っている銘柄をそのまま買うと、全然儲からないんですよ。誰かが言っていて、自分でもちゃんとそう思ったならいいんですけど、それなしに買うと、まず失敗します。結局最後は自分を信じてあげなきゃいけないのが投資。信じられるようになるスキルは身につけることができるし、そこで軸を持てると豊かになっていきます。"], [2840, "工藤", "ハナミラはママも多いんですか？"], [2844, "りせ", "多いです。私も最近出産したことを伝えているので、思った以上にママがいっぱいいたと分かりました。子どもの話をするのが前より普通になったので、「お子さんいらっしゃったんですね」ということが結構あります。"], [2868, "工藤", "私は、お母さんのお金の考え方が子どもに影響すると思っていて。昔の自分と今の自分では、子どもへのお金の声かけが全然違うと思うんです。子どもは親が何を言っているか、どう行動しているかをよく見て学んでいます。昔の私だったら「お金もったいないよ」「そんなぜいたくはダメ」「我慢しなさい」と、お金を使うことへの抵抗感を生むような発言をしていたと思います。もちろん何でも買ってあげればいいという話ではないけれど、節約することが大事なんじゃなくて、自分にとって大切なものを選ぶ力、そのためにお金を使うんだよ、と言えるようになったのは、子どものお金の価値観の土台になると思っています。"], [2965, "工藤", "親も悪いわけではなくて、知らなかったり、自分を守るためにそういう価値観があったんだろうなと思うので、悪いことではないんです。でも、私が子どもに渡したいのは、お金は下品だとか、持っていたらダメだとかいう考え方ではない。母親自身が、自分の人生を豊かにするために気持ちよくお金を使っている姿を見せることが、最高のお金の教育になるんじゃないかなと。お母さんだから我慢しなきゃ、という方は多いと思うけど、お母さんだってやりたいことをやっていいし、そのためにお金の知識を身につけて、増やす手段を持っていてもいいと思います。"], [3068, "りせ", "素敵なメッセージをありがとうございます。りささんの言語化がすごすぎて、「これってこう表現するんだ」と思うところがたくさんありました。皆さん、ぜひりささんをフォローしてください。クソ真面目族の皆さんが集まるオープンチャットも主催されているので、プロフィールのリンクからぜひ。"], [3153, "りせ", "私のほうは、12月1日から「世界一分かりやすいAI時代の株のはじめ方3daysプログラム」を無料で開催します。株の考え方、AI時代に銘柄をどう見つけていくか、買うタイミングや買い方まで、3日間でしっかりお話しします。画面下の赤いリンクから参加できます。"], [3206, "工藤", "クソ真面目族の皆さんにはぜひ参加していただきたいです。学ぶ力も行動する力も圧倒的に高いじゃないですか。その力を自分を苦しめるほうに使うんじゃなくて、もっと幸せになるほうに使ってほしい。お金を増やすという選択肢を1つ持っておかれるといいと思います。"], [3290, "りせ", "最後に、がんばり屋の女性たちが幸せになるための応援メッセージを一言お願いします。"], [3304, "工藤", "私たちクソ真面目族は、がんばることはもう十分やってきたと思うんです。みんな相当がんばっていると思います。なのでこれからは、そのがんばれる力を、もっと自分が幸せになる方向に使っていただけたらと思いますし、ずるいほど幸せになってください。今日はありがとうございました。"], [3341, "りせ", "皆さん、改めてありがとうございました。私も楽しすぎて、あと1時間いけると思っていました。何かに頼ったり、思い込みを外したり、自分にお金を使ってみる、実験してみる、できることはたくさんあると思います。ぜひ小さな一歩を今日から始めてください。働かずにお金を得ることを、私も昔はやっちゃいけないと思っていたんですが、やってみるとすごくよかったし、「お金ってこういうふうに増えるんだ」と思えるようになりました。皆さんにもそういう経験をしてもらえたら嬉しいです。"], [3423, "りせ", "3daysプログラムでは、本番までの間もお金の考え方をアップデートしたり、私から投資の知識をお話ししたり、お金を働かせている方々とのコラボライブをしたりしていきます。オープンチャットに入ると、他の人がどう受け取ったかも分かります。見るだけでも大丈夫なので、ぜひ入ってみてください。次回は11月8日21時30分から私の単独ライブで、3daysに入れられない投資の知識編をお話しします。3daysプログラムは12月1日・3日・5日、21時からです。今日も本当にありがとうございました。またね。"]]}, {"id": "1108", "vid": "6hOGPoZekZo", "date": "11/8（日）", "type": "単独ライブ", "guest": "", "title": "AI時代に資産を増やすのをじゃまする「株式投資の5つの誤解」", "duration": "約55分", "message": "投資を難しくしているのは、知識不足よりも「思い込み」。ハードルを下げて、「いつまでに・いくら・何のために」を決めてから始めよう。", "slides": [{"t": 262, "h": "今日のテーマ", "p": "投資を始められない・うまくいかない原因は、自分の中の「誤解・思い込み」にあることが多い。あなたにも当てはまるものはありませんか？", "li": ["四季報や日経新聞を読まないと株はできない", "株はギャンブルっぽくて怖い", "毎日チャートに張り付いていないといけない", "まとまったお金がないと始められない", "投資は余ったお金でやるもの"]}, {"t": 525, "h": "誤解1　四季報・日経新聞を読まないとできない", "p": "結論、読まなくても利益は出せます。りせさん自身も、新聞や四季報に頼らずに資産を増やしてきました。", "li": ["新しい習慣（投資）に、読む習慣まで重ねると挫折しやすい", "まじめな人ほど100点を目指して止まってしまう", "ヒントは身の回り。「最近みんな使ってる」「このお店いつも混んでる」から会社を見つける"], "key": "情報収集の手段のひとつであって、マストではない"}, {"t": 874, "h": "誤解2　株はギャンブルで怖い", "p": "株とは、建物・商品・働く人など、実体のある企業の一部を持つこと。なんとなく買えばギャンブルになりますが、根拠を持って買うならギャンブルではありません。", "li": ["「誰かが上がるって言ってた」「SNSに書いてあった」で買わない", "「この会社はこういう理由で伸びる。だから買う」と考える", "いい会社にお金が回ることは、社会の応援＝推し活にもなる"], "key": "ちゃんと考えてやる投資は、ギャンブルではない"}, {"t": 1264, "h": "誤解3　チャートに張り付かないといけない", "p": "納得して選んだ株なら、1日10〜15分スマホを見れば十分。会社員時代も、子育て中の今も、張り付かずに資産を増やしています。", "li": ["画面に張り付く短期売買のほうが、実はうまくいかない人が多い", "スマホを見つめても株価は変わらない", "いい投資をしているほど、ヒマになる"], "key": "お金に働いてもらって、自分の時間は自由に"}, {"t": 1692, "h": "誤解4　まとまったお金がないと始められない", "p": "今は1株から買える株がとても増えていて、数百円〜数千円からでも始められます。むしろ「貯めてから」は、練習できない期間＝ロスタイムに。", "li": ["人は、いきなり大きなお金はうまく扱えない（なけなしの全額投入は判断を誤りやすい）", "自分が緊張しない金額から始めて、少しずつレベルアップ", "これが「お金の器」。貯めることと器を広げることは並行で"], "key": "今手元にあるお金で、今日から練習を始めよう"}, {"t": 2643, "h": "誤解5　投資は余ったお金で「なんとなく」", "p": "転職の面接で「年収はできるだけ多いと嬉しいです」と言わないのと同じ。目標がないと、どの銘柄を選べばいいかも決められません。", "li": ["30代でこんな暮らしをしたい", "子どもが生まれても仕事を選べる状態にしたい", "親の介護でお金に困らないようにしたい", "子育てが終わったら推し活を楽しみたい"], "key": "「いつまでに・いくら・何のために」から逆算する"}, {"t": 3058, "h": "まとめ", "p": "思い込みが外れてハードルが下がったら、あとは正しい知識を身につけて実践するだけ。", "li": ["四季報・新聞は読まなくていい", "根拠を持って買えば、株はギャンブルじゃない", "チャートに張り付かなくていい", "少額から始めて「お金の器」を広げる", "欲しい未来を決めて、逆算する"]}], "transcript": [[0, "", "皆さん、こんばんは。「株のはじめ方3daysプログラム」開催記念の連続ライブ、今日は私の単独ライブでお話しさせていただきます。ぜひたくさんコメントしながら聞いていただけたら嬉しいです。日曜日の夜にお時間いただきありがとうございます。"], [49, "", "今日は単独なので、3daysプログラムの開催前に知っておいてほしい投資の知識として、「AI時代に資産を増やすのをじゃまする5つの誤解」というテーマでお話ししていきます。「お金を増やしたい」と思うことは、はじめの一歩としてとても大切です。"], [82, "", "今、「AI時代の世界一分かりやすい株のはじめ方3daysプログラム」を12月1日から開催します。それを記念して、皆さんに投資の知識やマインド、考え方を身につけてもらう連続ライブを行っていて、今回が3回目です。初めての方も、2回目・3回目の方も、どこから見ても楽しめるようにお話ししますね。今回はいつもより知識寄りの話も交えていきます。"], [166, "", "改めまして、日本最大級の女性向け株式投資スクールを主催しております、松下りせと申します。このプログラムの主催者でもあります。"], [195, "", "このプログラムはオープンチャットと並行して行っています。前回・前々回のライブから「アウトプットの価値に気づきました」「読んでいるだけで考え方が変わって嬉しい」というコメントをたくさんいただいていて、とても嬉しいです。オープンチャットは、他の人の考え方を知ったり、自分の考え方をアップデートしたり、「私はこれがしたいから投資をするんだな」と見つめ直したり、新しい投資の知識を得たりする場所です。ぜひそんなふうに活用してください。今回も最後にお題を出しますので、オープンチャットで答えて特典を受け取ってくださいね。"], [262, "", "今日のテーマは「AI時代に資産を増やすのをじゃまする5つの誤解」。ドキッとするタイトルかもしれませんが、投資を始められない、変な方向に行ってしまう原因は、自分自身の誤解や思い込みにあることが結構多いんです。今日は、これから投資をスタートして成果を出していく最初の一歩として聞いてください。"], [308, "", "では聞いてみたいと思います。「私そう思っているかも」というものがあれば、番号でコメントしてください。1つ目、四季報や日経新聞を読まないと株はできないと思っている。2つ目、株ってギャンブルっぽくて怖い。3つ目、毎日チャートを見たり、張り付いていないといけないと思っている。4つ目、まとまったお金がないと始められない。5つ目、投資は余ったお金でやるものだと思っている。"], [391, "", "（コメントを読みながら）「全部です」という方も多いですね。1番、3番も多いです。5番は、正しい部分もあるけれど、考え方を少し変えるといいポイントです。どれも、投資をスタートする前の思い込みです。"], [457, "", "なぜこの5つが問題かというと、全部、自分でハードルを高くしてしまっているんです。投資が難しいというより、「難しいはずだ」と思い込んでしまっている。私も親から「投資はギャンブルだから、堅実にお金を積み立てなさい」とよく言われていました。そう思っていたぶん、投資のスタートが遅れてしまったなと思っています。時代が時代だから仕方ないところもあるんですけどね。今日は「実は違うんだよ」というところを、知識としてお伝えしていきます。"], [525, "", "まず1つ目。株をやるなら四季報を読み込んで、日経新聞を毎日読まないといけないと思っている方も多かったと思います。私も最初はそう思っていて、投資にもっと詳しくなりたくて四季報を全部読んだこともあります。ただ結論から言うと、読まなくても利益を出すことはできます。"], [556, "", "皆さん、これから投資を始めたいと思っていますよね。投資は新しいことです。新聞を読む習慣がない人が、投資という習慣をつけるのに加えて、さらに日経新聞を読む、四季報を読む、というのは正直かなり無理ゲーなんです。習慣になっていない人は、証券アプリをポチッと押す1秒のことさえ、生活に入っていなかったりします。そのハードルを越えようとしているのに、「今日は新聞が読めなかった」「四季報3ページ目で挫折した」となっていたら、一生クリアできなさそうじゃないですか？実際、投資そのものより、周辺情報を頑張って読もうとして挫折している人はたくさんいます。"], [635, "", "私は自分の資産を増やすにあたって、四季報や日経新聞をほとんど使わずに増やしてきました。どうしていたかというと、身の回りの商品やサービスに注目して、自分の分かる範囲からスタートしました。「最近みんなこれ使ってるな」「このお店いつも賑わってるな」がきっかけで、「この会社伸びそうだな」とピックアップして投資する。これで2倍、3倍、5倍になる銘柄は、特別な知識がなくても実際に見つけることができます。"], [695, "", "もちろん、すでに新聞を読む習慣がある方は、ぜひ活用してください。上手に使えれば情報の宝庫です。ただ、投資も初めて、新聞も初めて、四季報も初めて、と全部いっぺんにやると、どれか1つ欠けただけで挫折してしまう人が本当に多い。まじめな人ほど100点を目指すのでそうなりがちです。私は今でも新聞を読まずに資産を増やせています。読みたかったら読んでもいいけれど、「ないと資産を増やせない」というのは大間違いなので、安心してください。"], [747, "", "四季報は、上場している会社の情報がコンパクトにまとまった分厚い本で、3か月に1回発行されます。今でこそ私も読めますが、投資を始める前や始めたばかりの頃に手を伸ばしたときは、古文書を読んでいるみたいでした。目的もなく読む必要は全くありません。四季報や日経新聞は、たくさんある情報収集の手段の1つ。得意な人はやってもいいけれど、マストではない、と覚えておいてください。"], [826, "", "私も今年、日頃使っているアプリなど身の回りのところから銘柄を見つけて投資し、ちゃんと増やすことができました。皆さんもぜひ身の回りから始めてみてください。この始め方は、12月1日からの3daysプログラムの中でしっかりお伝えしますので、楽しみにしていてください。"], [874, "", "2つ目。「株ってギャンブルなんでしょ？怖い」と思われている方もいると思います。親に「株は危ないから手を出すな」と言われたことがある方、いらっしゃいますか？私はめちゃめちゃありました。"], [907, "", "（コメントを受けて）「四季報が読めないといけないよ」と言われた方もいるんですね。それは最初からハードモードを敷く人ですね（笑）。四季報は、投資を普通に続けていれば基礎知識が入ってくるので、いずれ読めるようになります。でも、四季報を読むところから始めなきゃいけないというのは大間違いで、読めなくても投資は全然できます。"], [954, "", "「ギャンブルだと言われたことがある」という方も多いですね。親世代は、日本のバブル崩壊や長く続いたデフレを見てきているので、そういう方が多いと思います。むしろ、親がやっていた・止められなかったという方はとてもラッキーです。少なくとも「危ないものだ」という思い込みなく、ここまで来られているので。私は推奨されない家庭だったので、自分でそのハードルを越えていきました。"], [1002, "", "株とは何かというと、企業の一部を持つことです。得体の知れないものを買っているわけではありません。企業には、ビルや商品、働いている人など、実体があります。その一部を自分が持つということなんです。ギャンブルは、お金をかけた瞬間に何も生まないものです。投資も、適切な知識を持たずに「なんとなく」やるなら、確かにギャンブルと呼べるものになるかもしれません。"], [1062, "", "でも投資そのものは、実体のあるものを保有して、そこで働く人たちが頑張ってくれたら、その成長の恩恵を受け取れる、本当はとてもいいものを買っているんです。やり方を間違えると資産が増えなくなってしまいますが、自分がちゃんとその企業のことを知って「ここに投資したい」と思ってやっているなら、全くギャンブルにはなりません。むしろ投資を通じて企業とつながり、社会の循環の一部に入れることだと思っています。"], [1134, "", "（コメントを受けて）「絶対倒産しないもの以外はギャンブル」と言われたんですね。表面だけ見ている方にはそう映るかもしれません。でも実体のある企業から、いいもの、伸びていくものを選んでいけば、自分のお金を増やしてくれるものになります。「誰かが上がりそうって言っていた」「SNSに書いてあった」ではなく、「この会社はこういう理由で伸びる、だから買う」と根拠を持って、将来こうなるはずだと思って買う投資は、ギャンブルになりません。"], [1199, "", "ついでに言うと、私は投資を社会の循環の1つ、社会貢献の1つだと思っています。日本のいい会社に間接的にでもお金が回ると、その会社がまた一段大きく飛躍するきっかけになれる。だから私は、投資は「応援」であり「推し活」だと呼んでいます。考え方を持った投資は、社会にとってもすごくポジティブなもの。今回のライブと3daysプログラムで、ぜひそんなマインドチェンジをしてもらえたら嬉しいです。企業の一部を持っている感覚、その会社を知ることを忘れなければ大丈夫です。"], [1264, "", "3つ目は、チャートに張り付かなくていいよ、というお話です。株をやるなら仕事中もチャートをチラチラ見て値動きを追わないといけない、パソコンがずらっと並んだコックピットのような部屋で投資しないといけない、と思われている方も実は多いです。メディアの影響もあると思います。絵的に映えるので、そういう人たちがよく取り上げられるんですよね。"], [1312, "", "実際、投資にはいろんな関わり方があって、画面に張り付く方法もあります。でも私は、育児を始めてからさらにスマホを見られる時間が減りましたし、会社員時代は就業時間中に株価をチェックするなんて全然できませんでした。それでも資産を増やすことができました。今でも大事にしているのは、「この会社いいな」と思って決めた投資なら、1日10分〜15分スマホを触る時間があれば十分、ということです。"], [1378, "", "私が大きく資産を増やしているときは、基本的に「これはいい株だ」と安心して持っている状態なので、正直スマホを触らなくても放置できるんです。資産を2倍、3倍にするのに、張り付く方法も世の中にはあるけれど、そうしなくても1日10分自分のために時間を取れば、投資は続けられます。"], [1424, "", "意外と言われるんですが、画面にずっと張り付く投資のほうが、実は難しいんです。デイトレードを続けて、プラスで終われる人は実はそんなに多くない、という調査も出ています。逆に、毎日慌ただしくチャートを見なくていい投資をしている人のほうが、リターンがよかったりします。だから「忙しいからできない」は全然そんなことなくて、すき間時間で、1日10分〜15分でいいんだと覚えておいてください。"], [1478, "", "（質問「情報収集はどうしていますか？」を受けて）身の回りの情報や、身の回りのサービスをきっかけに投資をスタートすることが多いです。詳しくは資料を使いながら体系的にお話ししたいので、12月1日からの3daysプログラムでお伝えしますね。ニュースを読み込むというより、身の回りからが多いです。最近は情報を集めるのはAIも得意になったので、AIにお世話になることも結構あります。使えるようになると、本当に時間が少なくて済みますよ。"], [1543, "", "なぜ見張らなくていいかというと、ちゃんと根拠を持って買っていたら、自分がスマホを見て念じたところで株価は変わらないからです。いい投資をしていると、見ているだけムダだなと気づき始めます。いい投資をしていればしているほどヒマになる。お金に働いてもらって、自分の体や時間が自由になる。今日はぜひその誤解を解いてください。"], [1591, "", "実際、ずっと張り付いていないといけなかったら、私は今年投資をやめていたと思います。子どもが生まれて、我が家の方針で、できるだけ子どもの前でスマホを見ないようにしているんです。在宅で働いていても、パソコンやスマホを見ている時間はありますよね。そのとき子どもは自分のほうを向いてほしいと思っているので、両立はなかなか難しい。でも、画面に張り付くやり方でなければ、投資した会社が伸びて、お金のほうが勝手に働いてくれる。お金を生む「投資」から、手と目を完全に離せるのは本当にありがたいです。これが証明になるかなと思います。"], [1692, "", "4つ目。投資はまとまったお金がないと始められないと思っている方もいると思います。皆さん、いくらなら始められそうだと思いますか？1万円、10万円、100万円、ぜひ答えてみてください。"], [1743, "", "（コメントを受けて）「100万円から」「100円からやっている」「5000円くらいから」「SNSで300万円と言われて諦めかけている」「10万円くらい」…ありがとうございます。結論から言うと、今書いてくださったどの金額からでもスタートできますし、今手元にあるお金でスタートすべきだと思います。"], [1809, "", "もし今100万円、300万円がすでにあって投資に回せるなら、それはそれでいいと思います。でも、わざわざそこまで貯めなくて大丈夫です。「もっと貯めてから」と考えているなら、それが危ないパターン。理由はこの後お話しします。私も投資をリスタートしようと考えたときは、10万円くらいから始めました。"], [1858, "", "今のご時世、100円、1000円、5000円でも株式投資は始められます。「1株投資」と言って、1株から株を買える仕組みが最近すごく増えていて、とても少額から始められるようになりました。だから、まとまったお金を作ってからじゃないと始められない、というのは全然そんなことありません。5万円、10万円あれば十分始められますし、数百円、数千円でも、やらないより全然いいのでスタートしたほうがいいと思います。"], [1922, "", "私が始めた頃は、1株で買える株は本当に少なくて、株は10万円くらいからと言われていました。今は1株から買える株がとても増えて、投資の選択肢がすごく広がっています。大金を持っていなきゃできない、というのは大きな間違いです。"], [1971, "", "ただ、100円を200円にするのと、100万円を200万円にするのは、実はやっていることは同じです。株を選んで、そこにお金を入れる。だから大きなお金を扱えるようになったほうが有利ではあります。でも私の経験から言うと、人はいきなり大きなお金を扱うことはできません。なけなしの100万円を全部投資して、「これがなくなったらもうヤバい」と思いながら投資をしていると、たいてい変な判断をして失敗します。自分が緊張しない金額、5万円や1万円、10万円くらいからスタートして、投資のレベルを上げていったほうが、結果的にうまくいきます。"], [2025, "", "たとえば1億円持っている人が、いきなり1億円を投資できるかというと、全然そんなことはありません。全部やったら、たぶんお金を吹き飛ばして終わってしまう。扱える金額は人によって違うんです。私はこれを「お金の器」と呼んでいて、自分がどれくらいのお金を扱うことに慣れているか、ということです。自分にとってやりやすい資金サイズを見極めて、そこからレベルアップしていくのがすごく大切です。"], [2086, "", "このレベルアップと、お金を貯めることは、並行してやったほうがお得です。貯まった後にいきなり100万円、200万円を投資できるわけではないので、貯めている期間は、結局投資の練習ができない期間。すごくロスタイムなんです。少額でも考え方を持ってできるようになると、「次のボーナスを入れよう」「貯まったら追加しよう」と、動かせるお金がどんどん大きくなっていきます。やっていることは同じなので、少ないお金で体で覚えてから、大きなお金を動かせるようになるといいと思います。"], [2168, "", "（コメント「宝くじに当たった人が破産するって聞く」を受けて）そうなんです。扱えるお金には限度があるので、それを見極めながらやっていくことが大事です。経験者の方も未経験の方も、ぜひ覚えておいてください。"], [2232, "", "（コメント「調べると100万円くらいから始めないと意味がないと出てくる」を受けて）考え方にいろいろ差がありますね。結構アグレッシブな男性投資家の方などは、そう言う方もいると思います。ただ私の経験では、仮に100万円あったとしても、全部を上手に投資できるわけではないんです。"], [2281, "", "私も投資を始めた頃、「このお金を全部入れて倍にできたらすごい利益が出る」と、自分の貯金のほぼ全額を何も考えずに投資に入れたことがありました。しかも、他の人が「いい」と言っていた株を、なんとなく買ってしまった。悪い例ですね。そうしたら株価が上がったり下がったり激しく動いて、下がるときはもちろん、自分でもびっくりしたのが、上がったときも怖かったんです。メンタル的にコントロールできない状態になっていました。結果的に大きな損失は出さずに売れたのですが、ヒヤヒヤ度で言ったら過去一でした。"], [2381, "", "お金の扱いに慣れている人なら、当時の私の貯金くらいの金額を入れても冷静でいられたと思います。でも当時の私のお金の扱いレベルでは、うまくいかなかった。だから、自分にとって「この金額なら扱いやすい」と思える金額でやれるといいと思います。それが数百円の人もいれば、5万円、10万円、50万円、100万円の人もいる。ご自身に合わせてやっていくのが一番大事です。逆に、金額を指定している人の話は、あまり信じなくていいと思います。人によって絶対違うので。"], [2440, "", "同じ2倍でも、100円が200円になるのと、100万円が200万円になるのでは、プラス100円かプラス100万円かで違います。大きいお金を扱えたほうが得ではあります。でも最初からそれをやってうまくいくかというと全然そんなことはないので、少しずつレベルアップして、大きいお金を使えるようになっていくのが一番おすすめです。"], [2477, "", "私は、皆さんよりもきっとお金がないであろう学生さんにも投資を教えたことがあります。今は本当にお金がないけれど、貯めてからやるより、今スタートして練習していくことにすごく価値がある。学生さんたちも喜んでいました。少ないときからやって、どんどん資産を増やせるようにしていくことが大事です。"], [2509, "", "（質問「四季報は見ていますか？」を受けて）今でこそチラ見することもありますが、全然見ないで買うときもあります。いきなり読めと言われたら嫌ですよね（笑）。投資に慣れてくると、どこに何が書いてあるか分かるようになるので、難しくなくなります。でも私が四季報から銘柄を探しているかというと、全然そんなことはなくて、四季報を使わずに探しています。慣れてくると「ここさえ見ればいい」というところがあるので、一応確認する程度です。読んだからこそ見つかる銘柄もありますが、正直読まなくても全然できます。銘柄探しは目の前のサービスをヒントにすることが多くて、詳しくは12月1日からの3daysプログラムで体系的にお話ししますね。"], [2643, "", "では最後、5つ目。誤解というより「順番の勘違い」なんですが、投資は余ったお金で、なんとなく増えたらいいなと思ってやるもの、と思っている方も結構いらっしゃると思います。これが一番もったいなくて、なんとなく始めた人は途中でやめていくし、自分が欲しい利益を得ることができないんです。"], [2692, "", "よく例に出すのが転職活動です。私も転職経験がありますが、面接で理想の年収を聞かれたときに「できるだけ多いと嬉しいです」と言う人が来たら、面接官ならどう思いますか？たぶん落としますよね。「ちゃんと考えようよ」「自分の要望をちゃんと持とうよ」となると思います。転職するときは「今くらいの年収は欲しい」「これくらいプラスになったらいいな」と考えて動きますよね。投資も実はそれがすごく大切で、いつまでにどれくらい増やしたいのかをしっかり考えてやることが大事なんです。なんとなくのお金でなんとなく投資をしていると、増えることはあっても、自分にとっての理想の結果は得られません。"], [2756, "", "一番大切なのは、自分が何をしたいのかから入ること。「30代でこういう暮らしがしたい」「子どもが生まれても仕事を選べる状態にしたい」「親の介護のときにお金で困らずにサポートしたい」「子どもや孫の欲しいものを買ってあげたい」「子育てが終わったし推し活を楽しみたい」、いろいろあると思います。それを叶えるために、手元のお金をスタートに、いつまでにどうなっていたらいいのか、やりたいことの期限を決めてやっていくものなんです。「1年後にはこれくらい増やせるようになりたい」「3年後にこういう生活をしたいから、これくらいにしておきたい」と決めていく必要があります。"], [2836, "", "なぜかというと、目標がないと、やる投資を決められないからです。銘柄を選んでいると、「2年くらい経てば2〜3倍になるんじゃないか」という銘柄もあれば、「1年でいけるんじゃないか」というものもある。好きな会社でも「年間で30%くらいなら上がるんじゃないか」と考えることもある。投資をしていると、この銘柄はどれくらいになりそうかを考える必要が出てきます。スクールでもそれを考えられるようになることを大切にお伝えしています。いろんな銘柄がある中でどれを選ぶかは、自分にとって欲しい金額を決めて、「2〜3年後にこれくらい増えていたら嬉しいから、この会社にしよう」と選んでいくんです。"], [2900, "", "仕事や副業で年収を決めるときはみんなこういう決め方をしているのに、投資になるとしなくなってしまうんです。ぜひ、ただお金が欲しいではなく、自分のやりたいことから逆算して、このお金をこう投資していこうと決めながらやってください。どの銘柄を選べばいいかという考え方は、3daysプログラムでもお話ししていきます。"], [2953, "", "ここまで5つの誤解をお話ししてきましたが、いかがでしたか？「納得できました」というご回答、嬉しいです。いつまでにいくら欲しいかを考えていくと、やりたいことや欲しいものがたくさん出てくると思います。ぜひオープンチャットでアウトプットしてみてください。それがあると、「これくらいのお金が欲しいから、こういう銘柄に投資しよう」と決めていけます。"], [3010, "", "こういった思い込みがなくなっていくと、「株って私にもできるかも」「こういう勘違いをしていたんだな」と受け取ってもらえたら嬉しいです。ぜひ思い込みから脱却して、投資を楽しく実践していってください。12月1日にはこういう話はできないと思ったので、前もってライブでお話ししました。"], [3058, "", "まとめると、四季報は読まなくていい。株はギャンブルではなく、実体のある企業なので、根拠を持ってやる投資なら大丈夫だし、投資は推し活。チャートに張り付かなくていいから、自分の時間を自由にしながらできる。10万円、それ以下からでも始められるので、手元に大きなお金は必要ない。そして、欲しい未来を決めて逆算するのがすごく大事。なんとなく増えればいいなとやると失敗してしまう。今日ハードルが下がったら、あとは知識を身につけてやるかどうか。そこは3daysプログラムでしっかりお伝えします。"], [3124, "", "最後に、今日の感想をオープンチャットに書いていただくと、私が資産を増やすのに、100万円の利益を出すまでにやったことをまとめた動画コンテンツをプレゼントします。オープンチャットは、3daysプログラムに参加すると公式LINEからご案内が届きます。特典をお渡ししたり、投資の思い込みを変えたり、必要な知識をお渡ししたり、参加者同士で何を考えてスタートしているのかが分かる、投資を始める下準備の場所です。"], [3202, "", "（感想コメントを受けて）「今日聞けてよかったです」「欲しい未来をちゃんと言語化しようと思います」「ハードルが下がりました」、ありがとうございます。"], [3228, "", "次回のライブは11月10日。顔タイプ診断を作った岡田実子さんとのコラボライブです。「私を知ることで、美も自分も豊かさも育てていく」というテーマで、今日とは全く違う切り口から、資産を増やすうえで大切なことをお伝えします。11月10日21時半からです。3daysプログラムは12月1日スタートなので、まだの方はぜひご参加ください。今日も最後まで聞いてくださってありがとうございました。またね。"]]}, {"id": "1110", "vid": "9m7imK0k5qM", "date": "11/10（火）", "type": "コラボライブ", "guest": "岡田実子さん（顔タイプ診断協会 代表）", "title": "なりたい私を叶える、自分磨きと資産づくり", "duration": "約59分", "message": "自分を知って受け入れると、前向きになって行動が変わる。なりたい私は「輝いてみたい」くらいのふわっとでOK。未来を変えるのは、いつだって行動。", "slides": [{"t": 225, "h": "ゲスト：岡田実子さん", "p": "顔タイプ診断を理論化し、顔タイプ診断協会の代表に。パーソナルカラー・骨格・顔タイプ診断のプロを育成。最新刊は『最高の私の作り方』。", "li": ["今日のテーマは「自分磨き」と「お金」", "外見を通して「自分を知る」ことが、どんな未来につながる？"]}, {"t": 336, "h": "外見は「比べる」より「理論で知る」", "p": "性格なら「まじめ」も「前向き」も良さなのに、外見になると「かわいいか、そうじゃないか」の他人との比較になりがち。", "li": ["理論的に「私にはこういう良さ・特徴がある」と分かる", "すると、好きになる前にまず「受け入れられる」", "受け入れられて初めて「どう磨こう？」と楽しめる"]}, {"t": 540, "h": "受け入れると、分かりやすく前向きになる", "p": "鏡を見て「今日の私、いいかも」と思えると、行動するようになる。運をつかむ人は、行動する人。", "li": ["土台が整っていると、気持ちの上下が小さくなる", "下がってもすぐ戻せることは、投資の判断にも大事", "他人と比べて揺れるのではなく、自分で自分をハッピーに"]}, {"t": 796, "h": "「似合う」と「なりたい」は大学受験と同じ", "p": "志望校を決めたら、いきなり勉強せず、まず自分の得意科目や偏差値を知る。強みを生かすほうがスムーズに進めます。", "li": ["「似合う」＝強みを生かす近道", "「なりたい」が違っても、差が分かれば最短で埋められる", "りせさん「投資も同じ。分かる分野・身近な分野から始めると、いい銘柄を見つけるのが早い」"], "key": "似合う・好きは、どちらも近道"}, {"t": 1041, "h": "最初の「なりたい」は、ふわっとでいい", "p": "実子さんのスタートは「輝いてみたい」、ただそれだけ。はっきりした目標は、試行錯誤するうちに見えてくるもの。", "li": ["女性は「いくら増やしたい」だけでは頑張りにくい", "「なりたい私」があると、楽しく長く続けられる", "最後に「満足だった」と思えるのは、やりたいことをやったかどうか"]}, {"t": 1494, "h": "ビジョンボードには「数字」と「言葉」を", "p": "イメージを貼るだけでは「叶ったかどうかも分からない」。いつまでに・どれくらい、を入れると逆算できます。", "li": ["写真や絵でイメージをはっきりさせる", "数字と言葉を入れて、測れるようにする", "そこから「やることリスト」に落とし込む"], "key": "投資も「いつまでに・いくら」が出発点"}, {"t": 1743, "h": "1人で考えると、自分の枠から出られない", "p": "分からないことは、人に聞く。いろんな人と話すことで情報が入り、アイデアがひらめき、判断もしやすくなる。", "li": ["知識がないことは、やることリストも立てられない", "情報を聞いたうえで、最後は自分で判断する", "実子さん「ハナミラは心理的安全性が保たれた場所だと感じた」"]}, {"t": 2148, "h": "投資の土台は「前向きさ」", "p": "投資は、企業や世の中が良くなっていくことを前提に買うもの。後ろ向きでは、投資はできません。", "li": ["りせさんが初めて利益を出して最初にしたこと＝ファッションコンサル", "自分磨きに使ったら、自信がついて投資にも前向きに", "最初の利益の使い道が決まっていない人にもおすすめ"]}, {"t": 2874, "h": "豊かになる第一歩は「行動」", "p": "自信があったから始めたのではなく、始めてみたら自信が後からついてきた。描くだけでは何も変わらない。", "li": ["やってみたいと思ったことを、やってみる", "自信がなくても、新しい世界に飛び込んでみる", "実子さん「可能性を花開かせるのは、行動だけ」"], "key": "未来をつくるなら、行動"}], "transcript": [[0, "りせ", "皆さん、こんばんは。日本最大級の女性向け投資スクール「ハナミラ」の代表をしております、億超え投資家の松下りせと申します。このライブは、12月1日から開催する「株のはじめ方3daysプログラム」を記念して、各分野の超一流の方々とコラボさせていただいているライブ配信で、今回がコラボの2回目です。ぜひ楽しくご覧ください。"], [93, "りせ", "今日もスペシャルなゲストをお招きしています。皆さん、顔タイプ診断を受けたことはありますか？知らない人はいないんじゃないかという、あの顔タイプ診断を作られた岡田実子さんにお越しいただいています。診断を作った方がいるのは当然なんですけど、実子さんにお会いして初めて「そうか、作った人がいるんだ」と気づいて感動しました。診断も素晴らしければ、実子さんご自身もとても素晴らしい方です。"], [181, "りせ", "実子さんは最近、『最高の私の作り方』という書籍も出されて、大ヒットになっています。今日は顔タイプ診断のことはもちろん、「最高の私の作り方」という切り口から、自分磨きとお金をテーマにいろいろお話ししていきます。実子さん、自己紹介をお願いします。"], [225, "岡田", "顔タイプ診断協会代表の岡田実子と申します。パーソナルカラー診断や骨格診断、顔タイプ診断など全般をやるプロを育てつつ、顔タイプ診断を理論化して、今協会の代表をしています。りせさんとは学びの場でご一緒して、こんなに可愛らしいのに、バリバリと日本一の女性たちが集まる投資の学校をされているので、どんな女性なんだろうといつも興味深く思っていました。私は投資のお話を聞いたことがないので、逆にりせさんのお話を聞けるのも楽しみにしています。"], [273, "りせ", "今日は実子さんのフォロワーさんはもちろん、3daysプログラムの参加者の皆さんもたくさん見に来てくださっています。お金を自分の理想の未来のために得たい、という思いを持った方が多いので、そういう切り口から伺えたら嬉しいです。顔タイプ診断やご著書でも「自分を知る」ことを大切にされていると思うんですが、外見で自分を知った人には、どんな変化があるんでしょうか？"], [336, "岡田", "自分を知るというと、性格診断やMBTI、人から明るいと言われる、など内面からが多いと思うんです。逆に外見になると、可愛いかそうじゃないか、他人との比較になるんですよね。性格だったら、真面目も良さだし、前向きも良さだし、いろんな良さがあるじゃないですか。なのに見た目になると、自分の良さを知らない方が多くて、私自身もそれですごく悩んできました。"], [373, "岡田", "でも、自分のことを他人と比較するのではなく、理論的に「私にはこういう良さがある」「こういう特徴がある」と分かるようになってから、一気に好きになるというよりは、受け入れられるようになったんです。「あの人に比べたら私なんて」とずっと思っていると、永遠に悲しい気持ちになる。それが「私はこうなんだ、こうだからこう見られるんだ」となって、初めて素直に自分を受け入れられた。そこから、「じゃあどうやって磨こうかな」「イメージと違うなら、どうやって近づけようかな」と、自分を楽しめるように変わっていきました。"], [429, "りせ", "シンプルだけど、すごく深いですね。外見を科学するというか。"], [436, "岡田", "比較になっちゃうので、「科学的に」というのがポイントで。日本人は「今日可愛いね」と褒められても「いやいやいや」と言ってしまう。でも「こういう理由でこうだからいいんだよ」と言われたら「確かに」と言える。客観的に捉えられるといいんだけど、自分のことは監視できないのが人なんですよね。だから尺度を作って、みんなが自分の良さを知ったらいいな、そういう社会にしたいなと思ってやっています。"], [491, "りせ", "顔タイプ診断がなぜこんなにみんなに好かれているのか、改めて実感しました。受けた本人が嬉しいから、自分の魅力に気づいたからこそ、これだけ広がっているんですね。受け入れられると、具体的にどんな変化が起きますか？"], [540, "岡田", "受け入れられると、分かりやすく前向きになっていくんです。鏡を見て「今日の自分っていいかも」と思うと、行動するようになるでしょう。「今日は嫌だな」と思うと外に出たくない。それが前向きになって行動する。運をつかむ人って、行動する人じゃないですか。そうすると、どんどん人生が変わり始める方が多いんです。"], [590, "りせ", "女性って、髪型が1つ決まらないだけで1日ネガティブになったりしますもんね。「今日の私、イケてる」と思えたら、仕事の場でも誰かに声をかけられても、ポジティブに受けられますね。"], [616, "岡田", "人の人生って、ベースがどう整っているかが意外と重要な気がしませんか？ここが揺れていると、あらゆる行動が揺れていそう。平均よりちょっと上を行って、もちろん下がることもあるけど、またすぐに戻せる。それが何の行動にも必要な気がするし、投資をする時も一緒な気がします。不安もあるでしょうし。起業もそうなんですけどね。"], [663, "りせ", "先が決まっていない何かをするのが起業も投資もだと思うので、絶対メンタルは関わってきます。1つ1つの判断の時に前向きでいられるって、本当に素晴らしいことですよね。"], [680, "岡田", "そのために、他人と比べたり周りに影響を受けたりして揺れるんじゃなくて、自分で自分をハッピーにできる。ここが前向きでいるポイントになってくると思います。自分もいいよね、あなたも素敵、とそれぞれを認められるので、心に余裕ができる感じがします。"], [744, "りせ", "さっき「似合う」と「なりたい」という言葉が出てきましたが、理想の未来を描いた時に、自分に似合うものとなりたいものにギャップが出ることもあると思うんです。どう切り分けて選んでいますか？"], [796, "岡田", "外見に関して言うと、大学受験みたいなものなんです。大学受験の時、目標の大学を決めますよね。たとえば「東大の文系に行きたい」とか。決めた時に、いきなり勉強する人っていなくて、自分の偏差値や得意科目をしっかり知ったうえで「さあ、この差を埋めましょう」とすると思うんです。その時、文系が得意な方は、理系を受けるより文系を目指したほうがより良い大学に楽に行ける。これが「似合う」なんです。自分の強みを生かしていくと、どんどんふわーっと進んでいく。"], [855, "岡田", "でも「理系が好き、理系に行きたい」という方もいますよね。なりたいが違う人。その時も、自分の得意科目がどれくらいのレベルか、苦手がどれくらいか分かっていることで、差が分かるので、早道で埋められるようになるんです。どちらに行くのも自由です。ただ、スムーズに良い方向に行きやすいのは「似合う」。ファッションの場合は、文系と理系と違って「似合う」と「なりたい」をミックスできるので、似合うを軸にしつつ、なりたいものを入れていくと、その方の良さを生かしながら、なりたい方向に近づいていけます。"], [913, "りせ", "めちゃめちゃ大切ですね。これは投資にも通じると思います。銘柄選びも同じで、私が投資を始めた時、今でこそ半導体は分かりやすい分野になってきましたけど、当時は何のことだかさっぱりでした。専門職で働いていない限り、みんなそうだと思うんです。よく分からないのに無理して調べて投資しようとすると、いいものに当たるまですごく時間がかかる。でも、自分にとって少し分かる分野、土地勘のある分野を出発点にしていくと、いいものを見つけるのが早くなるんです。"], [974, "岡田", "何事もそうだなと思いました。好きな会社や分野だと、調べるのも楽しいんでしょうね。"], [987, "りせ", "その通りです。分かるから楽しくなる、というものも結構あると思います。それが近道になって上達が早くなる。似合うは近道、好きも近道ですね。"], [1022, "りせ", "実子さんご自身も起業されて、すごい結果を出されていますが、その時、なりたい私や描いていた自分はありましたか？"], [1041, "岡田", "スタートはすごくシンプルで、「輝いてみたい」、ただそれだけでした。なりたい自分の像さえはっきりしていなくて。自分の生きてきた道がずっと中途半端に感じていて、素敵な人生を歩んでみたいと。過去を生きてきた中で、だいたい先が見えるじゃないですか。結婚してより、それを思ったんです。「私の未来ってもうこれくらいかな」と思った時に、いや、もっと自分にワクワクしてみたい、素敵な人を見て、そんなふうに輝いてみたいと。そのために何ができるかなと思って、やりたいことを仕事にしてみようと始めました。"], [1105, "岡田", "途中から、本にも書いたんですけど、ビジョンボードを作るようになって、より具体的なイメージを作るようになりました。でもそれは、だいぶ後です。そこから進むようになりました。"], [1132, "りせ", "「輝いてみたい」が刺さった人、いっぱいいると思います。どうなりたいか分からなくて悩む方もいると思うんですが、そういう素直なモチベーションからでいいんですね。"], [1168, "岡田", "具体的に決めるのは、女性は特に苦手だったりすると思うんです。なので、まずは自分がどうしたいかだけでも十分だと思っていて。たくさん試行錯誤するうちに、だんだん具体的に「これをやってみたい」が浮かんでくるので、最初からはっきりした目標はなくてもいいと思います。"], [1205, "りせ", "3daysプログラムでも「なりたい私」をアウトプットしてもらうんですけど、昔の私もそうだったように「と言われても…」と思う人も多いと思うんです。でも、内側から出てくる本当にシンプルなものをきっかけにすれば大丈夫。背中を押してもらえた方も多いと思います。"], [1238, "りせ", "女性ならではだと思うんですけど、「いくら増やしたい」だけで頑張れるかというと、そうでもなかったりするんです。会社員でお給料もある程度回っていると、今の人生も悪くないから、お金へのモチベーションが湧く人もいれば、湧かない人もいる。でも、なりたい自分があって、それを実現するためなら、「なぜやるのか」がはっきりする。やりたいことがちょっとでも見えている人のほうが、楽しく長く続くんですよね。私も最初は見つけられなかったタイプで、実子さんと同じく「レールが決まった人生でいいのかな」とすごく迷いました。"], [1319, "岡田", "そう思った時に、「まあいっか」と思うこともできて、そのせめぎ合いの時期ってありますよね。幸せだし、いいんじゃないか、と。でも長い人生で、最後に「私の人生すごく満足だった」と言えるかどうかは、チャレンジしたり、やりたいと思ったことをちゃんと行動したかどうかが大事。何を成し遂げたかより、悔いなくやったか。"], [1362, "りせ", "人生の最後に後悔することについてのアンケートで有名なものがありますよね。行動しなかったこと、やらなかったことを後悔するという。"], [1375, "岡田", "まさにそれだと思います。やらなかったことは人によって全然違うし、重さもない。だから株も、もしかしたら同じで、株が目的じゃなくて、それを通して自分が実現したいことを達成するための、ゴールまでの道のりの途中なのかなという感じがします。"], [1405, "りせ", "すごく思います。やるからには成果を出してほしいのはもちろんあるんですけど、大切なのは、後で振り返った時に「よかった」と思えるかどうか。チャレンジしてみる、違和感をちゃんと感じてみることが大切ですよね。"], [1438, "岡田", "何でもやってみないと分からないこともあるので、教えてもらいながら、やっていくのは1つだと思います。"], [1460, "りせ", "コメントで「私はキラキラした女性になりたいが根本にあります。キラキラした女性ってどんな人？何がしたい？何があったら幸せ？を考えるようにしています。だから投資も始めました」と来ています。素晴らしいですね。実子さん、ビジョンボードにお金のことを取り入れるとしたら、どうされますか？"], [1494, "岡田", "お金だけだと、あまりワクワクしないんじゃないかと思うんです。する人もいるかもしれないけど、1万円札を貼っておいても、という感じで。女性は物的なギラギラ感があるとワクワクしにくいけれど、「家族で世界一周旅行をしたい」とか、叶えたいワクワクすることっていろいろあるじゃないですか。ビジョンボードで重要なのは、私自身も試してきてすごく思うんですが、イメージをはっきり画像化することと、そこに数字と言葉を入れることなんです。"], [1562, "岡田", "20年くらい前にビジョンボードを教わってやってみたら、単なるワクワクボードで、何も叶わなかったんです。叶ったかどうかさえ分からないイメージだったから。逆に男性の先生だと「年収何千万で、車が何々で」とギラギラしていて、それもワクワクしない。そこを融合させて、自分なりに「何年何月に何々」と。それがいくらなのか、何kgなのか、測れるものを載せることで、逆算思考が生まれるようになるんです。ゴールまで必ずつなげないといけないので、ステップが見えるじゃないですか。それを自分なりにやることリストに落とし込む。ビジョンボードは見ているだけでは叶えにくくて、行動にしていくと「これさえクリアすれば大丈夫」となって、いつの間にか叶っていく。本当に私がやってきたリアルです。"], [1650, "岡田", "現実的な小さなクリアを重ねてきたので、投資をやりたい方も、女性の場合は「こんなことを叶えたい」があって、そのためにはいくらで、どういうふうに、という組み立てが必要なんじゃないですか？"], [1670, "りせ", "おっしゃる通りで、私もそれをお伝えしています。投資で一番多いのが「とりあえずできるだけ増えたらいいな」なんですけど、それだとすごくふわっとしてしまう。どの銘柄を選ぶか、投資信託の積み立てなのか、個別株をやったほうがいいのか、違う投資がいいのか。「できるだけ増やしたい」だと何の目標にもならないので、行動まで落ちなかったり、やるべき投資を自分で選べなかったりするんです。いつまでにいくら、をちゃんと決めることが最初の出発点で、それがあるから「銘柄を選ぼう」「積み立てだけじゃダメだな」と初めて分かる。皆さん、実子さん流でビジョンボードをやったほうがいいと思います。"], [1745, "岡田", "私は投資をそんなに分かっていないので、今伺っていて思ったのが、自分が叶えたい未来に対するやることリストは考えられるんです。でも、投資のように自分が分からないジャンルになると、サポートしてくれる人がいると安心だなと。りせさんのコミュニティは、そこに安心感があるんじゃないかなという気がしました。やったことがない、想像がつかないことのやることリストって、そもそも立てられないですよね。何事も、叶える時には知識が必要なんだなと。"], [1800, "岡田", "私も、自分の叶えたいことに対して想像できないことがあると、その都度、常に人に聞いています。連絡してみたり、周りの人に聞いてみたりして、初めて糸口が見えてくる。1人でやると、自分が生きてきた中で見た知識と、自分の枠の中ですべて判断するので、結局すごく限られているんです。情報を聞いたうえで、自分の枠の中に落とし込んで、自分で判断をすることが大切だと思います。"], [1878, "りせ", "起業でも投資でも何でもそうですけど、自分の外のことは何かと接触していかないと全然広がらないですもんね。"], [1893, "岡田", "この間も話していたんですけど、アイデアがどんどん浮かぶ人のポイントは、とにかく人とコミュニケーションを取って触れ合っている人。1人でうんうん考えるより、いろんな人と話して情報が入ってきて、自分の脳の中でカチカチっと「ひらめいた」となる。いろんなことが紐づくんですよね。社会情勢を聞いたり、人の話を聞いたり、分析したうえで「私はこう思う」がないと、判断も怖いし、違う方向に行ってしまう気がします。"], [1947, "りせ", "アイデアって掛け算と言いますもんね。既存のものでも、組み合わせると新しくなる。"], [1965, "岡田", "りせさんがやっているのも掛け算ですね。投資があって、女性のコミュニティがあって、そこを掛け合わせることで、優しい集まりになっているというか。"], [1991, "りせ", "嬉しいです。実は実子さん、うちのコミュニティ「ハナミラ」も見に来てくださって、雰囲気をすごく気に入ってくださったんです。"], [2011, "岡田", "出版記念のセミナーをさせていただいた時に、今までにない雰囲気で、本当に心理的安全性が保たれた場所みたいな感じでした。りせさんご自身がそういう方ですよね。そういうのは、実際に会わなくてもその場の空気で伝わってくるので、すごいなと思って、終わってすぐりせさんに連絡したんです。「ハナミラの雰囲気がなんかすごいんです、こんなコミュニティ作るんですね」と感動して。それを聞いてメンバーの方が喜んでくださるのも、みんなが好きな場所なんだなと感じました。"], [2117, "岡田", "私から質問なんですが、資産運用をする時に一番大事なことってなんですか？"], [2148, "りせ", "いろんな切り口がありますが、私は一番大事なのは「前向きさ」、ポジティブさだと思っています。投資は基本的に、株を買って、その企業がいい形で活躍して上昇していくとか、投資信託も世の中が良くなって発展していくことを前提に買うものなんです。だから前向きじゃないと絶対できない。後ろ向きだったら投資できないはずなんです。"], [2226, "りせ", "関係するかどうか分からないですけど、私が投資で初めて利益を出せるようになった時、一番最初にやったのはファッションコンサルを受けに行くことでした。投資を頑張ろうと思ったモチベーションが、さっき実子さんが言っていたことと同じで、このままの人生の延長じゃなく、今の人生も好きだけどもっとできるんじゃないかと。周りの投資家の方たちを見ていると、すごくキラキラしていて、ファッションにも気を使われていたし、周りのことを思って服を選んでいたりしたんです。"], [2273, "りせ", "その時の私は、会社員らしい紺色の服を、もう制服のように「これを着ていけばいいや、5日分ある」という感じでした。転職をきっかけに株を始めたんですけど、昔は結構華やかな服を着ていたのに、時間も選ぶ時間もなくなって、どんどん落ち着いていってしまって。そこから変えようとファッションコンサルを受けに行って、その利益で買い物に行きました。"], [2323, "りせ", "最初は自分磨きに使いました。楽しかったし、自分に自信がついて、見え方も変わったりして、より投資にも前向きになりました。いいことばかりでした。最初の利益で何をしようか決まっていない方は、ファッションコンサルを受けて、好きな素敵な服を選んでもらうのは、女性にはすごくおすすめです。今振り返れば、たぶん顔タイプ診断の資格を持っている方だったと思います。"], [2372, "岡田", "金額だとどうしても遠く感じたり、「そういうこと言っていいのかな」となるけれど、素敵な自分や、やりたい旅だったら、すごく心が言える感じがありますよね。会社員をしながら始めて、だんだん仕事にされるようになったんですか？"], [2435, "りせ", "そうですね。自分が投資できるようになって真っ先に思ったのが、簡単に言うと、自分の友達に投資してほしい、だったんです。総合職でみんな頑張っていて、お金のことをそんなに気にして仕事をしている人はあまりいなくて、基本的にやりがいなんですよね。でも、仕事ができるがゆえに疲れていったり、私もそうでしたが仕事にのめり込みすぎて婚活で悩んだり。この将来でいいのかと思っても、お給料が増えるわけでもない。同じように頑張って悩んでいる人がいたんです。"], [2505, "りせ", "私は投資があれば、会社だけに依存しなくても生きていけると思えるようになってから、仕事もすごく楽しくなったんです。世界が狭いままだと「この仕事を失ったら」「この道しかない」と思って辛かったけど、こういう手段もあると思えるだけで、また会社が楽しくなった。だからすぐに辞めようとは思わなかったんですけど、次第に誰かに伝えたいという気持ちや、仕事も楽しみきったかなというところがあって、それが転換点になりました。"], [2567, "岡田", "立ち上げるのも勇気が要ったと思うけど、よかったから、同じように豊かになる女性を増やしたいという思いを持ったんでしょうね。"], [2585, "りせ", "そうなんです。これめちゃめちゃいいな、というのが本当にきっかけでした。実子さんが顔タイプ診断を作って広められているのとも、近かったのかなと思います。法人にして5年くらいです。メンバーの方も、投資はもちろん、投資以外のところでもつながっていて。たとえばジャニーズ部、韓国部、ママで情報交換するママ部とか。投資やお金の話もするし、そうじゃない話もできる場所になっています。"], [2664, "りせ", "私が投資でうまくいったのは、投資ができたからというより、まず友達ができて、友達とやるのが楽しかったから、なんです。だから仲間はめちゃめちゃ大事だと思っていて、そういう環境にしたかったんです。"], [2685, "岡田", "分かります。起業もそうで、やるのは1人なんだけど、仲間がいないと寂しかったり、情報がなかったり、揺れるじゃないですか。仲間がいることで揺れが減るんですよね。自分で保つのも大事だけど、周りに誰かがいて、精神的にも安定していて、情報もしっかり入ってくると揺れが減ります。"], [2745, "岡田", "私が協会を作る時に大事にしているのは、どういう思いで運営するか。「儲かるぞ」だったら全然違う方向に行ってしまうと思うんです。りせさんも投資を通して「こういう人を増やすぞ」と思っていて、それがハナミラの雰囲気になっているんだと思います。顔タイプも「自分を知ることで人生を楽しむ人を増やす」がミッションで、その思いを持って資格を取る方もいらっしゃる。どういう思いのところで仲間になるかも大事な気がします。"], [2810, "りせ", "実子さんは学校を作って10年、協会は来年10周年ですよね。これだけ多くの方が習い続けられているのは、思いがあってこそだと思います。1人だったら「もういいかな」となってしまいますもんね。"], [2874, "岡田", "最後に質問してもいいですか？女性がもっと豊かになるためには、何から始めればいいと思いますか？"], [2895, "りせ", "鶏と卵的なところがあるかなと思うんですが、まとめると「行動」になるのかなと思います。私もすぐに投資に行きついたわけではなくて、いろいろ考えが巡ったうえで投資にしようと行動に結びついたんですけど、始めた時に自分に自信があったわけでは正直なくて、始めてみて、結果が後からついてきた感じでした。どんな切り口でも、さっき実子さんがおっしゃった前向きさのように、「もっとできるかもしれない」と思える何かを始めて、そこから好転していくと思うんです。だから、やりたいと思ったことをやってみる、自信がなくても新しい世界に飛び込んでみる、が本当に大事だと思います。"], [2962, "岡田", "めちゃくちゃ同意します。夢を描くことは、いろんな豊かさにつながるけれど、描くだけでは何も変わらない。私も描くだけで何も変わらないのを長年続けたのでよく分かるんですけど、散々夢を言った後に「行動しなければ未来は変わらないんだ」と気づいて、そこから変わっていきました。"], [3013, "りせ", "自信がない、怖い、で止まってしまう方も多いと思うんですけど、自信は始めてやってみてから後からついてくるものだと思うので、行動は本当に大事です。"], [3030, "岡田", "未来をつくるなら、行動ですね。"], [3035, "りせ", "今回のライブを見に来てくださった方で、投資を始めたい方も、顔タイプ診断や協会に興味がある方も、ファッションコンサルを受けたいと思った方もいると思います。やってみると変わっていくので、ぜひチャレンジしてみてください。"], [3066, "りせ", "3daysプログラムでは、参加者の皆さんがライブの感想をオープンチャットでアウトプットすると、特典や抽選会があります。今回は、実子さんの新刊『最高の私の作り方』を抽選で1名様にプレゼントします。ビジョンボードのお話もしっかり載っている本です。"], [3161, "りせ", "実子さん、最後に、新しいことを始めたい、豊かになりたいと思っている女性に、応援メッセージをお願いします。"], [3175, "岡田", "人それぞれに可能性がいっぱいあると思っています。その可能性を花開かせるのは、先ほど出た「行動」でしかありませんので、自分の未来を花咲かせたいと思った方は、ぜひ何か行動をしてみてください。"], [3200, "りせ", "実子さんの情報が欲しい方は、ぜひフォローして、プロフィールのリンクから顔タイプ診断などの情報もご覧ください。実子さん、素敵なお話をありがとうございました。"], [3233, "りせ", "皆さん、コメントありがとうございます。「可能性を信じて頑張ります」「一歩踏み出す勇気ですね」、素晴らしいです。実子さんの、ぶれない土台の安定感。顔タイプ診断を受けて自分を愛せるようになってくると、ああいう安定感が手に入っていくと思うので、ぜひ受けてみてください。"], [3330, "りせ", "オープンチャットでは、実子さんがおっしゃっていた「他の人と触れ合うことで自分の枠を広げる」ことができます。他の方のアウトプットや考えていることから、自分が投資をどう思っているのかも分かるようになっています。なりたい私を描くにしても、他の人の話を聞いて「それいいな、だからこれを目指してみよう」と思うことは本当にたくさんあります。見る専門でも大丈夫なので、ぜひ活用してください。"], [3396, "りせ", "今日は、自分磨きと投資には共通点がたくさんあると実感しました。すべての物事は本質的なところは変わらないと思います。私は投資をスタートしたことで、全部が好転し始めた感じなんです。女性って何か1つうまくいくと、いろんな循環に入って全部うまくいくようになる。皆さんにとって、投資がそのきっかけになったら嬉しいです。"], [3462, "りせ", "12月1日からの3daysプログラムでは、投資が怖い方、自分でやっているけどよく分からない、うまくいっていない方も解決できるように、分かりやすくお伝えします。Day1では投資の土台、Day2では銘柄の選び方、Day3では選んだ銘柄にどう投資していけば資産を増やせるのかをお話しします。参加無料です。次回は11月12日（木）20時から、素敵なホテルから配信します。今日も見ていただき、ありがとうございました。"]]}, {"id": "1112", "vid": "srvyBa0ZT8g", "date": "11/12（木）", "type": "コラボライブ", "guest": "白井ゆりかさん（自分軸ダイエット主宰）", "title": "資産も夢も思い通り「自分軸マインド」の育て方", "duration": "約57分", "message": "自分に合う方法を自分で選ぶ「自分軸」があると、選んだ道を正解にしていける。完璧じゃなくていいから行動して、前向きな仲間と続けよう。", "slides": [{"t": 185, "h": "ゲスト：白井ゆりかさん", "p": "女性が自分らしく心も体も健康に輝けるように、と「自分軸ダイエット」講座を主宰。著書は『自己肯定感ダイエット』。実はハナミラの受講生でもあります。", "li": ["今日のテーマは「自分軸」", "ダイエットも投資も、うまくいく理由は同じ？"]}, {"t": 217, "h": "自分軸があると「選んだ道を正解にできる」", "p": "自分の判断に自信が持てるから、選んだことを正解にしながら前へ進める。逆に、人がいいと言う方法を片っ端から試すと…", "li": ["自分に合わない方法を無理に続けてしまう", "うまくいかないたびに自信を失う", "「できない自分」が強くなっていく"], "key": "自分に合うものは、最後は自分にしか分からない"}, {"t": 542, "h": "ゆりかさんのターニングポイント", "p": "無理な食事制限を続けて体調を崩し、声が出なくなって10日間の療養に。「痩せる」ではなく「自分の心と体を大切にする」に考えを切りかえました。", "li": ["他人の目ではなく、自分が健康になるための食生活を選ぶ", "結果的に体が軽くなり、気持ちも前向きに", "この経験を伝えようと起業"]}, {"t": 775, "h": "ネットの「〇〇株が買い」ではうまくいかない", "p": "書き込みは、その瞬間の一人の判断を切り取ったもの。書いた人も、次の情報で考えが変わっていることがよくあります。", "li": ["自分で決めていないと、売るタイミングが分からなくなる", "たまたま当たることはあっても、続けてうまくはいかない", "自分で「ハンドルを握っている」感覚が大切"]}, {"t": 938, "h": "「魚をもらう」から「釣り方を学ぶ」へ", "p": "ゆりかさんは以前、すすめられるままに株を買っていて、下がった株をどうしたらいいか分からなくなった経験も。ハナミラで自分の判断基準を持てたのが大きかったそう。", "li": ["自分で選べると、投資が面白くなる", "面白いから、勉強が苦にならない", "もちろん今も100%当たるわけではない"]}, {"t": 1289, "h": "増やしたお金で「何をしたいか」", "p": "数字が増えることにワクワクする人もいれば、そうでない人もいる。旅行、ジュエリー、家族のための車…叶えたいことがあると続けやすい。", "li": ["ゆりかさんは株の利益で、念願のネックレスを購入", "りせさん「お金は、何かに変えたときに一番実感が湧く」", "どちらも選べる「選択肢」があることが幸せ"]}, {"t": 1701, "h": "自分軸をつくるのは「完璧を求めない行動」", "p": "絶対に成功する行動なんてない。見えている成功の裏には、うまくいかなかった挑戦がたくさんあります。", "li": ["失敗を恐れず、行動して経験を積む", "専門家に学ぶと、先人の失敗をショートカットできる", "お金は取り戻せても、時間は取り戻せない"], "key": "やらなければ何も変わらない"}, {"t": 2256, "h": "「どうせ最後にはうまくいく」と前向きに", "p": "りせさんが資産づくりで一番大事にしているのは、何があっても前向きでいること。投資は、企業や世の中の未来が良くなると信じて行うものだから。", "li": ["起きたことは、全部次に生かす", "前向き＝無理に明るくなることではない", "大きく下がった日も、自分の軸と知識があればうろたえない"]}, {"t": 2599, "h": "仲間がいる環境に入る", "p": "投資の話は、普段の友達とはなかなかしにくいもの。投資の話が当たり前にできる場所があると、続けやすく、高め合えます。", "li": ["一緒に銘柄を調べる、話し合う", "うまくいっている人を見て「私も」と思える", "女性は、みんなで高め合うのが得意"]}, {"t": 3129, "h": "ゆりかさんからのメッセージ", "p": "夢は青天井。わがままかなと思うくらい、理想をどんどん出して、叶えてを繰り返していい。", "li": ["いつも周りのために頑張っている人こそ", "自分のためにも、全力で夢を叶えにいってほしい"], "key": "一緒に叶えていきましょう"}], "transcript": [[0, "りせ", "皆さん、こんばんは。「AI時代の女子流株のはじめ方3daysプログラム」を記念した連続ライブ「超一流のお金の哲学」をお届けしています。開始が遅れて申し訳ありませんでした。赤ちゃんの寝かしつけで少し時間がかかってしまいました。今日はパレスホテルから配信しています。"], [63, "りせ", "今日はお待ちかねのコラボライブです。このライブを見てくださった方には、パレスホテルのお土産が当たる抽選会もします。今日のゲストは、自分の軸をしっかり定めることで、ご自身も、数々の女性たちもダイエットを成功させてきて、今はその方法を使って起業もお伝えしている素敵な女性です。実はハナミラも受講してくださっていたので、そのあたりもお話ししていきます。"], [144, "りせ", "では、白井ゆりかさんです。よろしくお願いします。今日初めての方も多いと思うので、まず自己紹介をお願いします。"], [185, "白井", "白井ゆりかです。私は「自分軸ダイエット」というダイエット講座を主宰しています。美容やダイエットで悩まれている女性が、自分らしく心も体も健康に輝けるように、ということを理念に講座を運営しています。後ろにある『自己肯定感ダイエット』という本も発売中です。"], [217, "りせ", "ゆりかさんは自己肯定感や自分軸をすごく大切にされていると思うんですが、ズバリ、それができるとなぜ何事もうまくいったり、夢が叶ったりすると思いますか？"], [238, "白井", "ズバリ、自分の軸を持って、自分の決断に自信を持てるようになるからです。選んだところを全部正解にするというか、選んだものが正解になる。そうやって物事をどんどん前に進めていけるから、というのが大きいと感じています。"], [273, "りせ", "「選んだことを正解にする」ってよく聞きますけど、言うは易し、と思う人もいると思うんです。詳しく聞かせてください。"], [293, "白井", "株式投資も全部一緒だと思うんですけど、私たちは常に、誰かに言われたことや世間で言われていることに合わせて生きてきている部分があると思うんです。それは過去には通用していたかもしれないけど、ある時通用しなくなる時が来る。「これで本当にいいのかな」「これが自分の望んだ人生だったのかな」と思う瞬間が来る人は結構いると思います。"], [323, "白井", "私も20代前半の頃にそれをすごく感じました。世間で言われているダイエットにたくさん挑戦して、痩せてはリバウンドを繰り返していたんです。なぜ繰り返していたかを考えたら、自分に合わない方法を無理してやっていたから。自分の軸がなかったんです。周りがいいと言うものを片っ端から取り入れていたけど、合わないことをやってうまくいかないと、そのたびに自信を失っていく。できない自分が強化されてしまうんです。"], [382, "白井", "そこから、自分に合うものは何だろうと経験から学んで生かしていったら、ダイエットもできるようになったし、仕事も起業も、それこそハナミラに入って株に関しても、恋愛や結婚に関しても叶えられるようになりました。自分に合うものって、結局自分にしか分からないんですよね。"], [435, "白井", "りせさんも、印象的なターニングポイントはありましたか？"], [450, "りせ", "私は投資に関しては、前から一貫していてあまりぶれないんです。最初に身につけたやり方を貫いてきたタイプで、いろいろやってみても、結局それが一番利益が出る。一方で、会社のことは、受講生さんや関わってくださる方が増えて考えることが広がっていくので、変化しながらも「やっぱりこっちだな」と戻ることはありますね。"], [506, "白井", "関わる人が増えると判断する材料も増えるので、考えることも増えますよね。"], [521, "りせ", "ゆりかさんが、自分軸が大事だと思うに至ったきっかけはありましたか？"], [542, "白井", "ターニングポイントは、声帯ポリープという、声が出なくなる病気になったことです。25歳の誕生日でした。制限ダイエットやサプリメント、過度な食事制限など、手当たり次第試していたら体調を崩して、それをこじらせてしまったんです。当時は理学療法士で、患者さんと毎日話す仕事だったので、話せないと仕事にならない。お医者さんに「10日間一切仕事も会話もしないでください、これ以上悪化したら手術です」と言われて、実家で療養しました。"], [617, "白井", "それまでは、ダイエットといえば食事制限やカロリー制限、運動だと思っていたんですけど、全部できなくなった。それで、痩せるとかではなく、自分の心と体を大切にしようと思ったんです。自分の心と体を全く見てこなかったなと。自分が続けやすいことは何か、健康のためにできることは何か、自分を大切にするならどんな食生活をするのか、という視点に変わりました。"], [661, "白井", "結局「痩せる」って、他人の目を気にしているわけですよね。そうではなく、自分が健康になるためにはどうしたらいいか、という自分軸で食生活を選んでいったら、痩せようと思っていたわけではないのに、どんどん体が軽くなったんです。あんなに頑張っていたのは何だったんだろう、と。体調不良も軒並み治って、メンタルも前向きになって、何事もいい方向に行って。これを伝えようと思って起業しました。あの療養期間があってよかったと、すごく感じています。"], [733, "りせ", "今それを「あれがあったから」と言えるのも、自分軸で生きているからですよね。自分で決めた道を行ったり、合うものをちゃんと選んでやっていくと、いろんなことが幸せに進みますよね。"], [775, "白井", "本当にその通りだと思います。株も、ネット上に「何々の株が今買いです」とたくさん上がっていますよね。ああいうのを見て選んでもうまくいかないだろうし、実際うまくいかなかったんです。軸がない状態で選んでいるから、自分でハンドルを握っている感じがない。何を基準に投資するのか、という軸もすごく大事なのは通じますよね。"], [815, "りせ", "ネットの書き込みは本当にそうで、書き込む側に立って考えるとよく分かるんです。その人なりの投資判断で、その瞬間はいいと本気で思って書いていても、次の情報と照らし合わせると「違うな」となることが、自分で投資していても結構あるんです。書き込みは一つの切り取りでしかなくて、その後その人がどう考えたかまでは分かりません。"], [869, "りせ", "それに、自分でいい投資をしている時ほど、「いいと思うけど、こういうリスクもあるよな」と考えながらやっているんです。いいと思っている会社でも、100点満点じゃないことは分かっている。それを他の人が同じレベルで受け止められるかは別の話で、まさに合う・合わないです。だから書き込みをうのみにするとうまくいかない。ラッキーパンチでうまくいくことはあっても、続けてうまくいくことは、まずないと思います。"], [938, "白井", "私がハナミラを受講させていただいたのは今年の春頃ですが、受講前後ですごく変わったと思うのは、自分で投資の軸、判断基準を持てたことです。投資自体は5年くらい前からやっていたんです。以前の夫が投資好きなタイプで、判断基準も知らずに「この株を買っておけばいいよ」と言われて買っていました。実際に増えたものもあったんですけど、売るタイミングが分からなくて、買ったまま下がったものもあったんです。"], [1008, "りせ", "自分で決めていないと、売るタイミングが難しくなるんですよね。"], [1029, "白井", "そうなんです。これは「魚を取ってもらうんじゃなくて、釣り方を自分で勉強しないといけない」と同じだと感じて。判断基準を持てるようになったのが大きかったです。もちろん今も100%当てられるわけではないですけど、すごく面白くなりました。面白くなると、もっと勉強しようとなるし、勉強すること自体が苦じゃなくなる。"], [1079, "りせ", "人に言われたものを買っている時は、面白さが分からないまま、失敗すると「何なんだろう」となる。自分でやっていると楽しさが出てきますよね。ちなみに、なぜハナミラに来てくれたんですか？"], [1121, "白井", "一番大きかったのは、りせさんがオリエンタルランド出身だったこと。私はディズニーが大好きなので、その時点で「悪い人ではなさそう」というのが第一印象でした（笑）。本や発信を見る中で、見るからに優しそうな人柄と、投資を推し活に例えていたのが面白いなと思って。女子からするととっつきやすいですよね。"], [1173, "りせ", "嬉しいです。「投資は応援」と言っているんですけど、女性は、お金の話だけでやる気になる人と、そうじゃない人で結構分かれると思うんです。お金だけで続けられるかというと難しい方も多い。でも、企業の応援だと思っていると続けやすくなる。私もそういう気持ちだから楽しく続けられているし、女性ならではの感覚かなと思っています。"], [1232, "白井", "数字にコミットできるタイプと、感性や理想像で行動できるタイプがいますよね。ダイエットも「何kg落とす」にワクワクしない方が、うちの講座生さんにすごく多くて、私もそうなんです。投資も、数字だけを追いかけるのは私は全然面白いと思えなかったタイプ。"], [1289, "白井", "だから、何をするために投資するのか。直近で旅行に行きたい、ジュエリーを買いたい、そういう目標があるとやりやすいし、それを叶えるためにこれだけやろう、となりますよね。"], [1312, "りせ", "分かります。数字上増えるのは嬉しいし安心にもつながるんですけど、それが物や経験に変えられた時に、一番幸福度や実感が湧くと思っていて。増やした先にどう使うかが、すごく大事ですよね。皆さんは、投資でお金を増やして何がしたいですか？"], [1384, "白井", "りせさんにご報告したいことがあったんです。このネックレス、株の利益で買いました！"], [1395, "りせ", "すごく素敵、おめでとうございます！なかなか出会えないものですよね。"], [1416, "白井", "何店舗も回って、ようやく出会えました。さすがに経費では落とせないので、ちゃんとポケットマネーで買おうと思って。株の利益があったからです。りせさん、ありがとうございます。この別のアクセサリーも数年前に買ったんですけど、今は買った時の倍くらいの値段になっているので、早めに買おうと思って。"], [1490, "りせ", "（コメントを受けて）「家族で遠くの実家まで行ける大きな車」「推し活で海外遠征」「旅行」「マンション」「教育費」…いいですね。教育費も、かけようと思えばいくらでもかけられますよね。上を見るとキリがないけれど、それを選ぶかどうかに関わらず、お金があると選択肢が広がる。ゆりかさんも、高いものも買えるけど、可愛ければ手頃なものでもいい。どちらも選べる選択肢を持てることが、幸せなことだと思います。"], [1646, "白井", "ダイエット講座の次に「ロイヤルドリームアカデミー」というマインドの講座をやっていて、そちらは自己実現がメインです。うちのダイエットカウンセラーになって収入を何倍にもした方、転職して収入が上がった方、やりたい仕事についた方、起業できた方…皆さんいろんな道に進まれています。"], [1701, "りせ", "自分軸になるためには、何をしたらいいと思いますか？"], [1712, "白井", "語るとキリがないんですけど、大事なのは、完璧を求めないことだと思います。行動しても、絶対に成功する確証はないですよね。何においてもそうだと思います。投資も、絶対に利益が出せるなんてことはないじゃないですか。あったら詐欺です。"], [1743, "白井", "私は、やったことがうまくいかなかったことのほうが全然多くて、表に出しているうまくいったことなんて本当に一部なんです。SNSを見ていると、簡単にキラキラうまくいっているように見えるかもしれないけど、失敗を恐れずに行動して、経験値を積んでいくのが、結局自分軸を確立するために一番大事だと思っています。その時に、最初に専門家に学びながらやると、失敗のリスクも減らせるし、先人たちの失敗をショートカットして学べる。それが、私が何かを学ぶ時のマインドセットです。"], [1820, "白井", "私がダイエットに何十回も失敗して自分軸ダイエットにたどり着いたように、りせさんのメソッドも、りせさんがたくさんの時間とお金を使った経験を含めて今のものになっていると思うんです。そこをショートカットできると考えたら、すごくありがたいなと感じました。"], [1877, "りせ", "独学でできないことは、極論ないと思うんです。でもその代わりに、すごく時間がかかる。子どもが生まれてからなおさら思うんですが、回り道をしている時間がなさすぎるんです。自己探求して失敗して…を楽しめる時間があったのは学生までだったなと。そこに時間をかけていると、子どもとの時間も足りなくなるし、やりたいことが叶うのも遅くなる。あっという間に時間が過ぎてしまいます。"], [1927, "白井", "お金は稼げば戻ってくるけど、時間は取り返せないですもんね。だから、お金をかけて何かを学んでショートカットする、家事代行を使って自分の時間を浮かせて別のことをする、そういう時間を生み出すための使い方がすごく大事だと思います。"], [1983, "りせ", "（コメントを受けて）「ダイエット目的で入ったのに、楽しんでいるうちに次々に夢が叶いました」「行動力が爆上がりしました」。ゆりかさんがこういうお話をしているから、行動力が上がるんでしょうね。行動すると運が良くなる、と言いますけど、本当にそうだなとずっと思っています。行動しないと停滞して、するようになると、なぜか何事も動き始める。"], [2052, "白井", "失敗が怖くて動けないのは、すごくもったいないと思っていて。株で損したくない、学ぶのにお金を払って成功しなかったらどうしよう、と思う方もいると思うんですけど、それをやらなかったら結局ゼロですよね。ダイエットに関しては、やらなかったら代謝が落ちていくのでマイナスなんです。年齢とともに代謝は下がっていくので、食生活やストレスの管理で維持したり底上げしたりしないと、太りやすい体になっていく。40代、50代になった時に差が出るのは、そこだと感じます。"], [2120, "りせ", "投資も、インフレで資産の価値が下がっていくと考えると同じかもしれないですね。最初に努力すると後が楽、というのも本当にそう。いろんな人を見て、パッと成功したように見えるかもしれないけど、結局最初に時間やお金を投資した時期があったから今がある。最初からやっておくことの大切さは本当にあると思います。"], [2185, "りせ", "不思議なんですけど、26歳を過ぎてから投資を始めた人は、全員「もっと早く始めればよかった」と言うんです。22〜25歳くらいだと、自分のことを早いと思うみたい。だから今30代、40代、50代、60代の方も、皆さん同じように思っているので、ご安心ください。"], [2256, "白井", "りせさんが資産づくりにおいて大事にしているマインドセットも聞いてみたいです。"], [2268, "りせ", "ゆりかさんにも近いと思うんですけど、何があっても前向きでいることですね。もちろん自分なりに反省会はするんです。でも、さっきの喉の話のように、起きたことは全部次に生かす。それに、投資は基本的に、株が上がる、世の中が最終的に良くなる、という前向きな気持ちでやるもの。怖い気持ちはあって当然だし、それはいいことなんですけど、経験の中で乗り越えて、企業や世界の未来をポジティブに捉えていく。前向きさが最終的には一番大事だと思っています。"], [2352, "りせ", "私も先輩投資家に「どうせ最後にはうまくいく、と思い続けて」と言われたんです。最初は半信半疑で、正直その頃は自分軸で生きられていなかったので「そんなこと言われても」と思っていました。でも、どうにか自分を奮い立たせて、どうせ最後にはうまくいく、と思って積み重ねていたら、本当に超えられたんです。うまくいっている投資家で、すごくネガティブな人は基本的にいないですね。"], [2440, "りせ", "前向きといっても、無理に明るくなれ、ということではないんです。起きたことを捉えて、次に生かそうと思い続けられるかどうか。"], [2471, "白井", "この間、大きく下がった日がありましたよね。昔だったら「もうおしまいだ」と思っていたと思うんですけど、自分の軸を持って、知識をつけて、前向きな視点をマインドセットとして持っているだけで、全然うろたえなかった。「じゃあどうしよう」と考えられるようになっていて、すごく大事だなと思いました。"], [2513, "りせ", "ああいう時は、その後数日で大きく戻ることもありますよね。そういう場面はみんなに平等に訪れるので、対処のしかたを知っているか、前向きに捉えられるか、前向きに戻れる場所があるかが、本当に大切だと思います。"], [2550, "白井", "ハナミラは横のつながりもあったのがよかったです。私は1人でこそこそ勉強できないタイプで、みんなで勉強したいタイプだったので。"], [2599, "白井", "今たくさんコメントをくださっている自分軸ダイエットの皆さんもそうなんですけど、横のつながりって女性にとってすごく大事だと思うんです。ハナミラは講座の中でグループディスカッションがあったり、一緒に銘柄を調べたりしますよね。ああいうのは、普段のリアルの友達とはやりにくいじゃないですか。お金の知識は人によって差があるし、お金の話が気軽にできる関係かどうかもある。でもハナミラは投資をするためのコミュニティなので、投資の話が飛び交うのが当たり前。それが気軽に話せる関係性が、すごくいいなと思いました。"], [2660, "りせ", "私は外でも言っちゃうタイプだったんですけど、嫌な顔をする人と、面白がって聞いてくれる人に二極化するんですよね。だから、当たり前に話せる場所はすごく大事だと思います。"], [2696, "白井", "女性って、一緒にワイワイ盛り上がったり、みんなで高め合いたい、という感じがいいですよね。男性からは「そんな素敵な人ばかり集まるところがあるんですね」と言われました。"], [2729, "りせ", "男性は、自分だけの手柄にしたい、言いたくない、というのがあるみたいですね。女性は「これいいよ」とみんなで分け合う。そこが違うところで、楽しいところかなと。受講生さんたちが株の利益で一緒に旅行に行ったりもしています。それに、ゆりかさんのネックレスのように、「投資でそんなことができるようになるんだ」と聞いたら「私もやりたい」と思う人が出てくる。うまくいっている人たちがいる環境に入るのは、すごく大切だと思います。"], [2797, "白井", "ダイエットも、人前で「ダイエットしてます」と言える人と言えない人がいると思うんですけど、みんながしている環境なら言いやすいし共有しやすい。仲間の存在で高め合えるのは大事ですよね。"], [2818, "りせ", "視聴者の皆さんで、ダイエットしたいけど自分だと続けられない、楽しくない、と思っていた方は、ぜひゆりかさんをフォローして、門を叩いてみてください。"], [2844, "白井", "私もりせさんみたいに、資産億超えになりたいです。この間、都内に家を買ったとおっしゃっていましたよね。マイホームとして買っているのがかっこいいなと思って。"], [2880, "りせ", "不動産投資に回せばいいのに、という声も聞こえてきそうなんですけど（笑）、子どもが生まれたのがきっかけになりました。夫と2人だけなら、どこでも生きていける。でも私は初めましての人間関係がすごく苦手で、今のママ友との関係がなくなるのは、子どもにとっても自分にとっても大きな損失だと思ったんです。環境を買うと思ったら、それでいいと思えたんです。"], [2960, "白井", "それこそ自分軸ですよね。周りにそういう人がいないので、新しい目標を見せてもらいました。"], [2983, "りせ", "嬉しいです。ハナミラの受講生さんたちからも、こんな家を買いました、という報告があるといいなと思います。旦那さんに車をプレゼントした受講生さんもいて、夢が広がっていますよね。受講生さんたちが成果を出してくれるからこそ、ハナミラも広がっていると思うので、本当に皆さんの努力に感謝です。"], [3030, "りせ", "12月1日から、3daysプログラムを開催します。ゆりかさんが話してくださったような、自分の軸を作って「こういう銘柄がいい、こういうところで買おう」という考え方をお伝えする3日間です。オープンチャットでは、開催までの間にライブのお知らせやワーク、プレゼントが届いたり、投資でこんなことができるんだ、と自分の制限を突破していける、投資を始める準備の場所になっています。"], [3090, "りせ", "今日のライブの感想をアウトプットしていただいた方の中から、抽選でパレスホテルの紅茶をプレゼントします。すごく美味しいので、ぜひゆりかさんのお話の感想を書いてください。ゆりかさん、最後に、自分の夢を叶えていく女性たちに一言お願いします。"], [3129, "白井", "皆さん、今日はありがとうございました。皆さんの夢は青天井で、自分に制限をかける必要はなくて、わがままかなと思うくらい、自分の理想をどんどん出して、叶えて、を繰り返していいんです。私はそれがあったからこそ、ダイエットも、ディズニーで結婚式を挙げることも、海外のディズニーやクルーズに行くことも、ネックレスを買うことも、わがままじゃなくて全部叶えたくて叶えてきました。いつも周りのために頑張っている皆さんだからこそ、自分のためにも、人のためにも、全力で夢を叶えに行ってほしいと思います。一緒に叶えていきましょう。"], [3198, "りせ", "素敵なメッセージをありがとうございました。皆さんもぜひ、ゆりかさんに続いてください。"], [3214, "りせ", "ゆりかさんのお話、めちゃめちゃ面白かったですね。ハッピーオーラが素晴らしかったです。ダイエットといえばゆりかさんなので、ぜひ門を叩いてみてください。3daysプログラムは12月1日から。ゆりかさんが株の利益でネックレスを買えるようになるまでに至った投資の考え方やマインドの持ち方、銘柄の選び方、株を買うタイミング、そして今AIをどう使って効率よく投資しているかまで、まるっとお話しする特別な3日間です。"], [3310, "りせ", "今日の感想を書いていただくと、特典が全員に届くのと、パレスホテルの紅茶の抽選もあります。次回は16日。15冊も本を書いている著者のジョン・キムさんとのコラボです。実は私の大学時代のゼミの教授で、ご自身も資産運用をされています。「超一流のマネーマインド」というテーマでお話しするので、楽しみにしていてください。会えない期間も、オープンチャットで投資の知識をアップデートできる企画を考えています。今日も見てくださってありがとうございました。"]], "guestName": "白井ゆりかさん", "guestRole": "自分軸ダイエット主宰／『自己肯定感ダイエット』著者／ハナミラ受講生"}, {"id": "1116", "vid": "KrMALqn4UfE", "date": "11/16（月）", "type": "コラボライブ", "guest": "ジョン・キムさん（作家・りせさんの大学時代の恩師）", "guestName": "ジョン・キムさん", "guestRole": "作家／りせさんの大学時代のゼミの先生", "title": "超一流のマネーマインド「お金のために働く人・お金に働いてもらう人」", "duration": "約76分", "message": "お金の不安の正体は「知らないこと」。学んで、価格ではなく価値で選び、今年のうちに「お金に働いてもらう」一歩を。長く続ければ、複利が人生の味方になる。", "slides": [{"t": 130, "h": "ゲスト：ジョン・キムさん", "p": "慶應義塾大学で教えていた頃の、りせさんのゼミの先生。たくさんの著書で、多くの女性の生き方を変えてきた方です。普段はほとんど話さない「お金」をテーマに、本音で語ってくれました。", "li": ["お金のマインドが変わると、人生が丸ごと変わる", "一歩お金に近づけば、お金は二歩近づいてくる"]}, {"t": 470, "h": "お金の不安の正体は「知らないこと」", "p": "ジョンさんも子どもの頃からお金の不安を抱え、向き合うのが怖くて目をそらしてきたそう。不安だったのは、お金があるかないかではなく、お金の正体が分からなかったから。", "li": ["お金の仕組みは、家でも学校でも誰も教えてくれない", "知らないから不安が膨らみ、親から子へ連鎖する", "一度分かると、大切な人にも伝えられるようになる"], "key": "学び始めた瞬間、お金は不安のもとから「自由の翼」に変わる"}, {"t": 829, "h": "人生を分けるキーワード「複利」", "p": "複利とは、最初は頑張ってもなかなか増えないけれど、続けているとある時から雪だるま式に大きくなること。お金だけでなく、仕事も人間関係も同じ。", "li": ["最初は変化が見えなくても、やめずに続ける", "ある瞬間から一気に伸びる", "難しい数学ではなく、子どもでも分かる考え方"]}, {"t": 1053, "h": "長い目で見る力と「待つ力」", "p": "目先で得をしようとする人は、長い目で見ると得をしない。大切だと思うことを信じて続け、結果が出るまで待てる人に、複利は味方してくれます。", "li": ["すぐに結果を求めない", "少なくとも数年、できれば十年単位の気持ちで", "長く続けたことほど、後で大きく返ってくる"]}, {"t": 1162, "h": "「価格」ではなく「価値」を見る", "p": "豊かに生きている人は、安いから買う・高いから諦める、をしない。まず「自分にとってどれだけの価値があるか」を考えてから値札を見る。", "li": ["例：安すぎる宿で体調を崩したら、損のほうが大きい", "同じタクシー代でも、疲れている日は価値が違う", "「コスパで得をする」発想を手放す"], "key": "人生は、価値を最大にしていく旅"}, {"t": 1509, "h": "お金は「もう一人の自分」", "p": "自分の体だけで稼いでいると、体調を崩したら収入が止まってしまう。お金に働いてもらえば、寝ている間も入院している間も働き続けてくれます。", "li": ["少額からでいいので、今年のうちに「お金に働いてもらう」体験を", "いつか、お金が稼ぐ額が自分の稼ぐ額を超える日をつくる", "そうなれば、本当に大切な仕事にだけ時間を使える"]}, {"t": 2211, "h": "ジョンさんが大切にしている投資の原則", "p": "お金の名著を読み込んで見えてきた、始めるときの基本です。", "li": ["長い期間で持つ", "分散させる", "生活費や借りたお金ではなく、余裕資金でやる", "手数料の安いものを選ぶ", "コツコツ積み立てる／NISAを使う"], "key": "銀行に置いたままのお金は、物価が上がるぶん目減りしていく"}, {"t": 2736, "h": "女性こそ投資をしたほうがいい理由", "p": "ジョンさんが「男性より女性が絶対に始めるべき」と話した理由です。", "li": ["人生が長いぶん、必要なお金も多い", "出産・育児・介護で、仕事や収入が途切れやすい", "自分名義のお金があると、心の自立と自信につながる", "お金に働いてもらうお母さんの姿が、子どもへの一番の教育"]}, {"t": 3059, "h": "AI時代に子どもに必要な、たった一つの力", "p": "それは「自分の意思を、自分の言葉で、はっきり伝える力」。AIもお金も、こちらが指示を出して初めて働いてくれるからです。", "li": ["子どもの話をよく聞いて、質問してあげる", "「もっと正確に言うとどんな感じ？」と言葉を育てる", "お金とAI、二つの「分身」を使いこなせる人に"]}, {"t": 3440, "h": "投資は「心の修行」", "p": "株価は上がったり下がったりして、心が揺れます。でも下がる日が来ることを最初から想定しておけば、慌てずにいられる。", "li": ["長い目で見て「最後にはうまくいく」と信じる", "目先の上下には、あえて鈍感でいる", "余裕ができると判断力が上がり、人にも優しくなれる"], "key": "投資を始めると、世界の見え方も、毎日の楽しさも変わる"}, {"t": 3913, "h": "りせさんのまとめ", "p": "ジョンさんと同じく、長く・分けて・積み立てる投資はりせさんも実践中。そこに株式投資を加えることで、お金が増えるスピードを上げてきました。", "li": ["積み立ては、やらない理由がない投資", "株式投資ができると、自由に近づくスピードが上がる", "明日いきなり変わるのではなく、1〜2年続けるうちに変わっていく"]}], "transcript": [[1, "りせ", "皆さん、こんばんは。世界一分かりやすい株のはじめ方3daysプログラム主催の松下りせです。日本最大級の女性向け投資スクール「ハナミラ」を経営していて、私自身、未経験から株で資産を増やしてきました。12月1日から、そのノウハウをまるっとお伝えするプログラムを開催します。このライブは、その開催を記念して素晴らしい方々と対談し、皆さんのお金や投資のマインド、知識、考え方をアップデートしていく企画です。"], [85, "りせ", "対談ライブも折り返しになりました。今日は特にスペシャルな回で、私自身すごく楽しみにしていました。テーマは「超一流のマネーマインド ── お金のために働く人、お金に働いてもらう人、その違い」。皆さんのお金のマインドをまるっとアップデートする回です。"], [130, "りせ", "今日のお相手は、ジョン・キムさんです。国費留学で日本に来られて、ハーバード大学やオックスフォード大学で研究をされ、その後、慶應義塾大学で10年間教えていらっしゃいました。その時の私は、ジョンさんのゼミ生なんです。19歳の時にご縁をいただいて、今こうして対談させていただけることになりました。たくさんの女性のマインドや生き方を変えてきた方ですが、今回はお金をテーマにお話を伺う、本当にスペシャルな回です。"], [238, "りせ", "ジョンさん、少し前まで海外にいらっしゃったお忙しい中、ありがとうございます。ジョンさんの元々のファンの方も、今日はお金がテーマということで楽しみにされていると思います。改めて自己紹介をお願いできますか？"], [292, "ジョン", "りせさんとまたご縁をいただいて、こうしてライブができるのは、人生は面白いなと思います。あの頃のゼミの教室で、こんな未来が待っているとは想像がつかなかった。人生は出会いで作られていくのだと思います。今日初めてご縁をいただく皆さんもたくさんいらっしゃると思いますが、りせさんと僕の2人で、とにかく愛を込めて、皆さんの未来と人生へのエールを込めてお話しします。"], [341, "ジョン", "これからお金の話をたくさんすると思いますが、見てくださっている方のほとんどは、僕も含めて、お金に苦しめられた歴史があると思います。でも、皆さんがお金の世界に一歩近づくと、お金は二歩近づいてきて、二人三脚で未来を生きることができるようになる。僕はお金の話はほぼ一切しないんです。敏感な問題なので。でも今日は皆さんがお金の話を聞きたいと思って来られているので、本音でお話しします。お金に対するマインドが変わると、人生は完全に変わります。収入や預金が増えるかどうかの問題ではなく、未来が変わるんです。"], [455, "りせ", "ジョンさんは、過去にお金のことで悩んだことはありましたか？"], [470, "ジョン", "ないわけがないです。お金への不安や恐れが深すぎると、お金について心配すること自体を意識しなくなるんです。無意識の中に深く染みついてしまうから、お金と向き合うことができないまま、何年、何十年と経ってしまう。お金はそれくらい、良くも悪くもパワーが強いんです。僕も例外ではなく、子どもの頃から新聞配達をしながら1人で生きてきたので、お金の不安がなかった記憶はほぼありません。でも、向き合った記憶もない。向き合うと、あまりにも怖すぎるから。"], [549, "ジョン", "そんな僕が、ある時期からお金の不安と心配から一切解放されました。不安の本当の正体は、お金があるかないかではなく、お金の正体が分からなかったこと。それが、お金を怪物にしていた原因でした。ほとんどの方は、お金の原理や、お金が巡る仕組みについての知識がない。知らないことから来る不安が、私たちを縛りつけてきたんです。だからポイントは、知らない状態から抜け出すために一歩踏み出すこと。それだけで、お金は不安の源ではなく、自由の翼になる。人生の味方になると断言できます。"], [613, "ジョン", "それほど大事なのに、誰も教えてくれないんです。10数年ぶりにりせさんと再会して、お金について教えることに携わっていると聞いて、本当に素晴らしいと思いました。本当は家庭の中で行われるのがベストなんですが、多くの家ではお金について教えてくれない。お金持ちの家は教えるんですけどね。会社員の家庭だと、親が未来に不安を抱えていることが、子どもながらに分かる。そうするとお金への怖さが先に立って、知りたいと思うこと自体が起きない。知らないことが連鎖して、不安を膨らませたまま人生を終えてしまうこともあると思います。"], [688, "ジョン", "今日、皆さんがお金の不安の正体を理解して、それを断ち切ることができたら、皆さんの代だけでなく、お子さんやパートナーも含めて、みんなのお金のマインドが変わります。お金は一度理解できると、全てが見えるようになる。見えた人は、見えない人に伝えることができるんです。だから皆さん1人が変わることで、周りの大切な人が光を見ることができるようになる。人生の悩みは、人間関係、パートナーシップ、家族、そして実はお金の問題が一番大きかったりします。そこから解放される最初の一歩のきっかけを、今日りせさんと僕で作れたらと思います。"], [794, "りせ", "向き合うのが怖い、というお話は生々しくて、涙が出そうになりました。今それを抱えている人は、どうしたらいいですか？"], [829, "ジョン", "身につけてほしい習慣がいくつかあります。まず、お金について学ぶことを始めてほしい。本からでもいいし、りせさんのようなスクールからでもいい。学ぶ中で、僕が一番重要なキーワードだと思うのが「複利」です。人生は、複利を理解している人と、していない人に分かれるんです。複利という言葉はほとんどの方が聞いたことがあると思いますが、本当に理解できている人はごくわずか。理解できている人は、人生で必ず成功しています。複利はお金の世界だけの話ではなく、仕事も人間関係も、世の中の大切なことは全て複利でできあがっているんです。"], [902, "ジョン", "複利は、専門用語では「お金につく利子がさらに利子を生んでいく」ことですが、つまり、最初は頑張ってもなかなか上がらない、ということなんです。でもそれを積み重ねて、続けていくと、ある時いきなり上がっていく。仕事もそうです。英語でも何でも、新しいことを頑張る時、最初は成長が見えないのに、ある瞬間から一気に上がる。お金も同じで、始めてすぐにたくさん増えることはないけれど、続けていくうちに、ある時から雪だるまになっていくんです。"], [986, "ジョン", "複利は少し数学っぽく聞こえるので苦手だと思う方もいるかもしれませんが、説明すれば小学生でも理解できます。その真実を理解して、人生のあらゆるところで実践していくと、ある時に爆発的に人生を押し上げてくれる。複利は魔法なんです。アインシュタインも、複利を世界の不思議と呼んだと言われています。"], [1053, "ジョン", "分かりやすい言葉で言うと、僕の周りの成功している人たちの共通点は「長期視点」です。短期的に得をしようとする人間は、長期的に得をしない。短期的に損をしても、自分が大切だと思うことを信じて続けると、仕事も人間関係もパートナーシップも子育ても、もちろんお金もうまくいく。

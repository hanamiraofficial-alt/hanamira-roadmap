<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>特別対談ライブ アーカイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#2B3A5C;--deep:#1E2A44;--coral:#F0647A;--gold:#E9C46A;--gray:#9AA0A6;--paper:#F7F5F2;--line:#E7E2DD;--sub:#6B7385;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:"Noto Sans JP",sans-serif;color:var(--navy);background:var(--paper);line-height:1.8;font-size:16px}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* hero (dark) */
.hero{background:radial-gradient(120% 90% at 85% 0%,#3B4D78 0%,var(--deep) 60%);color:#fff;padding:30px 0 26px}
.hero .lab{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--gold)}
.hero .lab::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 4px rgba(240,100,122,.25)}
.hero h1{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:30px;line-height:1.35;margin:10px 0 8px}
.hero p{font-size:14px;color:#D4DAE6}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.thumb{display:block;text-decoration:none;color:#fff}
.thumb .img{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#33415f center/cover no-repeat;border:1px solid rgba(255,255,255,.15)}
.thumb .img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55))}
.thumb .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:rgba(240,100,122,.95);display:grid;place-items:center;z-index:1}
.thumb .play svg{width:12px;height:12px;margin-left:2px}
.thumb .nm{font-size:12px;font-weight:700;margin-top:6px;line-height:1.4}
.thumb .dt{font-size:11px;color:#AEB7C9}
.thumb.soon .img{display:grid;place-items:center;font-size:11px;color:#AEB7C9}
.thumb.soon .img::after{display:none}

/* live block */
.live{padding:34px 0 10px;border-bottom:1px solid var(--line)}
.live:last-of-type{border-bottom:0}
.who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.date{font-size:12px;font-weight:700;color:#fff;background:var(--navy);border-radius:999px;padding:1px 10px}
.gname{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:24px;line-height:1.3}
.grole{font-size:13px;color:var(--sub);width:100%}
.player{position:relative;aspect-ratio:16/9;margin-top:12px;border-radius:var(--r);overflow:hidden;background:#1E2A44 center/cover no-repeat;box-shadow:0 10px 30px -12px rgba(30,42,68,.45);cursor:pointer}
.player::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.6))}
.player .big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;width:72px;height:72px;border-radius:50%;background:var(--coral);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(240,100,122,.25);transition:transform .15s}
.player:hover .big{transform:translate(-50%,-50%) scale(1.06)}
.player .big svg{width:28px;height:28px;margin-left:4px;color:#fff}
.player .cap{position:absolute;left:16px;right:16px;bottom:12px;z-index:1;color:#fff;font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.player.on{cursor:default}
.player.on::after{display:none}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytlink{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--sub)}
.title{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:20px;line-height:1.5;margin:14px 0 0}

.msg{margin:16px 0 4px;background:#fff;border-left:6px solid var(--coral);border-radius:12px;padding:16px 18px;box-shadow:0 1px 0 var(--line)}
.msg .l{font-size:12px;font-weight:700;color:var(--coral);letter-spacing:.06em}
.msg p{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:18px;line-height:1.65;margin-top:4px}

.sh{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin:22px 0 10px}
.sh::after{content:"";flex:1;height:1px;background:var(--line)}
.pts{list-style:none;counter-reset:p;display:grid;gap:10px}
.pt{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px 52px;position:relative}
.pt::before{counter-increment:p;content:counter(p);position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.pt h3{font-size:16px;line-height:1.5}
.pt p{font-size:14px;margin-top:4px;color:#3D4A66}
.pt ul{margin:6px 0 0 1.1em;font-size:14px;color:#3D4A66}
.pt li{margin:2px 0}
.pt .key{margin-top:8px;font-size:14px;font-weight:700;color:var(--coral)}
.pt .key::before{content:"▶ "}
.seek{appearance:none;border:0;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--navy);margin-top:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:0;text-decoration:underline;text-underline-offset:3px}
.seek .tm{font-variant-numeric:tabular-nums;color:var(--coral);text-decoration:none}
.pts.fold .pt:nth-child(n+4){display:none}
.more{appearance:none;width:100%;margin-top:10px;border:1.5px dashed #CFC8C2;background:transparent;border-radius:12px;padding:10px;font:inherit;font-weight:700;font-size:14px;color:var(--navy);cursor:pointer}

details.tx{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:14px}
details.tx summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
details.tx summary::-webkit-details-marker{display:none}
details.tx summary::after{content:"＋";color:var(--coral);font-size:18px}
details.tx[open] summary::after{content:"－"}
.txb{padding:0 16px 8px;border-top:1px solid var(--line)}
.para{padding:12px 0;border-bottom:1px solid #F0ECE8}
.para:last-child{border-bottom:0}
.pm{display:flex;gap:8px;align-items:center;margin-bottom:2px}
.pm button{appearance:none;border:0;background:none;padding:0;font:inherit;font-size:12px;font-weight:700;color:var(--coral);cursor:pointer;font-variant-numeric:tabular-nums}
.sp{font-size:11px;font-weight:700;border-radius:6px;padding:0 7px;background:var(--navy);color:#fff}
.sp.g{background:#E9ECF2;color:var(--navy)}
.para p{font-size:15px;line-height:1.9}
.note{font-size:12px;color:var(--sub);margin-top:6px}

.soonbox{margin-top:12px;background:#fff;border:1.5px dashed #CFC8C2;border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--sub);font-size:14px}
.soonbox strong{display:block;color:var(--navy);font-size:16px;margin-bottom:4px}
.foot{font-size:12px;color:var(--gray);text-align:center;padding:26px 0 40px;line-height:1.7}
.totop{display:block;text-align:right;font-size:12px;color:var(--sub);margin-top:14px;text-decoration:none}
@media (min-width:600px){.hero h1{font-size:36px}.gname{font-size:28px}}
</style>
</head>
<body>
<header class="hero" id="top">
  <div class="wrap">
    <div class="lab">SPECIAL TALK ARCHIVE</div>
    <h1>特別対談ライブ<br>アーカイブ</h1>
    <p>見逃した対談も、ここから見られます。気になるゲストをタップしてどうぞ。</p>
    <nav class="thumbs" id="thumbs"></nav>
  </div>
</header>
<main class="wrap" id="lives"></main>
<p class="foot">文字起こしはライブの自動字幕をもとに、読みやすく整えています。<br>コメント紹介などは一部短くしています。</p>

<script>
const LIVES = [{"id": "1112", "vid": "srvyBa0ZT8g", "date": "11/12（木）", "type": "コラボライブ", "guest": "白井ゆりかさん（自分軸ダイエット主宰）", "title": "資産も夢も思い通り「自分軸マインド」の育て方", "duration": "約57分", "message": "自分に合う方法を自分で選ぶ「自分軸」があると、選んだ道を正解にしていける。完璧じゃなくていいから行動して、前向きな仲間と続けよう。", "slides": [{"t": 185, "h": "ゲスト：白井ゆりかさん", "p": "女性が自分らしく心も体も健康に輝けるように、と「自分軸ダイエット」講座を主宰。著書は『自己肯定感ダイエット』。実はハナミラの受講生でもあります。", "li": ["今日のテーマは「自分軸」", "ダイエットも投資も、うまくいく理由は同じ？"]}, {"t": 217, "h": "自分軸があると「選んだ道を正解にできる」", "p": "自分の判断に自信が持てるから、選んだことを正解にしながら前へ進める。逆に、人がいいと言う方法を片っ端から試すと…", "li": ["自分に合わない方法を無理に続けてしまう", "うまくいかないたびに自信を失う", "「できない自分」が強くなっていく"], "key": "自分に合うものは、最後は自分にしか分からない"}, {"t": 542, "h": "ゆりかさんのターニングポイント", "p": "無理な食事制限を続けて体調を崩し、声が出なくなって10日間の療養に。「痩せる」ではなく「自分の心と体を大切にする」に考えを切りかえました。", "li": ["他人の目ではなく、自分が健康になるための食生活を選ぶ", "結果的に体が軽くなり、気持ちも前向きに", "この経験を伝えようと起業"]}, {"t": 775, "h": "ネットの「〇〇株が買い」ではうまくいかない", "p": "書き込みは、その瞬間の一人の判断を切り取ったもの。書いた人も、次の情報で考えが変わっていることがよくあります。", "li": ["自分で決めていないと、売るタイミングが分からなくなる", "たまたま当たることはあっても、続けてうまくはいかない", "自分で「ハンドルを握っている」感覚が大切"]}, {"t": 938, "h": "「魚をもらう」から「釣り方を学ぶ」へ", "p": "ゆりかさんは以前、すすめられるままに株を買っていて、下がった株をどうしたらいいか分からなくなった経験も。ハナミラで自分の判断基準を持てたのが大きかったそう。", "li": ["自分で選べると、投資が面白くなる", "面白いから、勉強が苦にならない", "もちろん今も100%当たるわけではない"]}, {"t": 1289, "h": "増やしたお金で「何をしたいか」", "p": "数字が増えることにワクワクする人もいれば、そうでない人もいる。旅行、ジュエリー、家族のための車…叶えたいことがあると続けやすい。", "li": ["ゆりかさんは株の利益で、念願のネックレスを購入", "りせさん「お金は、何かに変えたときに一番実感が湧く」", "どちらも選べる「選択肢」があることが幸せ"]}, {"t": 1701, "h": "自分軸をつくるのは「完璧を求めない行動」", "p": "絶対に成功する行動なんてない。見えている成功の裏には、うまくいかなかった挑戦がたくさんあります。", "li": ["失敗を恐れず、行動して経験を積む", "専門家に学ぶと、先人の失敗をショートカットできる", "お金は取り戻せても、時間は取り戻せない"], "key": "やらなければ何も変わらない"}, {"t": 2256, "h": "「どうせ最後にはうまくいく」と前向きに", "p": "りせさんが資産づくりで一番大事にしているのは、何があっても前向きでいること。投資は、企業や世の中の未来が良くなると信じて行うものだから。", "li": ["起きたことは、全部次に生かす", "前向き＝無理に明るくなることではない", "大きく下がった日も、自分の軸と知識があればうろたえない"]}, {"t": 2599, "h": "仲間がいる環境に入る", "p": "投資の話は、普段の友達とはなかなかしにくいもの。投資の話が当たり前にできる場所があると、続けやすく、高め合えます。", "li": ["一緒に銘柄を調べる、話し合う", "うまくいっている人を見て「私も」と思える", "女性は、みんなで高め合うのが得意"]}, {"t": 3129, "h": "ゆりかさんからのメッセージ", "p": "夢は青天井。わがままかなと思うくらい、理想をどんどん出して、叶えてを繰り返していい。", "li": ["いつも周りのために頑張っている人こそ", "自分のためにも、全力で夢を叶えにいってほしい"], "key": "一緒に叶えていきましょう"}], "transcript": [[0, "りせ", "皆さん、こんばんは。「AI時代の女子流株のはじめ方3daysプログラム」を記念した連続ライブ「超一流のお金の哲学」をお届けしています。開始が遅れて申し訳ありませんでした。赤ちゃんの寝かしつけで少し時間がかかってしまいました。今日はパレスホテルから配信しています。"], [63, "りせ", "今日はお待ちかねのコラボライブです。このライブを見てくださった方には、パレスホテルのお土産が当たる抽選会もします。今日のゲストは、自分の軸をしっかり定めることで、ご自身も、数々の女性たちもダイエットを成功させてきて、今はその方法を使って起業もお伝えしている素敵な女性です。実はハナミラも受講してくださっていたので、そのあたりもお話ししていきます。"], [144, "りせ", "では、白井ゆりかさんです。よろしくお願いします。今日初めての方も多いと思うので、まず自己紹介をお願いします。"], [185, "白井", "白井ゆりかです。私は「自分軸ダイエット」というダイエット講座を主宰しています。美容やダイエットで悩まれている女性が、自分らしく心も体も健康に輝けるように、ということを理念に講座を運営しています。後ろにある『自己肯定感ダイエット』という本も発売中です。"], [217, "りせ", "ゆりかさんは自己肯定感や自分軸をすごく大切にされていると思うんですが、ズバリ、それができるとなぜ何事もうまくいったり、夢が叶ったりすると思いますか？"], [238, "白井", "ズバリ、自分の軸を持って、自分の決断に自信を持てるようになるからです。選んだところを全部正解にするというか、選んだものが正解になる。そうやって物事をどんどん前に進めていけるから、というのが大きいと感じています。"], [273, "りせ", "「選んだことを正解にする」ってよく聞きますけど、言うは易し、と思う人もいると思うんです。詳しく聞かせてください。"], [293, "白井", "株式投資も全部一緒だと思うんですけど、私たちは常に、誰かに言われたことや世間で言われていることに合わせて生きてきている部分があると思うんです。それは過去には通用していたかもしれないけど、ある時通用しなくなる時が来る。「これで本当にいいのかな」「これが自分の望んだ人生だったのかな」と思う瞬間が来る人は結構いると思います。"], [323, "白井", "私も20代前半の頃にそれをすごく感じました。世間で言われているダイエットにたくさん挑戦して、痩せてはリバウンドを繰り返していたんです。なぜ繰り返していたかを考えたら、自分に合わない方法を無理してやっていたから。自分の軸がなかったんです。周りがいいと言うものを片っ端から取り入れていたけど、合わないことをやってうまくいかないと、そのたびに自信を失っていく。できない自分が強化されてしまうんです。"], [382, "白井", "そこから、自分に合うものは何だろうと経験から学んで生かしていったら、ダイエットもできるようになったし、仕事も起業も、それこそハナミラに入って株に関しても、恋愛や結婚に関しても叶えられるようになりました。自分に合うものって、結局自分にしか分からないんですよね。"], [435, "白井", "りせさんも、印象的なターニングポイントはありましたか？"], [450, "りせ", "私は投資に関しては、前から一貫していてあまりぶれないんです。最初に身につけたやり方を貫いてきたタイプで、いろいろやってみても、結局それが一番利益が出る。一方で、会社のことは、受講生さんや関わってくださる方が増えて考えることが広がっていくので、変化しながらも「やっぱりこっちだな」と戻ることはありますね。"], [506, "白井", "関わる人が増えると判断する材料も増えるので、考えることも増えますよね。"], [521, "りせ", "ゆりかさんが、自分軸が大事だと思うに至ったきっかけはありましたか？"], [542, "白井", "ターニングポイントは、声帯ポリープという、声が出なくなる病気になったことです。25歳の誕生日でした。制限ダイエットやサプリメント、過度な食事制限など、手当たり次第試していたら体調を崩して、それをこじらせてしまったんです。当時は理学療法士で、患者さんと毎日話す仕事だったので、話せないと仕事にならない。お医者さんに「10日間一切仕事も会話もしないでください、これ以上悪化したら手術です」と言われて、実家で療養しました。"], [617, "白井", "それまでは、ダイエットといえば食事制限やカロリー制限、運動だと思っていたんですけど、全部できなくなった。それで、痩せるとかではなく、自分の心と体を大切にしようと思ったんです。自分の心と体を全く見てこなかったなと。自分が続けやすいことは何か、健康のためにできることは何か、自分を大切にするならどんな食生活をするのか、という視点に変わりました。"], [661, "白井", "結局「痩せる」って、他人の目を気にしているわけですよね。そうではなく、自分が健康になるためにはどうしたらいいか、という自分軸で食生活を選んでいったら、痩せようと思っていたわけではないのに、どんどん体が軽くなったんです。あんなに頑張っていたのは何だったんだろう、と。体調不良も軒並み治って、メンタルも前向きになって、何事もいい方向に行って。これを伝えようと思って起業しました。あの療養期間があってよかったと、すごく感じています。"], [733, "りせ", "今それを「あれがあったから」と言えるのも、自分軸で生きているからですよね。自分で決めた道を行ったり、合うものをちゃんと選んでやっていくと、いろんなことが幸せに進みますよね。"], [775, "白井", "本当にその通りだと思います。株も、ネット上に「何々の株が今買いです」とたくさん上がっていますよね。ああいうのを見て選んでもうまくいかないだろうし、実際うまくいかなかったんです。軸がない状態で選んでいるから、自分でハンドルを握っている感じがない。何を基準に投資するのか、という軸もすごく大事なのは通じますよね。"], [815, "りせ", "ネットの書き込みは本当にそうで、書き込む側に立って考えるとよく分かるんです。その人なりの投資判断で、その瞬間はいいと本気で思って書いていても、次の情報と照らし合わせると「違うな」となることが、自分で投資していても結構あるんです。書き込みは一つの切り取りでしかなくて、その後その人がどう考えたかまでは分かりません。"], [869, "りせ", "それに、自分でいい投資をしている時ほど、「いいと思うけど、こういうリスクもあるよな」と考えながらやっているんです。いいと思っている会社でも、100点満点じゃないことは分かっている。それを他の人が同じレベルで受け止められるかは別の話で、まさに合う・合わないです。だから書き込みをうのみにするとうまくいかない。ラッキーパンチでうまくいくことはあっても、続けてうまくいくことは、まずないと思います。"], [938, "白井", "私がハナミラを受講させていただいたのは今年の春頃ですが、受講前後ですごく変わったと思うのは、自分で投資の軸、判断基準を持てたことです。投資自体は5年くらい前からやっていたんです。以前の夫が投資好きなタイプで、判断基準も知らずに「この株を買っておけばいいよ」と言われて買っていました。実際に増えたものもあったんですけど、売るタイミングが分からなくて、買ったまま下がったものもあったんです。"], [1008, "りせ", "自分で決めていないと、売るタイミングが難しくなるんですよね。"], [1029, "白井", "そうなんです。これは「魚を取ってもらうんじゃなくて、釣り方を自分で勉強しないといけない」と同じだと感じて。判断基準を持てるようになったのが大きかったです。もちろん今も100%当てられるわけではないですけど、すごく面白くなりました。面白くなると、もっと勉強しようとなるし、勉強すること自体が苦じゃなくなる。"], [1079, "りせ", "人に言われたものを買っている時は、面白さが分からないまま、失敗すると「何なんだろう」となる。自分でやっていると楽しさが出てきますよね。ちなみに、なぜハナミラに来てくれたんですか？"], [1121, "白井", "一番大きかったのは、りせさんがオリエンタルランド出身だったこと。私はディズニーが大好きなので、その時点で「悪い人ではなさそう」というのが第一印象でした（笑）。本や発信を見る中で、見るからに優しそうな人柄と、投資を推し活に例えていたのが面白いなと思って。女子からするととっつきやすいですよね。"], [1173, "りせ", "嬉しいです。「投資は応援」と言っているんですけど、女性は、お金の話だけでやる気になる人と、そうじゃない人で結構分かれると思うんです。お金だけで続けられるかというと難しい方も多い。でも、企業の応援だと思っていると続けやすくなる。私もそういう気持ちだから楽しく続けられているし、女性ならではの感覚かなと思っています。"], [1232, "白井", "数字にコミットできるタイプと、感性や理想像で行動できるタイプがいますよね。ダイエットも「何kg落とす」にワクワクしない方が、うちの講座生さんにすごく多くて、私もそうなんです。投資も、数字だけを追いかけるのは私は全然面白いと思えなかったタイプ。"], [1289, "白井", "だから、何をするために投資するのか。直近で旅行に行きたい、ジュエリーを買いたい、そういう目標があるとやりやすいし、それを叶えるためにこれだけやろう、となりますよね。"], [1312, "りせ", "分かります。数字上増えるのは嬉しいし安心にもつながるんですけど、それが物や経験に変えられた時に、一番幸福度や実感が湧くと思っていて。増やした先にどう使うかが、すごく大事ですよね。皆さんは、投資でお金を増やして何がしたいですか？"], [1384, "白井", "りせさんにご報告したいことがあったんです。このネックレス、株の利益で買いました！"], [1395, "りせ", "すごく素敵、おめでとうございます！なかなか出会えないものですよね。"], [1416, "白井", "何店舗も回って、ようやく出会えました。さすがに経費では落とせないので、ちゃんとポケットマネーで買おうと思って。株の利益があったからです。りせさん、ありがとうございます。この別のアクセサリーも数年前に買ったんですけど、今は買った時の倍くらいの値段になっているので、早めに買おうと思って。"], [1490, "りせ", "（コメントを受けて）「家族で遠くの実家まで行ける大きな車」「推し活で海外遠征」「旅行」「マンション」「教育費」…いいですね。教育費も、かけようと思えばいくらでもかけられますよね。上を見るとキリがないけれど、それを選ぶかどうかに関わらず、お金があると選択肢が広がる。ゆりかさんも、高いものも買えるけど、可愛ければ手頃なものでもいい。どちらも選べる選択肢を持てることが、幸せなことだと思います。"], [1646, "白井", "ダイエット講座の次に「ロイヤルドリームアカデミー」というマインドの講座をやっていて、そちらは自己実現がメインです。うちのダイエットカウンセラーになって収入を何倍にもした方、転職して収入が上がった方、やりたい仕事についた方、起業できた方…皆さんいろんな道に進まれています。"], [1701, "りせ", "自分軸になるためには、何をしたらいいと思いますか？"], [1712, "白井", "語るとキリがないんですけど、大事なのは、完璧を求めないことだと思います。行動しても、絶対に成功する確証はないですよね。何においてもそうだと思います。投資も、絶対に利益が出せるなんてことはないじゃないですか。あったら詐欺です。"], [1743, "白井", "私は、やったことがうまくいかなかったことのほうが全然多くて、表に出しているうまくいったことなんて本当に一部なんです。SNSを見ていると、簡単にキラキラうまくいっているように見えるかもしれないけど、失敗を恐れずに行動して、経験値を積んでいくのが、結局自分軸を確立するために一番大事だと思っています。その時に、最初に専門家に学びながらやると、失敗のリスクも減らせるし、先人たちの失敗をショートカットして学べる。それが、私が何かを学ぶ時のマインドセットです。"], [1820, "白井", "私がダイエットに何十回も失敗して自分軸ダイエットにたどり着いたように、りせさんのメソッドも、りせさんがたくさんの時間とお金を使った経験を含めて今のものになっていると思うんです。そこをショートカットできると考えたら、すごくありがたいなと感じました。"], [1877, "りせ", "独学でできないことは、極論ないと思うんです。でもその代わりに、すごく時間がかかる。子どもが生まれてからなおさら思うんですが、回り道をしている時間がなさすぎるんです。自己探求して失敗して…を楽しめる時間があったのは学生までだったなと。そこに時間をかけていると、子どもとの時間も足りなくなるし、やりたいことが叶うのも遅くなる。あっという間に時間が過ぎてしまいます。"], [1927, "白井", "お金は稼げば戻ってくるけど、時間は取り返せないですもんね。だから、お金をかけて何かを学んでショートカットする、家事代行を使って自分の時間を浮かせて別のことをする、そういう時間を生み出すための使い方がすごく大事だと思います。"], [1983, "りせ", "（コメントを受けて）「ダイエット目的で入ったのに、楽しんでいるうちに次々に夢が叶いました」「行動力が爆上がりしました」。ゆりかさんがこういうお話をしているから、行動力が上がるんでしょうね。行動すると運が良くなる、と言いますけど、本当にそうだなとずっと思っています。行動しないと停滞して、するようになると、なぜか何事も動き始める。"], [2052, "白井", "失敗が怖くて動けないのは、すごくもったいないと思っていて。株で損したくない、学ぶのにお金を払って成功しなかったらどうしよう、と思う方もいると思うんですけど、それをやらなかったら結局ゼロですよね。ダイエットに関しては、やらなかったら代謝が落ちていくのでマイナスなんです。年齢とともに代謝は下がっていくので、食生活やストレスの管理で維持したり底上げしたりしないと、太りやすい体になっていく。40代、50代になった時に差が出るのは、そこだと感じます。"], [2120, "りせ", "投資も、インフレで資産の価値が下がっていくと考えると同じかもしれないですね。最初に努力すると後が楽、というのも本当にそう。いろんな人を見て、パッと成功したように見えるかもしれないけど、結局最初に時間やお金を投資した時期があったから今がある。最初からやっておくことの大切さは本当にあると思います。"], [2185, "りせ", "不思議なんですけど、26歳を過ぎてから投資を始めた人は、全員「もっと早く始めればよかった」と言うんです。22〜25歳くらいだと、自分のことを早いと思うみたい。だから今30代、40代、50代、60代の方も、皆さん同じように思っているので、ご安心ください。"], [2256, "白井", "りせさんが資産づくりにおいて大事にしているマインドセットも聞いてみたいです。"], [2268, "りせ", "ゆりかさんにも近いと思うんですけど、何があっても前向きでいることですね。もちろん自分なりに反省会はするんです。でも、さっきの喉の話のように、起きたことは全部次に生かす。それに、投資は基本的に、株が上がる、世の中が最終的に良くなる、という前向きな気持ちでやるもの。怖い気持ちはあって当然だし、それはいいことなんですけど、経験の中で乗り越えて、企業や世界の未来をポジティブに捉えていく。前向きさが最終的には一番大事だと思っています。"], [2352, "りせ", "私も先輩投資家に「どうせ最後にはうまくいく、と思い続けて」と言われたんです。最初は半信半疑で、正直その頃は自分軸で生きられていなかったので「そんなこと言われても」と思っていました。でも、どうにか自分を奮い立たせて、どうせ最後にはうまくいく、と思って積み重ねていたら、本当に超えられたんです。うまくいっている投資家で、すごくネガティブな人は基本的にいないですね。"], [2440, "りせ", "前向きといっても、無理に明るくなれ、ということではないんです。起きたことを捉えて、次に生かそうと思い続けられるかどうか。"], [2471, "白井", "この間、大きく下がった日がありましたよね。昔だったら「もうおしまいだ」と思っていたと思うんですけど、自分の軸を持って、知識をつけて、前向きな視点をマインドセットとして持っているだけで、全然うろたえなかった。「じゃあどうしよう」と考えられるようになっていて、すごく大事だなと思いました。"], [2513, "りせ", "ああいう時は、その後数日で大きく戻ることもありますよね。そういう場面はみんなに平等に訪れるので、対処のしかたを知っているか、前向きに捉えられるか、前向きに戻れる場所があるかが、本当に大切だと思います。"], [2550, "白井", "ハナミラは横のつながりもあったのがよかったです。私は1人でこそこそ勉強できないタイプで、みんなで勉強したいタイプだったので。"], [2599, "白井", "今たくさんコメントをくださっている自分軸ダイエットの皆さんもそうなんですけど、横のつながりって女性にとってすごく大事だと思うんです。ハナミラは講座の中でグループディスカッションがあったり、一緒に銘柄を調べたりしますよね。ああいうのは、普段のリアルの友達とはやりにくいじゃないですか。お金の知識は人によって差があるし、お金の話が気軽にできる関係かどうかもある。でもハナミラは投資をするためのコミュニティなので、投資の話が飛び交うのが当たり前。それが気軽に話せる関係性が、すごくいいなと思いました。"], [2660, "りせ", "私は外でも言っちゃうタイプだったんですけど、嫌な顔をする人と、面白がって聞いてくれる人に二極化するんですよね。だから、当たり前に話せる場所はすごく大事だと思います。"], [2696, "白井", "女性って、一緒にワイワイ盛り上がったり、みんなで高め合いたい、という感じがいいですよね。男性からは「そんな素敵な人ばかり集まるところがあるんですね」と言われました。"], [2729, "りせ", "男性は、自分だけの手柄にしたい、言いたくない、というのがあるみたいですね。女性は「これいいよ」とみんなで分け合う。そこが違うところで、楽しいところかなと。受講生さんたちが株の利益で一緒に旅行に行ったりもしています。それに、ゆりかさんのネックレスのように、「投資でそんなことができるようになるんだ」と聞いたら「私もやりたい」と思う人が出てくる。うまくいっている人たちがいる環境に入るのは、すごく大切だと思います。"], [2797, "白井", "ダイエットも、人前で「ダイエットしてます」と言える人と言えない人がいると思うんですけど、みんながしている環境なら言いやすいし共有しやすい。仲間の存在で高め合えるのは大事ですよね。"], [2818, "りせ", "視聴者の皆さんで、ダイエットしたいけど自分だと続けられない、楽しくない、と思っていた方は、ぜひゆりかさんをフォローして、門を叩いてみてください。"], [2844, "白井", "私もりせさんみたいに、資産億超えになりたいです。この間、都内に家を買ったとおっしゃっていましたよね。マイホームとして買っているのがかっこいいなと思って。"], [2880, "りせ", "不動産投資に回せばいいのに、という声も聞こえてきそうなんですけど（笑）、子どもが生まれたのがきっかけになりました。夫と2人だけなら、どこでも生きていける。でも私は初めましての人間関係がすごく苦手で、今のママ友との関係がなくなるのは、子どもにとっても自分にとっても大きな損失だと思ったんです。環境を買うと思ったら、それでいいと思えたんです。"], [2960, "白井", "それこそ自分軸ですよね。周りにそういう人がいないので、新しい目標を見せてもらいました。"], [2983, "りせ", "嬉しいです。ハナミラの受講生さんたちからも、こんな家を買いました、という報告があるといいなと思います。旦那さんに車をプレゼントした受講生さんもいて、夢が広がっていますよね。受講生さんたちが成果を出してくれるからこそ、ハナミラも広がっていると思うので、本当に皆さんの努力に感謝です。"], [3030, "りせ", "12月1日から、3daysプログラムを開催します。ゆりかさんが話してくださったような、自分の軸を作って「こういう銘柄がいい、こういうところで買おう」という考え方をお伝えする3日間です。オープンチャットでは、開催までの間にライブのお知らせやワーク、プレゼントが届いたり、投資でこんなことができるんだ、と自分の制限を突破していける、投資を始める準備の場所になっています。"], [3090, "りせ", "今日のライブの感想をアウトプットしていただいた方の中から、抽選でパレスホテルの紅茶をプレゼントします。すごく美味しいので、ぜひゆりかさんのお話の感想を書いてください。ゆりかさん、最後に、自分の夢を叶えていく女性たちに一言お願いします。"], [3129, "白井", "皆さん、今日はありがとうございました。皆さんの夢は青天井で、自分に制限をかける必要はなくて、わがままかなと思うくらい、自分の理想をどんどん出して、叶えて、を繰り返していいんです。私はそれがあったからこそ、ダイエットも、ディズニーで結婚式を挙げることも、海外のディズニーやクルーズに行くことも、ネックレスを買うことも、わがままじゃなくて全部叶えたくて叶えてきました。いつも周りのために頑張っている皆さんだからこそ、自分のためにも、人のためにも、全力で夢を叶えに行ってほしいと思います。一緒に叶えていきましょう。"], [3198, "りせ", "素敵なメッセージをありがとうございました。皆さんもぜひ、ゆりかさんに続いてください。"], [3214, "りせ", "ゆりかさんのお話、めちゃめちゃ面白かったですね。ハッピーオーラが素晴らしかったです。ダイエットといえばゆりかさんなので、ぜひ門を叩いてみてください。3daysプログラムは12月1日から。ゆりかさんが株の利益でネックレスを買えるようになるまでに至った投資の考え方やマインドの持ち方、銘柄の選び方、株を買うタイミング、そして今AIをどう使って効率よく投資しているかまで、まるっとお話しする特別な3日間です。"], [3310, "りせ", "今日の感想を書いていただくと、特典が全員に届くのと、パレスホテルの紅茶の抽選もあります。次回は16日。15冊も本を書いている著者のジョン・キムさんとのコラボです。実は私の大学時代のゼミの教授で、ご自身も資産運用をされています。「超一流のマネーマインド」というテーマでお話しするので、楽しみにしていてください。会えない期間も、オープンチャットで投資の知識をアップデートできる企画を考えています。今日も見てくださってありがとうございました。"]], "guestName": "白井ゆりかさん", "guestRole": "自分軸ダイエット主宰／『自己肯定感ダイエット』著者／ハナミラ受講生"}, {"id": "1116", "vid": "KrMALqn4UfE", "date": "11/16（月）", "type": "コラボライブ", "guest": "ジョン・キムさん（作家・りせさんの大学時代の恩師）", "guestName": "ジョン・キムさん", "guestRole": "作家／りせさんの大学時代のゼミの先生", "title": "超一流のマネーマインド「お金のために働く人・お金に働いてもらう人」", "duration": "約76分", "message": "お金の不安の正体は「知らないこと」。学んで、価格ではなく価値で選び、今年のうちに「お金に働いてもらう」一歩を。長く続ければ、複利が人生の味方になる。", "slides": [{"t": 130, "h": "ゲスト：ジョン・キムさん", "p": "慶應義塾大学で教えていた頃の、りせさんのゼミの先生。たくさんの著書で、多くの女性の生き方を変えてきた方です。普段はほとんど話さない「お金」をテーマに、本音で語ってくれました。", "li": ["お金のマインドが変わると、人生が丸ごと変わる", "一歩お金に近づけば、お金は二歩近づいてくる"]}, {"t": 470, "h": "お金の不安の正体は「知らないこと」", "p": "ジョンさんも子どもの頃からお金の不安を抱え、向き合うのが怖くて目をそらしてきたそう。不安だったのは、お金があるかないかではなく、お金の正体が分からなかったから。", "li": ["お金の仕組みは、家でも学校でも誰も教えてくれない", "知らないから不安が膨らみ、親から子へ連鎖する", "一度分かると、大切な人にも伝えられるようになる"], "key": "学び始めた瞬間、お金は不安のもとから「自由の翼」に変わる"}, {"t": 829, "h": "人生を分けるキーワード「複利」", "p": "複利とは、最初は頑張ってもなかなか増えないけれど、続けているとある時から雪だるま式に大きくなること。お金だけでなく、仕事も人間関係も同じ。", "li": ["最初は変化が見えなくても、やめずに続ける", "ある瞬間から一気に伸びる", "難しい数学ではなく、子どもでも分かる考え方"]}, {"t": 1053, "h": "長い目で見る力と「待つ力」", "p": "目先で得をしようとする人は、長い目で見ると得をしない。大切だと思うことを信じて続け、結果が出るまで待てる人に、複利は味方してくれます。", "li": ["すぐに結果を求めない", "少なくとも数年、できれば十年単位の気持ちで", "長く続けたことほど、後で大きく返ってくる"]}, {"t": 1162, "h": "「価格」ではなく「価値」を見る", "p": "豊かに生きている人は、安いから買う・高いから諦める、をしない。まず「自分にとってどれだけの価値があるか」を考えてから値札を見る。", "li": ["例：安すぎる宿で体調を崩したら、損のほうが大きい", "同じタクシー代でも、疲れている日は価値が違う", "「コスパで得をする」発想を手放す"], "key": "人生は、価値を最大にしていく旅"}, {"t": 1509, "h": "お金は「もう一人の自分」", "p": "自分の体だけで稼いでいると、体調を崩したら収入が止まってしまう。お金に働いてもらえば、寝ている間も入院している間も働き続けてくれます。", "li": ["少額からでいいので、今年のうちに「お金に働いてもらう」体験を", "いつか、お金が稼ぐ額が自分の稼ぐ額を超える日をつくる", "そうなれば、本当に大切な仕事にだけ時間を使える"]}, {"t": 2211, "h": "ジョンさんが大切にしている投資の原則", "p": "お金の名著を読み込んで見えてきた、始めるときの基本です。", "li": ["長い期間で持つ", "分散させる", "生活費や借りたお金ではなく、余裕資金でやる", "手数料の安いものを選ぶ", "コツコツ積み立てる／NISAを使う"], "key": "銀行に置いたままのお金は、物価が上がるぶん目減りしていく"}, {"t": 2736, "h": "女性こそ投資をしたほうがいい理由", "p": "ジョンさんが「男性より女性が絶対に始めるべき」と話した理由です。", "li": ["人生が長いぶん、必要なお金も多い", "出産・育児・介護で、仕事や収入が途切れやすい", "自分名義のお金があると、心の自立と自信につながる", "お金に働いてもらうお母さんの姿が、子どもへの一番の教育"]}, {"t": 3059, "h": "AI時代に子どもに必要な、たった一つの力", "p": "それは「自分の意思を、自分の言葉で、はっきり伝える力」。AIもお金も、こちらが指示を出して初めて働いてくれるからです。", "li": ["子どもの話をよく聞いて、質問してあげる", "「もっと正確に言うとどんな感じ？」と言葉を育てる", "お金とAI、二つの「分身」を使いこなせる人に"]}, {"t": 3440, "h": "投資は「心の修行」", "p": "株価は上がったり下がったりして、心が揺れます。でも下がる日が来ることを最初から想定しておけば、慌てずにいられる。", "li": ["長い目で見て「最後にはうまくいく」と信じる", "目先の上下には、あえて鈍感でいる", "余裕ができると判断力が上がり、人にも優しくなれる"], "key": "投資を始めると、世界の見え方も、毎日の楽しさも変わる"}, {"t": 3913, "h": "りせさんのまとめ", "p": "ジョンさんと同じく、長く・分けて・積み立てる投資はりせさんも実践中。そこに株式投資を加えることで、お金が増えるスピードを上げてきました。", "li": ["積み立ては、やらない理由がない投資", "株式投資ができると、自由に近づくスピードが上がる", "明日いきなり変わるのではなく、1〜2年続けるうちに変わっていく"]}], "transcript": [[1, "りせ", "皆さん、こんばんは。世界一分かりやすい株のはじめ方3daysプログラム主催の松下りせです。日本最大級の女性向け投資スクール「ハナミラ」を経営していて、私自身、未経験から株で資産を増やしてきました。12月1日から、そのノウハウをまるっとお伝えするプログラムを開催します。このライブは、その開催を記念して素晴らしい方々と対談し、皆さんのお金や投資のマインド、知識、考え方をアップデートしていく企画です。"], [85, "りせ", "対談ライブも折り返しになりました。今日は特にスペシャルな回で、私自身すごく楽しみにしていました。テーマは「超一流のマネーマインド ── お金のために働く人、お金に働いてもらう人、その違い」。皆さんのお金のマインドをまるっとアップデートする回です。"], [130, "りせ", "今日のお相手は、ジョン・キムさんです。国費留学で日本に来られて、ハーバード大学やオックスフォード大学で研究をされ、その後、慶應義塾大学で10年間教えていらっしゃいました。その時の私は、ジョンさんのゼミ生なんです。19歳の時にご縁をいただいて、今こうして対談させていただけることになりました。たくさんの女性のマインドや生き方を変えてきた方ですが、今回はお金をテーマにお話を伺う、本当にスペシャルな回です。"], [238, "りせ", "ジョンさん、少し前まで海外にいらっしゃったお忙しい中、ありがとうございます。ジョンさんの元々のファンの方も、今日はお金がテーマということで楽しみにされていると思います。改めて自己紹介をお願いできますか？"], [292, "ジョン", "りせさんとまたご縁をいただいて、こうしてライブができるのは、人生は面白いなと思います。あの頃のゼミの教室で、こんな未来が待っているとは想像がつかなかった。人生は出会いで作られていくのだと思います。今日初めてご縁をいただく皆さんもたくさんいらっしゃると思いますが、りせさんと僕の2人で、とにかく愛を込めて、皆さんの未来と人生へのエールを込めてお話しします。"], [341, "ジョン", "これからお金の話をたくさんすると思いますが、見てくださっている方のほとんどは、僕も含めて、お金に苦しめられた歴史があると思います。でも、皆さんがお金の世界に一歩近づくと、お金は二歩近づいてきて、二人三脚で未来を生きることができるようになる。僕はお金の話はほぼ一切しないんです。敏感な問題なので。でも今日は皆さんがお金の話を聞きたいと思って来られているので、本音でお話しします。お金に対するマインドが変わると、人生は完全に変わります。収入や預金が増えるかどうかの問題ではなく、未来が変わるんです。"], [455, "りせ", "ジョンさんは、過去にお金のことで悩んだことはありましたか？"], [470, "ジョン", "ないわけがないです。お金への不安や恐れが深すぎると、お金について心配すること自体を意識しなくなるんです。無意識の中に深く染みついてしまうから、お金と向き合うことができないまま、何年、何十年と経ってしまう。お金はそれくらい、良くも悪くもパワーが強いんです。僕も例外ではなく、子どもの頃から新聞配達をしながら1人で生きてきたので、お金の不安がなかった記憶はほぼありません。でも、向き合った記憶もない。向き合うと、あまりにも怖すぎるから。"], [549, "ジョン", "そんな僕が、ある時期からお金の不安と心配から一切解放されました。不安の本当の正体は、お金があるかないかではなく、お金の正体が分からなかったこと。それが、お金を怪物にしていた原因でした。ほとんどの方は、お金の原理や、お金が巡る仕組みについての知識がない。知らないことから来る不安が、私たちを縛りつけてきたんです。だからポイントは、知らない状態から抜け出すために一歩踏み出すこと。それだけで、お金は不安の源ではなく、自由の翼になる。人生の味方になると断言できます。"], [613, "ジョン", "それほど大事なのに、誰も教えてくれないんです。10数年ぶりにりせさんと再会して、お金について教えることに携わっていると聞いて、本当に素晴らしいと思いました。本当は家庭の中で行われるのがベストなんですが、多くの家ではお金について教えてくれない。お金持ちの家は教えるんですけどね。会社員の家庭だと、親が未来に不安を抱えていることが、子どもながらに分かる。そうするとお金への怖さが先に立って、知りたいと思うこと自体が起きない。知らないことが連鎖して、不安を膨らませたまま人生を終えてしまうこともあると思います。"], [688, "ジョン", "今日、皆さんがお金の不安の正体を理解して、それを断ち切ることができたら、皆さんの代だけでなく、お子さんやパートナーも含めて、みんなのお金のマインドが変わります。お金は一度理解できると、全てが見えるようになる。見えた人は、見えない人に伝えることができるんです。だから皆さん1人が変わることで、周りの大切な人が光を見ることができるようになる。人生の悩みは、人間関係、パートナーシップ、家族、そして実はお金の問題が一番大きかったりします。そこから解放される最初の一歩のきっかけを、今日りせさんと僕で作れたらと思います。"], [794, "りせ", "向き合うのが怖い、というお話は生々しくて、涙が出そうになりました。今それを抱えている人は、どうしたらいいですか？"], [829, "ジョン", "身につけてほしい習慣がいくつかあります。まず、お金について学ぶことを始めてほしい。本からでもいいし、りせさんのようなスクールからでもいい。学ぶ中で、僕が一番重要なキーワードだと思うのが「複利」です。人生は、複利を理解している人と、していない人に分かれるんです。複利という言葉はほとんどの方が聞いたことがあると思いますが、本当に理解できている人はごくわずか。理解できている人は、人生で必ず成功しています。複利はお金の世界だけの話ではなく、仕事も人間関係も、世の中の大切なことは全て複利でできあがっているんです。"], [902, "ジョン", "複利は、専門用語では「お金につく利子がさらに利子を生んでいく」ことですが、つまり、最初は頑張ってもなかなか上がらない、ということなんです。でもそれを積み重ねて、続けていくと、ある時いきなり上がっていく。仕事もそうです。英語でも何でも、新しいことを頑張る時、最初は成長が見えないのに、ある瞬間から一気に上がる。お金も同じで、始めてすぐにたくさん増えることはないけれど、続けていくうちに、ある時から雪だるまになっていくんです。"], [986, "ジョン", "複利は少し数学っぽく聞こえるので苦手だと思う方もいるかもしれませんが、説明すれば小学生でも理解できます。その真実を理解して、人生のあらゆるところで実践していくと、ある時に爆発的に人生を押し上げてくれる。複利は魔法なんです。アインシュタインも、複利を世界の不思議と呼んだと言われています。"], [1053, "ジョン", "分かりやすい言葉で言うと、僕の周りの成功している人たちの共通点は「長期視点」です。短期的に得をしようとする人間は、長期的に得をしない。短期的に損をしても、自分が大切だと思うことを信じて続けると、仕事も人間関係もパートナーシップも子育ても、もちろんお金もうまくいく。少なくとも数年はかかるけれど、十年くらいの気持ちで複利を信じてやり続けてほしい。そして大事なのは、結果を待つ力。やり続けながら結果を待つ力です。すぐに結果を求めるのは、自分にとってすごく損なんです。長く続けたことは、ある時期に大きな実りをもたらしてくれます。"], [1162, "ジョン", "もう一つは、りせさんと最初に会った頃にも話したことだと思いますが、人生を自由に豊かに生きている人たちの共通点は、価格ではなく価値を見ることです。だから、安いから買ったりしないし、高いから諦めたりもしない。僕の持論は「人生は価値の最大化の旅」。体力、時間、知性、そしてお金。持っている資産を、価値を最大にすることに使うんです。お金が豊かにならない人は、常に価格を見る。価格を見る人は、価値を大きくすることができない。これを逆転させることが大事です。"], [1245, "ジョン", "最近イタリアに10日ほど行っていたんですが、ベネチアは観光客が多くてホテルがすごく高いんです。昔の僕なら絶対に安いところに泊まって、翌日おいしいものを食べるためにお金を残したと思います。でも今は価値を見ているので、安いところには泊まらない。安すぎる宿に泊まると、翌日に体調を崩したりする。その損害はとても大きいんです。高いところは清潔で、親切で、部屋も広い。そうやって価値を積み上げていって、自分にとってそれだけの価値があると思えたら、お金を払うんです。その価値の積み重ねが、人生の財産になります。"], [1335, "ジョン", "だから今日お伝えしたいのは、コスパの思考を完全に捨てること。コスパで得をしようという思考が出てきたら、「また出てきた」と気づいて、まず価値を見る。タクシーも、値段は同じでも、忙しい時や疲れている時は価値が全然違いますよね。自分の価値に比べて安いと思えば、一般的に高いと言われてもお金を払う。逆に、価値を考えずに安いからやる、を続けると、永遠にお金で豊かになることも、成長することもできないし、思い出も作れない。未来の自分に後悔をプレゼントすることになるんです。"], [1415, "ジョン", "服を買う時も、つい先に値札を見ちゃうでしょう。僕も昔はそうでした。でもまず値段は見ない。気に入ったものがあったら、これは自分にとってどんな価値があるのかを想像する時間を一つ持つ。今度の食事会に着ていった時のワクワク、年に何回くらい着るか。そうやって価値を計算すると、どんな買い物も安いんです。価値を考えない人には、どんな買い物も高い。同じものでも、価値を考えて買うかどうかで、生み出す価値が全く違ってきます。"], [1509, "ジョン", "三つ目に実践してほしいのは、お金を「もう1人の自分の分身」にすることです。たとえば体調を崩したら労働はできないし、寝ている間も働けない。自分の体だけに頼ると、柱は一つしかないんです。そうすると常に不安になる。だから早い段階で、少額でもいいので、お金に働いてもらう体験を始めてほしい。本当のお金持ちは、1人残らずお金に働いてもらっています。お金は、皆さんが寝ている間も、入院している間も、裏切らずに働いてくれる。その働かせ方には知恵が必要なので、りせさんから学ぶのはすごく大事です。"], [1610, "ジョン", "ぜひ、今年が終わる前に、今まで投資したことがなくても全然いいので、投資を始めてほしい。皆さんが自分の時間と体力と知力を使わなくても、もう1人の分身が収入を作り出してくれる仕組みを、今年中に作ってほしいんです。そうすると本当に心強くなります。お金を稼ぐために働くことは、とても尊いことです。でも人生のある瞬間に、主人と従う側の関係を逆転させることが大事。自分が働いて稼ぐお金より、お金に働いてもらって稼ぐお金が上回る分岐点を、できるだけ早く人生に持ってくる。一度それを迎えれば、残りの人生は複利が解決してくれます。"], [1700, "ジョン", "そうなると、本当に心が喜ぶ仕事、自分が成長できる仕事、誰かに貢献できる仕事に専念できるようになる。お金の不安で選ぶのではなく、本当に大切だと思うところに時間を使えるようになるんです。人間の悩みのほとんどは人間関係から来ると言われますが、お金に余裕があれば、その悩みの多くも消えていきます。お金が自分の人生の味方になって、自分以上に人生を支えてくれる存在だと思えた瞬間から、経済的に自立するだけでなく、穏やかさを手に入れることができる。余裕があると、美しいものに感動できるし、迷わずに人に優しくできるんです。"], [1820, "ジョン", "逆に、お金がなくて余裕がない生活が続くと、判断力も下がります。焦りがあるので、本来出せる力の一部しか出せなくなる。お金のパワーをマイナスに使うかプラスに使うかで、皆さんが本来持っている力の発揮のしかたと、その結果の大きさが劇的に変わるんです。だから、お金について学ぶこと、価格ではなく価値で生きること、そしてお金という分身を作ること。始めるのに大きな元手はいりません。早く始めるほど、複利の魔法を早く大きく体験できます。"], [1922, "りせ", "大学の講義のようなお話、ありがとうございます。頷きが止まりませんでした。"], [1937, "ジョン", "お金のことは、周りの誰も教えてくれないし、親もほぼ教えません。僕がもし若い女性だったら、りせさんのような、お金のことだけではなく、人生のためのお金を学んで高め合うコミュニティに行くと思います。そうすると土地勘がすぐにつく。1人でやると、何年かかってもそこはアウェイだから入れないんです。目を閉じたまま山に入るのと同じ。その怖さは、僕もよく分かります。何十年も、お金について一行も見たくなかった。15冊も本を書いてきたのに、本の中でお金のことを書かなさすぎて、前書きを書いてくださった方に「お金という字が見つからなくて驚いた」と言われたくらいです。"], [2048, "ジョン", "でも今は、そこから光が差すようになりました。もし過去の自分に30分だけ会いに行けたら、複利の話、価値の話、そして「今日からお金に働いてもらう仕組みを作りなさい」と伝えて帰ってくると思います。皆さんがお金について、怖くても今日から向き合い始めることで、未来の自分を幸せにして、未来の自分に褒められる人生を生きることができるようになる。どこかに投資してください、という話ではないんです。お金に心を開くと、お金は暗闇ではなく光になってくれる。未来の皆さんの同伴者になってくれます。"], [2152, "りせ", "このライブが決まったのは、本当に久しぶりに偶然お会いしたのがきっかけでした。私は今1児の母なんですが、しばらくお会いしていなかったので、妊娠のご報告もできていなかったんです。そうしたら、ジョンさんからお金の大切さのお話をしてくださって。ジョンさんご自身は、運用を始める時どうでしたか？"], [2211, "ジョン", "最初は、やっぱり心理的なハードルは高かったです。でも僕は学者出身なので、ある時、お金について研究しようと思って、20世紀のアメリカのお金に関する名著を取り寄せて全部読んだんです。そうすると、正解が見えてきました。始める時の鉄則は、まず長期運用が大前提。二つ目は分散させること。三つ目は余裕資金でやること。誰かのお金を借りたり、生活費を使って運用したりしたら絶対にダメです。株価が上下しても感情が乱れすぎないお金、それが余裕資金です。あとは手数料が安いこと。手数料はすごく大事です。そして会社員の方なら、積み立てていくこと。"], [2310, "ジョン", "この原則を守って考えると、選ぶ商品はいくつかに絞られてきます。全世界の株にまとめて投資するものや、アメリカの代表的な企業にまとめて投資するもの、最先端技術が好きならハイテク企業中心のもの。ネット証券で口座を開いて、手数料を見て選べば、まず大きな間違いはないと思います。数年の間に元本を下回ることはあり得ますが、長期で考えるのが前提です。できれば十年くらいの視野で持っておく。歴史的に見ても、長い期間で見れば大きく成長してきました。気になる方は、AIで「10年前に投資していたら今いくら？」と調べてみてください。"], [2490, "ジョン", "銀行にお金を入れたままにしておくのは、見えない税金を払っているのと同じです。金利はほとんどつかないのに、物価はどんどん上がっていく。請求書が来ないので、払っている感覚がないだけなんです。10年前に投資を始めなかった自分は、叱られるべきだと思うくらい。なぜできないかというと、投資への恐怖があるから。その恐怖の原因は、知らないことと思い込みです。人はもともと損をすることを極端に怖がる性質もあるので、そこを突破して、最初の一歩を踏み出すことが大事なんです。"], [2552, "ジョン", "それに今はNISAがあります。NISAを使わないのも、見えない税金を払っているのと同じ。通常、投資で出た利益には税金がかかりますが、NISAならそれが免除される。これは本当に、国からのプレゼントです。まずは長期・分散・余裕資金でやるインデックス投資を、ネット証券で口座を作って、少額からでいいので始めてほしい。その体験を今年中にぜひしてほしいし、りせさんにそう導いてほしい。少しでも土地勘がつくと、お金の見え方が全く変わります。そしてこれは、男性よりも女性が絶対に始めるべきだと思っています。"], [2663, "りせ", "NISAがプレゼント、というのはまさにその通りで、今の新しいNISAになってからは、やらない理由がないと思います。まだの方は、まず口座開設から始めてほしいですね。"], [2700, "ジョン", "昔は窓口でやるとすごく手数料がかかったりしましたが、今はネットで完結すれば、ほとんど費用がかかりません。情報にも恵まれている。すごくいい時代です。"], [2736, "ジョン", "女性が特に投資をしたほうがいい理由は、いくつかあります。一つは、人生が長いこと。女性は男性より寿命が長いので、そのぶんお金がもっと必要になる。年金だけでは足りないので、年を取っても自分の代わりに働き続けてくれる投資があると、すごく心強い。二つ目は、キャリアが途切れやすいこと。りせさんの単独ライブも見ましたが、お母さんになったら、スマホを見る時間すらないくらい手が離せない。キャリアが途切れやすいということは、収入が途切れやすいということ。だから忙しい人ほど、仕組みにまかせたほうがいいんです。"], [2850, "ジョン", "三つ目に、出産や育児、介護で自分が稼げない時期に、パートナーの収入に頼りきりになると、関係の中で自分の立場が弱くなりがちなんです。相手が優しい人でも、自分で「養ってもらっている」と思った瞬間に、セルフイメージが下がって、何を買うにも遠慮してしまう。どんどん自分が小さくなってしまうんです。だから、結婚しても何をしても、自分名義の口座を必ず持って、少額でもお金に働いてもらってほしい。経済的な自立は、精神的な自立の土台になります。"], [2960, "ジョン", "四つ目、長い目で見て一番大事なのは、お金に働いてもらって、お金に開かれたマインドを持っているお母さんの姿が、子どもへの最高の教育になるということです。子どもにかける教育費の一部を、早い段階から長期の積み立てに回しておけば、その子が大人になる頃には大きな資産になっている可能性がある。そうすれば、その子は本当に大切だと思うことに自分の時間を使える人生を生きられます。"], [3059, "ジョン", "教育者としてもう一つ。AI時代に子どもが持つべき力は、たった一つ。自分の意思を、自分の言葉で、はっきり表現できる力です。AIは、こちらの指示に基づいて答えを出してくれます。これからロボットも出てくる。その時に指示ができるかどうかが大事で、指示ができなければAIは全く使いこなせません。だから、子どもの意思をよく聞いて、質問をしてあげる。子どもが何かを言葉にした時に、それを受け止めて、「もっと正確に言うとどんな感じ？」と、言葉の力を鍛えてあげてほしいんです。"], [3210, "ジョン", "お金を分身として働かせる時代と、AIという無数の分身を作れる時代。お金とAIの二つを使いこなせたら、寝ていても、遊んでいても、本を読んでいても、旅をしていても、価値は作り出され続けます。りせさんと大学時代にITについてずっと話していたので、さすがだなと思います。ぜひ今回のプログラムを通して、AIとお金を学んでほしいと思います。"], [3272, "りせ", "12月1日からの3daysプログラムでは、投資や株の経験がない方に、知識ゼロの状態から、マインドを身につけて、銘柄を選んで、売買のタイミングまでお伝えします。ジョンさんが熱く語ってくださった長期・分散・積み立て投資はもちろん、それに加えて株式投資もしっかり学べます。AIの使い方も含めてお伝えします。"], [3340, "ジョン", "僕が投資をおすすめする理由は、お金を増やしてもらいたいということもあるけれど、それ以上に、投資の結果がどうであれ、お金に対する暗闇、知らないことから解放されてほしいからなんです。不安と恐れは、実際には起きていないのに、ものすごい苦しみを与えるもの。それに皆さんは人生の長い間苦しんできたと思います。そこから抜け出すために必要なのは、知ること。知るために学ぶこと。そこから全てが始まります。意識が変われば、全てが変わります。"], [3420, "ジョン", "もう一つ、投資をすると毎日が楽しくなります。世界が見えてくるんです。世界とのご縁を結ばせてくれるのが投資。僕自身、投資してよかったと思うのは、世界の情勢を冷静に見られるようになったこと。そして、お金の不安から抜け出すと、不思議と無駄なお金を使わなくなるんです。"], [3440, "ジョン", "投資は精神の修行にもなります。チャートが上がったり下がったり、赤になったり青になったりすると、心が揺れる。下がる日は必ず来ます。でも「来たらどうしよう」ではなく、来ることを最初から想定しておけば、起きても心を穏やかに保てる。人生もチャートと似ていて、思わぬ形で望まないことが起きることもある。でも、最終的にはうまくいくんだと、長期が本質なんだと信じる。目先の上下には、あえて鈍感でいる。僕はこれを「知的な鈍感さ」と呼んでいます。"], [3546, "ジョン", "長い目でうまくいくことを信じられたら、目先で何が起きても慌てることも、不安になることもない。そうすると人生が穏やかになって、余裕が生まれる。判断力も高まるし、愛情も溢れる。余裕がないと人にきつく当たるけれど、余裕があると人は大らかになれるんです。投資を通じて、皆さんの人生に豊かさと自由の翼がついて、美しく羽ばたくことを、心から楽しみにしています。応援しています。"], [3580, "りせ", "素晴らしい講義のようなお話でした。今日の感想を3daysプログラムのオープンチャットにアウトプットしていただくと、抽選でジョンさんおすすめのお金と投資の書籍をセットでプレゼントします。ぜひ何度も見返して、お金のマインドを変えて、今日から投資をスタートしてください。"], [3660, "ジョン", "りせさんの活動は本当に素晴らしいので、たくさんの方を幸せにしてほしいと思います。りせさんと関わると、みんな幸せになるので、ぜひご縁を続けてください。僕は普段お金について一切話さないので、今日は持っているものをだいぶお伝えしたと思います。それを皆さんの人生の階段に、エレベーターにして、高いところに登って美しい景色を見てほしいと思います。"], [3720, "りせ", "ジョンさん、本当にありがとうございました。皆さん、ここからは少しだけ私と振り返りをさせてください。すごかったですね。19歳の時の私の人を見る目は素晴らしかった、と改めて思いました（笑）。ジョンさんが、人生のいろんなことが複利のようにつながっていくとお話しされていましたが、こういうご縁もまさにそうだなと。投資の複利も、人生の複利も、本当に実感しています。"], [3800, "りせ", "ジョンさんもお話しされていましたが、私は投資があることで、働かなくてもお金が増えていく状況を作ることができて、そのおかげで子どもとも向き合えているし、余裕を持って過ごせています。そんな人生が来るなんて想像していなかったけれど、それを得られているのは、昔の私が行動してくれたおかげだと思っています。"], [3913, "りせ", "（コメント「目先の利益が早く欲しい」を受けて）その気持ちも分かります。実は私も、ジョンさんと同じく長期・分散・積み立ては実践していて、それに加えて株式投資で、お金を増やすスピードを上げています。そこを3daysプログラムでお話しします。人生を大きく動かしている人たちには、そのために何かをやった期間がある。私にとってはそれが株式投資でした。株は積み立てと比べると早く利益が出やすいので、数年やってみて人生がすごく変わって、仕事への依存度がなくなり、それこそジョンさんがおっしゃっていた人間関係の悩みの多くをなくすことができました。その経験から、頑張り屋の女性に投資をしてほしいと思って起業しました。"], [4040, "りせ", "お話を聞きながら、AIとお金はすごく似ていると思いました。お金も、指示がないと勝手に動くことはないんですよね。「あなたはここで働いてください」と私たちが指示するからこそ増えていってくれる。AIも、こちらが「こういうことをしてほしい」と伝えるところからスタートします。指示を出す力は、意思表示できる人として鍛えていくもの。今はAIがその指示のサポートをしてくれるので、昔よりずっとやりやすくなっています。"], [4110, "りせ", "積み立ては、全人類やらない理由がない投資です。まだの人はぜひこれを機に始めてください。それに加えて株式投資ができると、自由の翼を得るスピードがすごく早くなります。ただ、明日いきなり人生が変わるというものではなく、1年、2年と続けていくうちに、私が会社のお給料に頼らなくてよくなったように、皆さんの人生も変わっていきます。12月1日からの3daysプログラムで、心を込めてお話しします。"], [4210, "りせ", "感想を書くことは、今日の学びを自分の中に落とし込んだり、自分の進む道が見えてきたりすることにつながります。書くのが恥ずかしい方は、他の方の感想を見るだけでも大丈夫です。次回は18日、ハナミラの受講生さんで、フリーランスで働きながら株式投資を収入の柱にしている方とのライブです。2児のママでもあるので、ご自分の働き方に悩んでいる方、ママさんたちにぜひ聞いてほしいです。"], [4430, "りせ", "（コメントを受けて）「何度も見返したい」「人生が変わる1時間」「投資は精神の修行、本当にそう」「ずっと広告を怪しんでいたけど、お人柄を知ってもっと早く勉強すればよかった」…ありがとうございます。3daysプログラムの特典では、おすすめの証券口座と開き方も細かくお伝えしているので、1人で開くのが不安な方もぜひ活用してください。今日も見ていただいてありがとうございました。18日にお会いしましょう。"]]}, {"id": "maya", "vid": "zvvudk4HhEM", "date": "11/18（水）", "type": "受講生ライブ", "guestName": "寺沢まやさん", "guestRole": "クライアントワーカーのための売上アップコンサルタント／ハナミラ受講生・2児のママ", "title": "知らないフリーランスは損をする！これからの時代の資産形成術", "duration": "約51分", "message": "フリーランスこそ、働けない日にも回る「収入の柱」を。株は小さく始められて、仲間と続ければ、今の暮らしも将来の安心も両方つくれる。", "slides": [{"t": 170, "h": "ゲスト：寺沢まやさん", "p": "ネット広告代理店で会社員を経験したあと、出産・育児を経てフリーランスに。今は在宅で経営者や個人事業主を裏方で支える人たちの、売上アップのコンサルをしています。2025年にハナミラに入って個別株を始めました。", "li": ["小学生の男の子2人のママ", "今日は、より身近な立場から投資のリアルを話してくれました"]}, {"t": 270, "h": "フリーランスこそ、収入の柱を複数に", "p": "自分や子どもが体調を崩すと、仕事も収入も一緒に止まってしまう。それがフリーランスの大きな不安でした。", "li": ["子ども2人が同時にインフルエンザで、1週間仕事が止まったことも", "積み立てと個別株があるから「他にも柱がある」と思えた", "投資があると、仕事でもいろんなチャレンジがしやすくなる"]}, {"t": 447, "h": "「株＝ギャンブル」の怖さが消えた理由", "p": "最初は「損しそう」「ギャンブルでは？」と、個別株へのハードルがとても高かったそう。", "li": ["ハナミラでは、その会社が社会に求められているかを見る", "社長・事業・商品に価値があるかを判断して選ぶ", "推し活のように「応援したい会社」を探す楽しさに変わった"]}, {"t": 616, "h": "不動産ではなく株を選んだ理由", "p": "働く時間を減らしても収入が得られる方法を考えて、他の選択肢も検討した結果、株を選びました。", "li": ["不動産は物件を見に行くなど、自分で動く部分が多い", "株はパソコンやスマホがあれば、仕事の合間でもできる", "少額から始められる"]}, {"t": 774, "h": "記念に買った株が、家族旅行の飛行機代に", "p": "講座の卒業イベント「銘柄発表会」で、チームで選んだ株を記念に購入。数か月そのままにしていたら、しっかり利益が出ていました。", "li": ["その年に出た利益で、家族でオーストラリアへ", "「みんなで選んだ株で、こんな体験ができるんだ」という驚き", "実際に利益につながる学びだと実感"]}, {"t": 1416, "h": "積み立ては「将来」、個別株は「今」のため", "p": "りせさんの「積み立ては20年後の自分、個別株は今や数年後の自分を豊かにする投資」という言葉が、まやさんの背中を押しました。", "li": ["将来への備えはしていたけれど、今を豊かにする準備が足りなかった", "子どもが小さい今こそ、一緒にたくさん経験したい", "海外は物価も上がっていて「いつか」では行けなくなるかも"]}, {"t": 1720, "h": "仕事と両立できる？", "p": "まったく問題なし。ずっとチャートを見ている必要はありません。", "li": ["1日10分、朝や午後に見る時間をつくるだけ", "100株より少ない単位でも買えるので、少額から始められる", "「どうなったら買う・売る」というマイルールを決めておけば、その時だけ動けばいい"]}, {"t": 1988, "h": "成果の秘訣は「投資仲間」", "p": "経済の情報は無数にあって、1人で追いかけるのはまず無理。仲間がいると、それぞれが調べたことを持ち寄れます。", "li": ["自分では気づかない銘柄や視点に出会える", "忙しくても、仲間の姿を見ると「やりたかったんだ」と思い出せる", "隣の人の当たり前が、自分の当たり前の基準を上げてくれる"], "key": "どこに身を置いてやるかが、すごく大事"}, {"t": 2469, "h": "投資を始めて変わったこと", "p": "公務員家庭で育ち、株とは無縁だったまやさん。", "li": ["漠然とした将来の不安が薄れた", "投資を先入観なく、フラットに見られるようになった", "子どもが好きなおもちゃを見て、その会社の株価を調べるように"]}, {"t": 2732, "h": "まやさんからのメッセージ", "p": "怖いと思っている方も、まずは一歩踏み出して、その世界を知るところから。", "li": ["株は少額からでも始められる", "ちょっと知るだけで、怖さはなくなっていく", "理想の人生に近づく一歩にしてほしい"]}], "transcript": [[1, "りせ", "皆さん、こんばんは。「世界一分かりやすいAI時代の女子流株のはじめ方3daysプログラム」主催の松下りせです。日本最大級の女性向け資産運用スクール「ハナミラ」を経営していて、私自身も株式投資で資産を増やしてきました。そのノウハウを3日間に詰め込んだプログラムを12月1日から開催します。今日もそれを記念したコラボライブです。プログラムまで、あと2週間くらいになりましたね。"], [84, "りせ", "今回は、皆さんにより近い立場で投資のお話をしてくださる、素敵な女性をお招きしています。クライアントワーカーのための売上アップコンサルタント、寺沢まやさんです。ご自身もフリーランスとして活躍されていて、ハナミラで株を始めて、収入の柱を作った方です。フリーランスとして仕事をする中で、資産形成をどうやっているのか、具体的に伺っていきます。"], [170, "寺沢", "初めましての方もいらっしゃると思います。寺沢まやと申します。クライアントワーカーのための売上アップコンサルとして活動しています。在宅で、経営者や個人事業主の裏方のサポートをしている方々の売上を上げるためのコンサルです。"], [219, "寺沢", "フリーランスになって4年目です。それまで13年間、ネット専業の広告代理店で会社員として働いていました。子どもが2人いて、出産と育休を経て退職して、フリーランスになりました。個別株を始めたのはハナミラに入ってからで、2025年の1月に入会したはずなので、2年目ですね。"], [270, "寺沢", "収入の柱を、働くことに紐づく収入以外のところからも作りたい、という思いがあってハナミラに来ました。フリーランスは忙しかったりもしますし、会社員のように毎月決まった給料があるわけではなく、月によってばらつきもある。自由度が高い反面、不安定さもあると思います。"], [307, "りせ", "私も独立してみて、決まった給料がないからこそ、収入の柱の多さはすごく大切だと感じます。"], [324, "寺沢", "自分の体調不良や子どもの体調不良、家族の突発的な何かがあった時に、自分の稼働が止まると、収入まで一緒に止まってしまう。それが私の中で大きな不安でした。だから別の収入源が欲しかったんです。"], [345, "りせ", "投資があると、フリーランスも安心してできますよね。フリーランスになるのは怖いと思っている方もいるかもしれないけど、投資もあると思えば、いろんなチャレンジができる。仕事をしながら資産運用もするのは、すごくいい組み合わせだと思います。"], [395, "寺沢", "ちょうど10月末に、子ども2人が同時にインフルエンザにかかって、1週間ずっと家にいて仕事が滞った時があったんです。働くことに紐づく仕事だけだったら、稼働が止まった時の不安はもっと大きかったと思います。私は積み立て投資と個別株投資をしているので、他にも収入の柱があると思えたのは、安心感につながっています。"], [447, "寺沢", "最初は、個別株へのハードルがすごく高かったんです。株ってギャンブルじゃないのか、損しちゃうんじゃないか、という気持ちがあって、ずっと手が出せなかった。でもハナミラに入って、そうじゃないと気づかせていただきました。ハナミラの教えは、その会社が本当に社会に求められているのかを見ていきましょう、というものですよね。会社や社長さん、ビジネスや商品・サービスに、本当に社会的な意義や価値があるかを判断してから、推し活みたいに応援していける会社を見つけていこう、という教え。そこがすごく本質的だなと思ったんです。だから、ギャンブルっぽいという怖さはなくなって、推せる会社を見つけたい、という前向きな気持ちに変わりました。"], [514, "りせ", "利益のためだけに値動きを追う、ということに違和感を持つ方も多いと思うんです。もちろん値動きで利益が出ればそれはいいんですけど、会社の本質も見ながらやると、納得感もあって、やっていることが楽しくなりますよね。"], [559, "寺沢", "チャートだけ見ていると気持ちが疲れてくると思うんですけど、会社のビジョンや、何を目指しているのか、何を成し遂げたいのかに共感できると、応援したいと思える。そんなふうに銘柄を選ぶ楽しさがありますね。"], [590, "りせ", "投資を検討する前に、他の選択肢も考えたりしましたか？"], [616, "寺沢", "会社員を辞めてフリーランスになった後は、業務委託でお仕事を振ってもらって、自分で手を動かしていました。インスタの投稿を作ったり、動画サイトを管理したり、講座運営をされているお客様の事務局として運営をサポートしたり。裏方の仕事です。そのやり方や、その仕事で売上を上げる方法を、今度は教える立場になって、フェーズが少し変わりました。それでも、もう少し働く時間を減らして、他から収入を得られる方法はないかなと考えた時に選んだのが、個別株の投資でした。"], [684, "寺沢", "他に検討したのは、よく言われる不動産投資です。でも私にとってはハードルがもっと高かった。物件を見に行ったり、査定をしたり、自分で動かなきゃいけない部分が多いので。株はパソコン1つあればできるし、手軽さとハードルの低さがありました。すぐできて、少額からでもできる。不動産だと頭金が必要ですよね。そういうところで株に巡り合いました。"], [774, "寺沢", "最初に買った株は、ハナミラの講座の期間中にある「銘柄発表会」の銘柄です。卒業イベントとして、チームのみんなでどんな銘柄にするか話し合って決めて発表するんですけど、その銘柄を、卒業する3月のタイミングで記念に買ったんです。「みんなで発表やったぞ」みたいな感じで、えいやと思って。"], [833, "寺沢", "それを数か月ほったらかしにしていたら、ちょっと見たら結構な利益になっていて、そこで利益を確定して、また買いました。その年は調子が良くて、全体でもしっかり利益が出たんです。それを家族旅行に使わせていただきました。今年の2月に家族でオーストラリアに行ったんですけど、その時の飛行機代にしました。"], [870, "寺沢", "講座の中でみんなで選んだ株で、こんな体験ができるのか、こんないい思いをさせていただけるのか、というのが最初の衝撃でした。実践として使える、ちゃんと利益が出る学びを教えてくださっているんだな、とそこで実感しました。"], [915, "りせ", "まやさんもグループの皆さんも、行動力のある方たちが集まっていたからこそだと思います。成果が出て、自分自身に変化したことはありますか？"], [942, "寺沢", "将来への不安が薄れたのが大きいです。会社員の頃は、漠然とした将来の不安がすごくあって、とにかく堅実に貯金していました。その不安が薄れました。"], [987, "寺沢", "フリーランスになったのは、育休中に気持ちが変わって、この先の人生をどう生きたいんだろうと考える時間ができたからです。広告代理店は忙しいので、せっかく来てくれた子どもを抱えてまたあの世界に戻るのはどうなんだろうと思って、フリーランスになりました。"], [1037, "りせ", "私も子どもがいるので、すごく分かります。子どもができると、時間と得られるお金のバランスをなおさら考えますよね。稼ぐのも大事だけど、仕事は増やしたくない。"], [1060, "寺沢", "めちゃくちゃ考えます。時間の制約も出るし、これからお金はかかってくる。教育費は、かけようと思えばいくらでもかけられるので。だから私は、資産運用はマストでやったほうがいいと思います。心の安定も、経済的な安定もカバーしてくれる。"], [1095, "りせ", "最近、「投資をしていなかった世界の最悪を想像する」という話を聞いたんですが、想像するとヤバいなと思って。どんな働き方を選ぶにしても、資産運用はセットでやったほうがいいと思います。"], [1143, "寺沢", "フリーランスだけでなく、会社員でもやっておいたほうがいいと思っています。今、物価が上がって、円安も進んでいる。それに対抗するだけの給料の上昇はないじゃないですか。だったら自分で考えて、コツコツ準備しておかないといけない。副業禁止の会社はあっても、投資が禁止の会社はほとんどないと思うんです。"], [1237, "寺沢", "今年2月に家族でオーストラリアに1週間ほど行って、すごくいい思い出になったんですけど、円安をすごく感じました。大学生の時に1年ほど留学していたので、その頃と比べると円の価値がだいぶ下がっていて。物価も高くて、家族4人でカフェで朝ご飯を食べるだけで、日本の感覚の何倍もかかるんです。子どもたちにもいい刺激になったけど、年に何回も海外に行く生活は、今の日本だと厳しくなってきているなと感じました。だからこそ、楽しむためのお金を株で準備しています。"], [1358, "寺沢", "NISAで長期的にコツコツ積み立てていて、それは将来の教育費や老後のために、何十年という単位で考えています。でも、今この瞬間も豊かに楽しく生きたい。それを個別株の利益でまかないたい、と思ってやっています。"], [1416, "寺沢", "実はこの考え方を教えてくださったのは、りせさんなんです。初めてりせさんにお会いしたのは、都内の小規模なリアルイベントでした。その時に、「積み立て投資は20年後の自分を豊かにする投資。でも個別株投資は、2〜3年後や今の自分を豊かにする投資なんだよ」とおっしゃっていて。それを聞いた時に、20年後の自分への備えはしているけれど、今の私を豊かにするための活動は何かしているかなと考えたら、そこが不足していると思ったんです。子どもが小さい今、お金が欲しい。一緒に豊かに過ごしたい。自分が理想とする人生を叶えるためにやらなきゃいけないことだ、と思いました。"], [1500, "りせ", "嬉しいです。積み立ては、もう無心で続けることが大切で、その間に使ってしまったらもったいない世界だと思います。だからこそ、1年後、2年後、3年後の、本当に今やりたいことにお金を使えることが、皆さんが本来やりたいことだと思うんです。"], [1535, "寺沢", "「いつか」と言っていたら、本当に行けなくなる時が来るなと、今年海外に行って感じました。どんどん値段が上がっているので。うちは小学生の男の子2人なんですけど、思春期を超えたら一緒に旅行に行ってくれなくなるんじゃないかという不安もあって、今のうちにたくさん経験したいと思って投資も頑張っています。"], [1586, "りせ", "お母さんが投資に前向きだと、お子さんにも伝わっていくと思います。親が楽しそうに仕事や投資をしていたら、子どものイメージも良くなっていく。"], [1606, "寺沢", "積極的に学ばせるというより、仕事している姿や投資している姿を見せて、「これは株のお金で飛行機に乗れたんだよ」と言ってあげられると、無意識の部分が変わっていくと思うので、それこそ教育だなと感じます。"], [1666, "りせ", "「まやさんだからできたんでしょう」と思っている方もいると思うんですけど、どう思いますか？"], [1680, "寺沢", "私は同期の中でも、どちらかというとできないほうだと思います。私だからじゃないです。みんなできています。ちゃんとコツコツ調べることができれば、誰でも利益が出る、とは言葉にしにくいですけど、ハナミラが教えてくれることを実践すれば、それなりの結果につながる、という学びをいただいていると思います。"], [1720, "寺沢", "仕事との両立も全然問題なくて、ずっとチャートを見ていることはないです。ハナミラは会社の業績や会社そのものをよく見る教えなので、ずっとチャートを見ている必要はなくて、1日10分、朝や午後に見る時間を作っておけば、時間を取られた感覚はないです。それに、100株より少ない数でも買える証券会社もあるので、少額から始められます。ハードルは低いと思います。会社員の方でも、通勤時間や昼休みにちょっと調べることは全然できると思います。"], [1813, "りせ", "ずっと見ないほうが成績が良かったりしますよね。ずっと見ていると、下がったから売らなきゃ、と無駄な売りをして、その後上がった、なんてこともあるので。"], [1846, "寺沢", "「マイルールを決めなさい」と教えてくださるじゃないですか。どうなったら買って、どうなったら売るか、ルールを決めてから買おう、と。私は未だにそれを破ることがあるんですけど（笑）、そのルールに乗っていれば、ずっと画面を見ていなくても、ルールの状態になった時にポチっとすればいいだけ。時間がない人でもできると思います。"], [1925, "りせ", "数字や計算は得意なほうですか？"], [1932, "寺沢", "自分では得意なイメージはないんですけど、周りからは数字に強いと言ってもらえることは多いです。元々営業職だったので、売上を見るような数字の見方ができて、株を買う時も全部スプレッドシートにまとめちゃう癖があるんです。でも、ノートに書く人はノートで、自分が管理しやすい方法が一番だと思います。"], [1988, "寺沢", "成果の秘訣は、本音で思うんですけど、投資は1人でやるものじゃないということ。投資仲間を作ることが秘訣だと思います。金融や経済の情報は無数にあって、自分1人で追いかけるのはまず不可能。その中から業界や株を選ぶなんて、そもそも時間がないんです。でも投資仲間と一緒にやっていると、みんなが調べたことを持ち寄れるし、自分では気づかない視点を教えてくれる。銘柄発表会でも、自分が気づいていなかった銘柄を発表する人が教えてくれる。情報で勝っている感じがします。どこに身を置いてやるかがすごく大事です。1人だったら続けられていないし、何が正解かも分からなくてモヤモヤしていたと思います。"], [2085, "りせ", "私も同じことを思います。日々、生活が回っていればまあいいか、と後回しにしてしまうこともあると思うんです。でも仲間や環境があると、「私これをやりたかったんだ」と引き戻してくれる。"], [2131, "寺沢", "ふるいにかけられた上質な情報が集まる感じです。みんながそれぞれ株のことを真剣に考えていて、それを分け合ってくれる場になっているので、上質な情報にすぐアクセスできる。みんなが頑張っている姿を見ると、自分も頑張ろうと思えます。1人だったら、自分の仕事が忙しくなったら投資は後回しにしていたかもしれない。でも片足でも突っ込んでおけば、イベントのお知らせなどが来るので、後回しにしなくて済む環境になっていると思います。"], [2211, "寺沢", "みんなと会えるリアルイベントにもすごく感謝しています。最近だとカンボジアのツアーに行かせていただきました。大人の修学旅行みたいで、みんなで一緒に行けたのがすごく思い出になっています。これから伸びていくだろう国の不動産を見たり、お寺や観光地を回ったり。7月に子どもたちを連れてマレーシアに短期留学で行っていたので、東南アジアでも国によって発展も雰囲気も全然違うと分かって、すごく興味深かったです。"], [2316, "寺沢", "1人だったら、カンボジアに行こうとは思わなかったと思います。ハナミラの企画が、今まで興味の対象外だったところにも視野を広げてくれるんです。不動産にも興味が出てきました。不動産をやるにしても頭金を作るところは必要なので、株と組み合わせないといけないなと思います。それに、隣にいる人が「そんな世界があるのね」ということをやっていると、自分の中の当たり前の基準がどんどん上がっていく。コミュニティの良さや魅力はすごくありますね。"], [2469, "寺沢", "お金の考え方でいうと、私はもともとすごく真面目なタイプで、両親が公務員の家庭に育ったので、株とは無縁だったんです。だからギャンブルなんじゃないかという気持ちがあったと思うんですけど、実際に始めて、怪しくないコミュニティで怪しくない方に教えていただいて、今までの先入観が取り払われました。いいものはいいものとしてフラットに見られるようになって、活用できるようになったと思います。"], [2556, "寺沢", "世の中の見方では、株価を調べたくなる瞬間がありますね。うちの子どもたちは電車や車のおもちゃが大好きで、そのメーカーにすごくお世話になっているので、ふとした時に株価を見てみたり。生活の中で自然とやっています。"], [2606, "りせ", "まやさんのお話、とても分かりやすかったです。3daysプログラムでは、まやさんが学んだ株のノウハウを、AIの活用のしかたも含めて3日間で学べます。"], [2662, "寺沢", "私も復習とバージョンアップのために参加します！私のほうでも、クライアントワークをしていて売上を上げたいけれどどうしたらいいか分からない方向けに、新規メンバーの募集をしていて、今回が最後の募集になる予定です。気になる方はインスタからのぞいてみてください。"], [2732, "寺沢", "怖いなと思っている方も、まず一歩踏み出して、その世界を知るところから始めたらいいんじゃないかなと思います。株は少額からでも投資できるし、手頃な金額から買える銘柄もたくさんあります。ちょっと知ることで、その怖さはなくなっていくと思うので、その一歩が、皆さんが理想とする人生に近づく一歩になったらいいなと思います。ハナミラに来てくださったら私もいますので、またイベントでお会いできたら嬉しいです。"], [2803, "りせ", "まやさん、素敵なお話をありがとうございました。まやさんもおっしゃっていましたが、これは特別な人の話ではなく、私たちがお伝えしていることをしっかりやっていただくと、こういう利益が出てくるんです。お金の話は将来の不安にフォーカスされがちですが、今の生活をより豊かにしたり、今の自分をもっと幸せにしたりするためのお金も作って、人生を楽しんでいただけたら嬉しいです。"], [2878, "りせ", "私も独身で子どももいない時に投資を始めて、その時も本当にやってよかったと思っていましたが、子どもが生まれて、なおさらそう思うようになりました。どんなフェーズの女性でも、並行してやっていくと、人生の至るところで投資があってよかったと思うはずです。3daysプログラムは12月1日・3日・5日。考え方、銘柄の選び方、買い方までしっかりお伝えします。"], [2977, "りせ", "今日の感想をオープンチャットに書いていただくと、抽選でAmazonギフト券をプレゼントします。今回は受講生さんとのお話だったので、より身近に感じていただけたと思います。次回は20日21時半から、KADOKAWAの編集長・伊藤直樹さんとのコラボで、AI時代の投資術をお話しします。今日も見てくださってありがとうございました。"]]}];
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => { const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=String(s%60).padStart(2,'0'); return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`; };
const poster = v => `https://i.ytimg.com/vi/${v}/maxresdefault.jpg`;
const play = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';

$('#thumbs').innerHTML = LIVES.map(l => `
  <a class="thumb${l.vid?'':' soon'}" href="#live-${l.id}">
    <div class="img"${l.vid?` style="background-image:url('${poster(l.vid)}')"`:''}>${l.vid?`<span class="play">${play}</span>`:'準備中'}</div>
    <div class="nm">${esc(l.guestName)}</div><div class="dt">${esc(l.date)}</div>
  </a>`).join('');

$('#lives').innerHTML = LIVES.map(l => {
  const head = `<div class="who"><span class="date">${esc(l.date)}</span><span class="gname">${esc(l.guestName)}</span><span class="grole">${esc(l.guestRole||'')}</span></div>`;
  if (l.soon && !l.vid) return `<section class="live" id="live-${l.id}">${head}<div class="soonbox"><strong>アーカイブを準備中です</strong>動画ができしだい、ここに追加します。</div></section>`;
  if (l.soon) return `<section class="live" id="live-${l.id}" data-vid="${l.vid}">${head}
    <div class="player" role="button" tabindex="0" aria-label="アーカイブを再生" style="background-image:url('${poster(l.vid)}')">
      <span class="big">${play}</span><div class="cap"><span>アーカイブを見る</span><span>${esc(l.duration)}</span></div></div>
    <a class="ytlink" href="https://youtu.be/${l.vid}" target="_blank" rel="noopener">YouTubeアプリで開く →</a>
    <h2 class="title">${esc(l.title)}</h2>
    <div class="soonbox"><strong>要約と文字起こしは準備中です</strong>先に動画でご覧ください。</div>
    <a class="totop" href="#top">↑ ゲスト一覧へ</a></section>`;
  const pts = l.slides.map(s => `<li class="pt"><h3>${esc(s.h)}</h3><p>${esc(s.p)}</p>${s.li?`<ul>${s.li.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${s.key?`<div class="key">${esc(s.key)}</div>`:''}<button class="seek" data-t="${s.t}">${play.replace('<svg','<svg width="12" height="12"')}この場面から再生 <span class="tm">${fmt(s.t)}</span></button></li>`).join('');
  const tx = l.transcript.map(([t,w,x]) => `<div class="para"><div class="pm"><button data-t="${t}">${fmt(t)}</button>${w?`<span class="sp${w!=='りせ'?' g':''}">${esc(w==='りせ'?'りせ':w+'さん')}</span>`:''}</div><p>${esc(x)}</p></div>`).join('');
  return `<section class="live" id="live-${l.id}" data-vid="${l.vid}">
    ${head}
    <div class="player" role="button" tabindex="0" aria-label="アーカイブを再生" style="background-image:url('${poster(l.vid)}')">
      <span class="big">${play}</span><div class="cap"><span>アーカイブを見る</span><span>${esc(l.duration)}</span></div>
    </div>
    <a class="ytlink" href="https://youtu.be/${l.vid}" target="_blank" rel="noopener">YouTubeアプリで開く →</a>
    <h2 class="title">${esc(l.title)}</h2>
    <div class="msg"><div class="l">いちばん伝えたいこと</div><p>${esc(l.message)}</p></div>
    <div class="sh">3分で分かる要約</div>
    <ol class="pts fold">${pts}</ol>
    ${l.slides.length>3?`<button class="more">要約をすべて見る（全${l.slides.length}項目）</button>`:''}
    <details class="tx"><summary>全文を読む（文字起こし）</summary><div class="txb"><p class="note">時刻をタップすると、その場面から再生します。</p>${tx}</div></details>
    <a class="totop" href="#top">↑ ゲスト一覧へ</a>
  </section>`;
}).join('');

function startAt(sec, t){
  const vid = sec.dataset.vid, p = $('.player', sec);
  p.classList.add('on');
  p.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${vid}?playsinline=1&rel=0&autoplay=1${t?`&start=${t}`:''}" title="アーカイブ動画" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
}
document.querySelectorAll('.live[data-vid]').forEach(sec => {
  const p = $('.player', sec);
  const go = () => { if (!p.classList.contains('on')) startAt(sec, 0); };
  p.addEventListener('click', go);
  p.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); go(); } });
  sec.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => {
    startAt(sec, +b.dataset.t);
    p.scrollIntoView({behavior:'smooth', block:'center'});
  }));
  const more = $('.more', sec);
  if (more) more.onclick = () => { $('.pts', sec).classList.remove('fold'); more.remove(); };
});
</script>
</body>
</html>
